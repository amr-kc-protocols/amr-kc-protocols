<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" role="img"
     aria-label="Schematic front view of a human head and trunk with four body cavities outlined: the cranial cavity in the head, the thoracic cavity above the diaphragm, the abdominal cavity below it, and the pelvic cavity at the base of the trunk.">
  <title>Body cavities — schematic front view</title>
  <desc>Original schematic drawn for this module. Not traced from any third-party illustration.</desc>
  <style>
    .body{fill:#eef2f7;stroke:#9fb0c6;stroke-width:2}
    .cav{fill:#ffffff;stroke:#7c8ea6;stroke-width:1.6}
    .dia{stroke:#7c8ea6;stroke-width:2;fill:none;stroke-dasharray:5 4}
    .t{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:9px;fill:#5a6676}
  </style>
  <rect width="200" height="320" fill="#f6f8fb"/>
  <!-- head and trunk outline -->
  <path class="body" d="M100 6c-18 0-30 14-30 32 0 12 5 22 12 27l-2 12c-16 4-32 12-32 30v106c0 10 3 18 7 24l6 60h78l6-60c4-6 7-14 7-24V107c0-18-16-26-32-30l-2-12c7-5 12-15 12-27 0-18-12-32-30-32z"/>
  <!-- cranial cavity -->
  <ellipse class="cav" cx="100" cy="36" rx="24" ry="26"/>
  <text class="t" x="100" y="39" text-anchor="middle">cranial</text>
  <!-- thoracic cavity -->
  <path class="cav" d="M58 96h84v62H58z" rx="6"/>
  <text class="t" x="100" y="130" text-anchor="middle">thoracic</text>
  <!-- diaphragm -->
  <path class="dia" d="M58 160q42 16 84 0"/>
  <!-- abdominal cavity -->
  <path class="cav" d="M58 166h84v70H58z"/>
  <text class="t" x="100" y="204" text-anchor="middle">abdominal</text>
  <!-- pelvic cavity -->
  <path class="cav" d="M64 242h72v44H64z"/>
  <text class="t" x="100" y="267" text-anchor="middle">pelvic</text>
</svg>
