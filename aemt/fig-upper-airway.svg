<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" role="img"
     aria-label="Side-view schematic of the upper airway with five numbered pointers, running from the nasal passage behind the nose, down through the throat behind the tongue, past a leaf-shaped flap above the voice box, to the windpipe descending into the chest.">
  <title>Upper airway — side-view schematic with numbered pointers</title>
  <desc>Original schematic drawn for this module. Not traced from any third-party illustration.</desc>
  <style>
    .face{fill:#eef2f7;stroke:#9fb0c6;stroke-width:2}
    .air{fill:#ffffff;stroke:#7c8ea6;stroke-width:1.8}
    .soft{fill:#dde5ef;stroke:#9fb0c6;stroke-width:1.4}
    .pt{fill:#173a68}
    .pn{font-family:system-ui,sans-serif;font-size:10px;font-weight:700;fill:#fff}
  </style>
  <rect width="240" height="300" fill="#f6f8fb"/>
  <!-- head profile, facing left -->
  <path class="face" d="M150 16c-40 0-66 30-66 64 0 14 4 22 4 30 0 6-10 8-10 14 0 5 8 6 8 11 0 6-3 9-3 14 0 8 10 12 22 12v18c0 30 12 46 38 52l40 10V16z"/>
  <!-- nasal passage and nasopharynx -->
  <path class="air" d="M92 74c18-6 40-6 56 0v22c-20 5-38 5-56 0z"/>
  <!-- oral cavity and oropharynx -->
  <path class="air" d="M104 118h44v26h-44z"/>
  <!-- tongue -->
  <path class="soft" d="M100 128q22-14 44-2v16h-44z"/>
  <!-- pharynx descending -->
  <path class="air" d="M120 146h30v36h-30z"/>
  <!-- epiglottis, leaf-shaped flap -->
  <path class="soft" d="M114 170q16-10 26 2-12 8-26-2z"/>
  <!-- larynx -->
  <path class="air" d="M118 186h32v26h-32z"/>
  <!-- trachea -->
  <path class="air" d="M122 214h24v72h-24z"/>
  <g stroke="#9fb0c6" stroke-width="1.2">
    <line x1="122" y1="230" x2="146" y2="230"/><line x1="122" y1="244" x2="146" y2="244"/>
    <line x1="122" y1="258" x2="146" y2="258"/><line x1="122" y1="272" x2="146" y2="272"/>
  </g>
  <!-- numbered pointers -->
  <g>
    <circle class="pt" cx="76.8" cy="60" r="9"/><text class="pn" x="76.8" y="63.5" text-anchor="middle">1</text>
    <circle class="pt" cx="96" cy="120" r="9"/><text class="pn" x="96" y="123.5" text-anchor="middle">2</text>
    <circle class="pt" cx="110.4" cy="165" r="9"/><text class="pn" x="110.4" y="168.5" text-anchor="middle">3</text>
    <circle class="pt" cx="115.2" cy="198" r="9"/><text class="pn" x="115.2" y="201.5" text-anchor="middle">4</text>
    <circle class="pt" cx="120" cy="252" r="9"/><text class="pn" x="120" y="255.5" text-anchor="middle">5</text>
  </g>
</svg>
