<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img"
     aria-label="Outline of a torso divided into four abdominal quadrants by a vertical and a horizontal line crossing at the navel.">
  <title>Abdominal quadrants</title>
  <desc>An original schematic. The patient faces the viewer, so the patient's right is on the viewer's left.</desc>
  <rect width="300" height="300" fill="#ffffff"/>
  <!-- torso outline -->
  <path d="M96 34 q54 -14 108 0 l10 44 q-6 22 -4 46 l6 96 q2 34 -12 48 l-96 0 q-14 -14 -12 -48 l6 -96 q2 -24 -4 -46 z"
        fill="#f4f6f9" stroke="#b9c6d8" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- quadrant dividers, crossing at the navel -->
  <line x1="150" y1="52" x2="150" y2="264" stroke="#1b63c4" stroke-width="2" stroke-dasharray="7 5"/>
  <line x1="88"  y1="150" x2="212" y2="150" stroke="#1b63c4" stroke-width="2" stroke-dasharray="7 5"/>
  <circle cx="150" cy="150" r="4.5" fill="#1b63c4"/>
  <g font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#173a68" text-anchor="middle">
    <text x="119" y="104">RUQ</text>
    <text x="181" y="104">LUQ</text>
    <text x="119" y="206">RLQ</text>
    <text x="181" y="206">LLQ</text>
  </g>
  <g font-family="system-ui,sans-serif" font-size="9.5" fill="#66707c">
    <text x="150" y="22" text-anchor="middle">patient faces you &#8212; their right is on your left</text>
    <text x="150" y="288" text-anchor="middle">navel marks the crossing point</text>
  </g>
</svg>
