<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2761"/>
      <stop offset="100%" stop-color="#131A47"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Lung silhouette -->
  <g transform="translate(256 280)" fill="none" stroke="#CADCFC" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <!-- Trachea -->
    <line x1="0" y1="-130" x2="0" y2="-20"/>
    <!-- Carina branches -->
    <line x1="0" y1="-20" x2="-30" y2="10"/>
    <line x1="0" y1="-20" x2="30" y2="10"/>
    <!-- Left lung -->
    <path d="M -30 10 C -90 30 -110 120 -70 145 C -50 155 -30 130 -30 80 Z"/>
    <!-- Right lung -->
    <path d="M 30 10 C 90 30 110 120 70 145 C 50 155 30 130 30 80 Z"/>
  </g>
  <!-- Terracotta accent dot at top -->
  <circle cx="256" cy="120" r="22" fill="#B85042"/>
</svg>
