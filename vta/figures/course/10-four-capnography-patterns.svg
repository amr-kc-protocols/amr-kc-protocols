<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Four capnography patterns</title>
  <desc id="desc">Normal capnogram, bronchospasm shark-fin pattern, rebreathing with elevated baseline, and sudden loss of waveform.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173F6D" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0B67C2"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#45BDEB"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#C84343"/>
    </marker>
    <style>
      text { font-family: Aptos, Arial, Helvetica, sans-serif; fill: #243548; }
      .label { font-size: 30px; font-weight: 700; fill: #173F6D; }
      .small { font-size: 23px; font-weight: 600; }
      .tiny { font-size: 19px; font-weight: 500; fill: #738396; }
      .micro { font-size: 16px; font-weight: 600; fill: #738396; letter-spacing: 0.6px; }
      .formula { font-size: 34px; font-weight: 700; fill: #173F6D; }
      .card { fill: #FFFFFF; stroke: #CCD7E3; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FBFCFE"/>
  
    
    <rect x="70" y="70" width="700" height="350" rx="28" class="card" filter="url(#shadow)"/>
    <rect x="70" y="70" width="15" height="350" rx="8" fill="#1C7A4A"/>
    <text x="120" y="128" class="label">NORMAL</text>
    <text x="120" y="162" class="tiny">Box-like waveform; baseline returns to zero</text>
    <line x1="125" y1="360" x2="720" y2="360" stroke="#CCD7E3" stroke-width="3"/>
    <path d="M125 360 L215 360 L245 315 L280 260 L635 240 L675 360 L720 360" fill="none" stroke="#0B67C2" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  
    
    <rect x="830" y="70" width="700" height="350" rx="28" class="card" filter="url(#shadow)"/>
    <rect x="830" y="70" width="15" height="350" rx="8" fill="#B86A05"/>
    <text x="880" y="128" class="label">BRONCHOSPASM</text>
    <text x="880" y="162" class="tiny">Sloped upstroke and rising “shark-fin” plateau</text>
    <line x1="885" y1="360" x2="1480" y2="360" stroke="#CCD7E3" stroke-width="3"/>
    <path d="M885 360 L975 360 C1035 355 1110 360 1195 295 C1275 245 1360 240 1405 232 L1440 360 L1480 360" fill="none" stroke="#0B67C2" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  
    
    <rect x="70" y="480" width="700" height="350" rx="28" class="card" filter="url(#shadow)"/>
    <rect x="70" y="480" width="15" height="350" rx="8" fill="#E56B5D"/>
    <text x="120" y="538" class="label">REBREATHING</text>
    <text x="120" y="572" class="tiny">Inspiratory baseline remains above zero</text>
    <line x1="125" y1="770" x2="720" y2="770" stroke="#CCD7E3" stroke-width="3"/>
    <path d="M125 725 L215 725 L245 725 L280 670 L635 650 L675 725 L720 725" fill="none" stroke="#0B67C2" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  
    
    <rect x="830" y="480" width="700" height="350" rx="28" class="card" filter="url(#shadow)"/>
    <rect x="830" y="480" width="15" height="350" rx="8" fill="#C84343"/>
    <text x="880" y="538" class="label">LOST WAVEFORM</text>
    <text x="880" y="572" class="tiny">Sudden drop to zero: assess patient, airway, circuit, and perfusion</text>
    <line x1="885" y1="770" x2="1480" y2="770" stroke="#CCD7E3" stroke-width="3"/>
    <path d="M885 770 L930 770 L955 725 L985 670 L1095 650 L1130 770 L1185 770 L1210 725 L1240 670 L1350 650 L1385 770 L1480 770" fill="none" stroke="#0B67C2" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  
    
</svg>