<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ventilator transport readiness</title>
  <desc id="desc">Six transport readiness checks: power, oxygen, circuit, airway, backup ventilation, and team plan.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173F6D" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0B67C2"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#C84343"/>
    </marker>
    <style>
      text { font-family: Aptos, Arial, Helvetica, sans-serif; fill: #243548; }
      .label { font-size: 30px; font-weight: 700; fill: #173F6D; }
      .small { font-size: 23px; font-weight: 600; }
      .tiny { font-size: 19px; font-weight: 500; fill: #738396; }
      .micro { font-size: 16px; font-weight: 600; fill: #738396; letter-spacing: 0.6px; }
      .formula { font-size: 34px; font-weight: 700; fill: #173F6D; }
      .card { fill: #FFFFFF; stroke: #CCD7E3; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FBFCFE"/>
  
    <rect x="70" y="80" width="1460" height="740" rx="34" class="card" filter="url(#shadow)"/>
    <text x="800" y="150" text-anchor="middle" class="label">TRANSPORT REQUIRES REDUNDANCY</text>
    <path d="M320 300 H1280 M320 535 H1280" stroke="#CCD7E3" stroke-width="14" stroke-linecap="round"/>
    
    <circle cx="320" cy="300" r="62" fill="#EAF3FC" stroke="#0B67C2" stroke-width="5"/>
    <text x="320" y="314" text-anchor="middle" font-size="38" font-weight="700" style="fill:#0B67C2">1</text>
    <text x="320" y="404" text-anchor="middle" class="small">POWER</text>
    <text x="320" y="438" text-anchor="middle" class="tiny">line power + battery reserve</text>
    
    <circle cx="800" cy="300" r="62" fill="#E8F8FD" stroke="#45BDEB" stroke-width="5"/>
    <text x="800" y="314" text-anchor="middle" font-size="38" font-weight="700" style="fill:#45BDEB">2</text>
    <text x="800" y="404" text-anchor="middle" class="small">OXYGEN</text>
    <text x="800" y="438" text-anchor="middle" class="tiny">duration calculated with reserve</text>
    
    <circle cx="1280" cy="300" r="62" fill="#F0EAFE" stroke="#7B3CE8" stroke-width="5"/>
    <text x="1280" y="314" text-anchor="middle" font-size="38" font-weight="700" style="fill:#7B3CE8">3</text>
    <text x="1280" y="404" text-anchor="middle" class="small">CIRCUIT</text>
    <text x="1280" y="438" text-anchor="middle" class="tiny">connections secure · no tension</text>
    
    <circle cx="320" cy="535" r="62" fill="#FBE9E5" stroke="#E56B5D" stroke-width="5"/>
    <text x="320" y="549" text-anchor="middle" font-size="38" font-weight="700" style="fill:#E56B5D">4</text>
    <text x="320" y="639" text-anchor="middle" class="small">AIRWAY</text>
    <text x="320" y="673" text-anchor="middle" class="tiny">depth · capnography · securement</text>
    
    <circle cx="800" cy="535" r="62" fill="#E7F4EC" stroke="#1C7A4A" stroke-width="5"/>
    <text x="800" y="549" text-anchor="middle" font-size="38" font-weight="700" style="fill:#1C7A4A">5</text>
    <text x="800" y="639" text-anchor="middle" class="small">BACKUP</text>
    <text x="800" y="673" text-anchor="middle" class="tiny">BVM + oxygen immediately available</text>
    
    <circle cx="1280" cy="535" r="62" fill="#FCEFD9" stroke="#B86A05" stroke-width="5"/>
    <text x="1280" y="549" text-anchor="middle" font-size="38" font-weight="700" style="fill:#B86A05">6</text>
    <text x="1280" y="639" text-anchor="middle" class="small">TEAM</text>
    <text x="1280" y="673" text-anchor="middle" class="tiny">roles · infusions · handoff plan</text>
    <rect x="220" y="720" width="1160" height="76" rx="22" fill="#173F6D"/>
    <text x="800" y="752" text-anchor="middle" font-size="24" font-weight="700" style="fill:#FFFFFF">BEFORE MOVEMENT: VERIFY THE VENTILATOR, THEN VERIFY THE PATIENT</text>
    <text x="800" y="781" text-anchor="middle" font-size="18" font-weight="500" style="fill:#D7E7F7">Document settings, alarms, airway confirmation, oxygen source, and battery status</text>
    
</svg>