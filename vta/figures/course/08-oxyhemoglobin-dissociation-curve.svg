<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Oxyhemoglobin dissociation curve</title>
  <desc id="desc">Sigmoid relation between arterial oxygen pressure and hemoglobin oxygen saturation, emphasizing the plateau above 60 millimeters of mercury and the steep decline below it.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173F6D" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0B67C2"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#45BDEB"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#C84343"/>
    </marker>
    <style>
      text { font-family: Aptos, Arial, Helvetica, sans-serif; fill: #243548; }
      .label { font-size: 30px; font-weight: 700; fill: #173F6D; }
      .small { font-size: 23px; font-weight: 600; }
      .tiny { font-size: 19px; font-weight: 500; fill: #738396; }
      .micro { font-size: 16px; font-weight: 600; fill: #738396; letter-spacing: 0.6px; }
      .formula { font-size: 34px; font-weight: 700; fill: #173F6D; }
      .card { fill: #FFFFFF; stroke: #CCD7E3; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FBFCFE"/>
  
    <rect x="90" y="70" width="1420" height="740" rx="32" class="card" filter="url(#shadow)"/>
    <rect x="170" y="150" width="1260" height="590" fill="#FFFFFF"/>
    <rect x="800" y="150" width="630" height="590" fill="#EAF3FC" opacity="0.72"/>
    <rect x="170" y="150" width="630" height="590" fill="#FBE9E5" opacity="0.58"/>
    <line x1="170" y1="740" x2="1430" y2="740" stroke="#CCD7E3" stroke-width="2"/>
      <text x="145" y="747" text-anchor="end" class="tiny">0</text><line x1="170" y1="622" x2="1430" y2="622" stroke="#CCD7E3" stroke-width="2"/>
      <text x="145" y="629" text-anchor="end" class="tiny">20</text><line x1="170" y1="504" x2="1430" y2="504" stroke="#CCD7E3" stroke-width="2"/>
      <text x="145" y="511" text-anchor="end" class="tiny">40</text><line x1="170" y1="386" x2="1430" y2="386" stroke="#CCD7E3" stroke-width="2"/>
      <text x="145" y="393" text-anchor="end" class="tiny">60</text><line x1="170" y1="268" x2="1430" y2="268" stroke="#CCD7E3" stroke-width="2"/>
      <text x="145" y="275" text-anchor="end" class="tiny">80</text><line x1="170" y1="150" x2="1430" y2="150" stroke="#CCD7E3" stroke-width="2"/>
      <text x="145" y="157" text-anchor="end" class="tiny">100</text>
    <line x1="170" y1="150" x2="170" y2="740" stroke="#CCD7E3" stroke-width="2"/>
      <text x="170" y="780" text-anchor="middle" class="tiny">0</text><line x1="380" y1="150" x2="380" y2="740" stroke="#CCD7E3" stroke-width="2"/>
      <text x="380" y="780" text-anchor="middle" class="tiny">20</text><line x1="590" y1="150" x2="590" y2="740" stroke="#CCD7E3" stroke-width="2"/>
      <text x="590" y="780" text-anchor="middle" class="tiny">40</text><line x1="800" y1="150" x2="800" y2="740" stroke="#CCD7E3" stroke-width="2"/>
      <text x="800" y="780" text-anchor="middle" class="tiny">60</text><line x1="1010" y1="150" x2="1010" y2="740" stroke="#CCD7E3" stroke-width="2"/>
      <text x="1010" y="780" text-anchor="middle" class="tiny">80</text><line x1="1220" y1="150" x2="1220" y2="740" stroke="#CCD7E3" stroke-width="2"/>
      <text x="1220" y="780" text-anchor="middle" class="tiny">100</text><line x1="1430" y1="150" x2="1430" y2="740" stroke="#CCD7E3" stroke-width="2"/>
      <text x="1430" y="780" text-anchor="middle" class="tiny">120</text>
    <line x1="170" y1="740" x2="1430" y2="740" stroke="#173F6D" stroke-width="4"/>
    <line x1="170" y1="740" x2="170" y2="150" stroke="#173F6D" stroke-width="4"/>
    <path d="M170.0 740.0 L180.5 739.9 L191.0 739.5 L201.5 738.4 L212.0 736.5 L222.5 733.6 L233.0 729.6 L243.5 724.4 L254.0 717.8 L264.5 710.0 L275.0 700.8 L285.5 690.2 L296.0 678.4 L306.5 665.4 L317.0 651.4 L327.5 636.4 L338.0 620.7 L348.5 604.3 L359.0 587.6 L369.5 570.5 L380.0 553.3 L390.5 536.1 L401.0 519.0 L411.5 502.2 L422.0 485.7 L432.5 469.6 L443.0 454.1 L453.5 439.1 L464.0 424.6 L474.5 410.8 L485.0 397.5 L495.5 384.9 L506.0 372.9 L516.5 361.5 L527.0 350.7 L537.5 340.4 L548.0 330.8 L558.5 321.6 L569.0 313.0 L579.5 304.9 L590.0 297.2 L600.5 289.9 L611.0 283.1 L621.5 276.7 L632.0 270.6 L642.5 264.9 L653.0 259.5 L663.5 254.4 L674.0 249.6 L684.5 245.1 L695.0 240.8 L705.5 236.8 L716.0 233.0 L726.5 229.4 L737.0 226.0 L747.5 222.8 L758.0 219.7 L768.5 216.8 L779.0 214.1 L789.5 211.5 L800.0 209.1 L810.5 206.7 L821.0 204.5 L831.5 202.4 L842.0 200.4 L852.5 198.5 L863.0 196.7 L873.5 195.0 L884.0 193.4 L894.5 191.8 L905.0 190.3 L915.5 188.9 L926.0 187.6 L936.5 186.3 L947.0 185.0 L957.5 183.9 L968.0 182.7 L978.5 181.7 L989.0 180.6 L999.5 179.7 L1010.0 178.7 L1020.5 177.8 L1031.0 176.9 L1041.5 176.1 L1052.0 175.3 L1062.5 174.6 L1073.0 173.8 L1083.5 173.1 L1094.0 172.4 L1104.5 171.8 L1115.0 171.2 L1125.5 170.6 L1136.0 170.0 L1146.5 169.4 L1157.0 168.9 L1167.5 168.4 L1178.0 167.9 L1188.5 167.4 L1199.0 166.9 L1209.5 166.5 L1220.0 166.1 L1230.5 165.7 L1241.0 165.3 L1251.5 164.9 L1262.0 164.5 L1272.5 164.1 L1283.0 163.8 L1293.5 163.4 L1304.0 163.1 L1314.5 162.8 L1325.0 162.5 L1335.5 162.2 L1346.0 161.9 L1356.5 161.6 L1367.0 161.4 L1377.5 161.1 L1388.0 160.9 L1398.5 160.6 L1409.0 160.4 L1419.5 160.2 L1430.0 159.9" fill="none" stroke="#0B67C2" stroke-width="11" stroke-linecap="round"/>
    <text x="800" y="840" text-anchor="middle" class="small">PaO₂ (mm Hg)</text>
    <text x="72" y="445" transform="rotate(-90 72 445)" text-anchor="middle" class="small">HEMOGLOBIN SATURATION (%)</text>
    <text x="1115" y="205" text-anchor="middle" class="label">PLATEAU</text>
    <text x="1115" y="238" text-anchor="middle" class="tiny">SpO₂ changes little while PaO₂ can change greatly</text>
    <text x="475" y="205" text-anchor="middle" class="label" style="fill:#C84343">STEEP SLOPE</text>
    <text x="475" y="238" text-anchor="middle" class="tiny">Below ~60 mm Hg, saturation can fall rapidly</text>
    <line x1="800" y1="150" x2="800" y2="740" stroke="#C84343" stroke-width="4" stroke-dasharray="12 10"/>
    
      <circle cx="590" cy="297.17920420767894" r="11" fill="#173F6D"/>
      <rect x="528" y="221.17920420767894" width="124" height="58" rx="14" fill="#EAF3FC" stroke="#0B67C2" stroke-width="2"/>
      <text x="590" y="246.17920420767894" text-anchor="middle" class="micro">PaO₂ 40</text>
      <text x="590" y="269.17920420767894" text-anchor="middle" class="small">≈75%</text>
    
      <circle cx="800" cy="209.05070553462076" r="11" fill="#C84343"/>
      <rect x="738" y="133.05070553462076" width="124" height="58" rx="14" fill="#FBE9E5" stroke="#C84343" stroke-width="2"/>
      <text x="800" y="158.05070553462076" text-anchor="middle" class="micro">PaO₂ 60</text>
      <text x="800" y="181.05070553462076" text-anchor="middle" class="small">≈90%</text>
    
      <circle cx="1010" cy="178.70946961131585" r="11" fill="#173F6D"/>
      <rect x="948" y="102.70946961131585" width="124" height="58" rx="14" fill="#EAF3FC" stroke="#0B67C2" stroke-width="2"/>
      <text x="1010" y="127.70946961131585" text-anchor="middle" class="micro">PaO₂ 80</text>
      <text x="1010" y="150.70946961131585" text-anchor="middle" class="small">≈95%</text>
    
      <circle cx="1220" cy="166.07084476546243" r="11" fill="#173F6D"/>
      <rect x="1158" y="90.07084476546243" width="124" height="58" rx="14" fill="#EAF3FC" stroke="#0B67C2" stroke-width="2"/>
      <text x="1220" y="115.07084476546243" text-anchor="middle" class="micro">PaO₂ 100</text>
      <text x="1220" y="138.07084476546243" text-anchor="middle" class="small">≈98%</text>
    
    
</svg>