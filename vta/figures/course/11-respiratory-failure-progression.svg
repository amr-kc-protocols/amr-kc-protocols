<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Respiratory failure progression</title>
  <desc id="desc">A progression from compensation to fatigue and decompensation, emphasizing trend recognition rather than any single sign.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173F6D" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0B67C2"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#45BDEB"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#C84343"/>
    </marker>
    <style>
      text { font-family: Aptos, Arial, Helvetica, sans-serif; fill: #243548; }
      .label { font-size: 30px; font-weight: 700; fill: #173F6D; }
      .small { font-size: 23px; font-weight: 600; }
      .tiny { font-size: 19px; font-weight: 500; fill: #738396; }
      .micro { font-size: 16px; font-weight: 600; fill: #738396; letter-spacing: 0.6px; }
      .formula { font-size: 34px; font-weight: 700; fill: #173F6D; }
      .card { fill: #FFFFFF; stroke: #CCD7E3; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FBFCFE"/>
  
    <rect x="70" y="95" width="1460" height="680" rx="34" class="card" filter="url(#shadow)"/>
    <path d="M200 380 H1400" fill="none" stroke="#CCD7E3" stroke-width="18" stroke-linecap="round"/>
    <path d="M200 380 H690" fill="none" stroke="#1C7A4A" stroke-width="18" stroke-linecap="round"/>
    <path d="M690 380 H1030" fill="none" stroke="#B86A05" stroke-width="18"/>
    <path d="M1030 380 H1400" fill="none" stroke="#C84343" stroke-width="18" stroke-linecap="round" marker-end="url(#arrow-red)"/>
    
    <circle cx="250" cy="380" r="52" fill="#E7F4EC" stroke="#1C7A4A" stroke-width="5"/>
    <text x="250" y="392" text-anchor="middle" font-size="34" font-weight="700" style="fill:#1C7A4A">1</text>
    <text x="250" y="480" text-anchor="middle" class="small">COMPENSATING</text>
    <text x="250" y="516" text-anchor="middle" class="tiny">tachypnea · tachycardia</text>
    
    <circle cx="610" cy="380" r="52" fill="#EAF3FC" stroke="#0B67C2" stroke-width="5"/>
    <text x="610" y="392" text-anchor="middle" font-size="34" font-weight="700" style="fill:#0B67C2">2</text>
    <text x="610" y="480" text-anchor="middle" class="small">WORKING HARDER</text>
    <text x="610" y="516" text-anchor="middle" class="tiny">accessory muscles · anxiety</text>
    
    <circle cx="970" cy="380" r="52" fill="#FCEFD9" stroke="#B86A05" stroke-width="5"/>
    <text x="970" y="392" text-anchor="middle" font-size="34" font-weight="700" style="fill:#B86A05">3</text>
    <text x="970" y="480" text-anchor="middle" class="small">FATIGUING</text>
    <text x="970" y="516" text-anchor="middle" class="tiny">less air movement · altered mentation</text>
    
    <circle cx="1295" cy="380" r="52" fill="#FBE9E5" stroke="#C84343" stroke-width="5"/>
    <text x="1295" y="392" text-anchor="middle" font-size="34" font-weight="700" style="fill:#C84343">4</text>
    <text x="1295" y="480" text-anchor="middle" class="small">DECOMPENSATING</text>
    <text x="1295" y="516" text-anchor="middle" class="tiny">slowing effort · bradycardia/hypotension</text>
    <rect x="190" y="610" width="1220" height="96" rx="20" fill="#EAF3FC"/>
    <text x="800" y="651" text-anchor="middle" class="small">The trend matters more than any isolated number</text>
    <text x="800" y="687" text-anchor="middle" class="tiny">A “quieter” patient may be improving—or may be running out of reserve</text>
    <text x="800" y="170" text-anchor="middle" class="label">COMPENSATION CAN LOOK BUSY; FAILURE CAN LOOK QUIET</text>
    
</svg>