<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">LTV 1200 circuit connections</title>
  <desc id="desc">Manual-backed schematic showing the main breathing tube on the 22 millimeter outlet, the two noninterchangeable flow-transducer sense lines, and the exhalation-valve driver line.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173F6D" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0B67C2"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#C84343"/>
    </marker>
    <style>
      text { font-family: Aptos, Arial, Helvetica, sans-serif; fill: #243548; }
      .label { font-size: 30px; font-weight: 700; fill: #173F6D; }
      .small { font-size: 23px; font-weight: 600; }
      .tiny { font-size: 19px; font-weight: 500; fill: #738396; }
      .micro { font-size: 16px; font-weight: 600; fill: #738396; letter-spacing: 0.6px; }
      .formula { font-size: 34px; font-weight: 700; fill: #173F6D; }
      .card { fill: #FFFFFF; stroke: #CCD7E3; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FBFCFE"/>
  
    <rect x="70" y="70" width="1460" height="760" rx="34" class="card" filter="url(#shadow)"/>
    <text x="800" y="130" text-anchor="middle" class="label">LTV 1200 RIGHT-SIDE CIRCUIT CONNECTIONS</text>
    <text x="800" y="165" text-anchor="middle" class="tiny">Conceptual schematic based on the operator quick-reference guide</text>
    <path d="M170 235 Q120 450 170 690 L480 690 Q520 450 480 235Z" fill="#EAF3FC" stroke="#173F6D" stroke-width="7"/>
    <text x="325" y="760" text-anchor="middle" class="small">VENTILATOR RIGHT SIDE</text>
    
    <circle cx="420" cy="315" r="33" fill="#FFFFFF" stroke="#0B67C2" stroke-width="8"/>
    <circle cx="420" cy="315" r="21" fill="#EAF3FC" stroke="#CCD7E3" stroke-width="3"/>
    <text x="350" y="322" text-anchor="end" class="small">FLOW XDUCER</text>
    <text x="350" y="349" text-anchor="end" class="tiny">high</text>
    
    <circle cx="420" cy="405" r="33" fill="#FFFFFF" stroke="#45BDEB" stroke-width="8"/>
    <circle cx="420" cy="405" r="21" fill="#EAF3FC" stroke="#CCD7E3" stroke-width="3"/>
    <text x="350" y="412" text-anchor="end" class="small">FLOW XDUCER</text>
    <text x="350" y="439" text-anchor="end" class="tiny">low</text>
    
    <circle cx="420" cy="500" r="33" fill="#FFFFFF" stroke="#7B3CE8" stroke-width="8"/>
    <circle cx="420" cy="500" r="21" fill="#EAF3FC" stroke="#CCD7E3" stroke-width="3"/>
    <text x="350" y="507" text-anchor="end" class="small">EXH VALVE</text>
    <text x="350" y="534" text-anchor="end" class="tiny">driver</text>
    <circle cx="420" cy="625" r="64" fill="#FFFFFF" stroke="#173F6D" stroke-width="10"/>
    <circle cx="420" cy="625" r="38" fill="#EAF3FC" stroke="#CCD7E3" stroke-width="4"/>
    <text x="325" y="615" text-anchor="end" class="small">22 mm OUTLET</text>
    <text x="325" y="642" text-anchor="end" class="tiny">main breathing tube</text>
    <path d="M484 625 C700 625 820 625 1030 590" fill="none" stroke="#173F6D" stroke-width="90" stroke-linecap="round"/>
    <path d="M484 625 C700 625 820 625 1030 590" fill="none" stroke="#EAF3FC" stroke-width="62" stroke-linecap="round"/>
    <path d="M484 625 C700 625 820 625 1030 590" fill="none" stroke="#45BDEB" stroke-width="9" marker-end="url(#arrow-blue)"/>
    <path d="M452 315 C700 250 830 285 1070 435" fill="none" stroke="#0B67C2" stroke-width="11" stroke-linecap="round"/>
    <path d="M452 405 C690 360 830 375 1070 455" fill="none" stroke="#45BDEB" stroke-width="11" stroke-linecap="round"/>
    <path d="M452 500 C700 475 855 485 1070 505" fill="none" stroke="#7B3CE8" stroke-width="11" stroke-linecap="round"/>
    <rect x="1020" y="395" width="260" height="230" rx="32" fill="#FFFFFF" stroke="#173F6D" stroke-width="6"/>
    <circle cx="1080" cy="438" r="18" fill="#EAF3FC" stroke="#0B67C2" stroke-width="5"/>
    <circle cx="1080" cy="473" r="18" fill="#E8F8FD" stroke="#45BDEB" stroke-width="5"/>
    <circle cx="1080" cy="525" r="18" fill="#F0EAFE" stroke="#7B3CE8" stroke-width="5"/>
    <text x="1150" y="675" text-anchor="middle" class="small">FLOW TRANSDUCER +</text>
    <text x="1150" y="706" text-anchor="middle" class="small">EXHALATION VALVE ASSEMBLY</text>
    <path d="M1280 510 H1410" stroke="#173F6D" stroke-width="66" stroke-linecap="round"/>
    <path d="M1280 510 H1410" stroke="#EAF3FC" stroke-width="42" stroke-linecap="round"/>
    <text x="1395" y="470" text-anchor="end" class="small">TO PATIENT</text>
    <rect x="600" y="220" width="360" height="94" rx="20" fill="#FCEFD9" stroke="#B86A05" stroke-width="3"/>
    <text x="780" y="258" text-anchor="middle" class="small">The two Flow Xducer lines</text>
    <text x="780" y="291" text-anchor="middle" class="tiny">use non-interchangeable Luer fittings</text>
    
</svg>