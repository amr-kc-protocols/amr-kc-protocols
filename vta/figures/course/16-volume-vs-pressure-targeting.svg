<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Volume targeting compared with pressure targeting</title>
  <desc id="desc">Volume-targeted ventilation guarantees tidal volume and allows pressure to vary; pressure-targeted ventilation guarantees inspiratory pressure and allows tidal volume to vary.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173F6D" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0B67C2"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#C84343"/>
    </marker>
    <style>
      text { font-family: Aptos, Arial, Helvetica, sans-serif; fill: #243548; }
      .label { font-size: 30px; font-weight: 700; fill: #173F6D; }
      .small { font-size: 23px; font-weight: 600; }
      .tiny { font-size: 19px; font-weight: 500; fill: #738396; }
      .micro { font-size: 16px; font-weight: 600; fill: #738396; letter-spacing: 0.6px; }
      .formula { font-size: 34px; font-weight: 700; fill: #173F6D; }
      .card { fill: #FFFFFF; stroke: #CCD7E3; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FBFCFE"/>
  
    <rect x="70" y="70" width="700" height="760" rx="34" class="card" filter="url(#shadow)"/>
    <rect x="830" y="70" width="700" height="760" rx="34" class="card" filter="url(#shadow)"/>
    <rect x="70" y="70" width="700" height="110" rx="34" fill="#0B67C2"/>
    <path d="M70 145 V104 Q70 70 104 70 H736 Q770 70 770 104 V180 H70Z" fill="#0B67C2"/>
    <rect x="830" y="70" width="700" height="110" rx="34" fill="#7B3CE8"/>
    <path d="M830 145 V104 Q830 70 864 70 H1496 Q1530 70 1530 104 V180 H830Z" fill="#7B3CE8"/>
    <text x="420" y="138" text-anchor="middle" font-size="40" font-weight="700" style="fill:#FFFFFF">VOLUME TARGET</text>
    <text x="1180" y="138" text-anchor="middle" font-size="40" font-weight="700" style="fill:#FFFFFF">PRESSURE TARGET</text>
    <text x="420" y="225" text-anchor="middle" class="label">Vₜ is guaranteed</text>
    <text x="1180" y="225" text-anchor="middle" class="label">Inspiratory pressure is guaranteed</text>
    
    <line x1="160" y1="490" x2="680" y2="490" stroke="#173F6D" stroke-width="3"/>
    <line x1="160" y1="490" x2="160" y2="300" stroke="#173F6D" stroke-width="3"/>
    <text x="420" y="532" text-anchor="middle" class="micro">TIME</text>
    <text x="124" y="395" transform="rotate(-90 124 395)" text-anchor="middle" class="micro">FLOW</text>
    <path d="M160 490 V350 H430 V490 H680" fill="none" stroke="#0B67C2" stroke-width="10" stroke-linejoin="round"/>
    <text x="420" y="330" text-anchor="middle" class="tiny">often constant inspiratory flow</text>
    
    <line x1="920" y1="490" x2="1440" y2="490" stroke="#173F6D" stroke-width="3"/>
    <line x1="920" y1="490" x2="920" y2="300" stroke="#173F6D" stroke-width="3"/>
    <text x="1180" y="532" text-anchor="middle" class="micro">TIME</text>
    <text x="884" y="395" transform="rotate(-90 884 395)" text-anchor="middle" class="micro">FLOW</text>
    <path d="M920 490 V350 C1040 355 1170 410 1290 465 C1340 486 1380 490 1440 490" fill="none" stroke="#7B3CE8" stroke-width="10"/>
    <text x="1180" y="330" text-anchor="middle" class="tiny">decelerating inspiratory flow</text>
    <rect x="155" y="585" width="530" height="150" rx="22" fill="#EAF3FC"/>
    <text x="420" y="625" text-anchor="middle" class="small">Monitor what floats</text>
    <text x="420" y="668" text-anchor="middle" class="formula">Pressure varies</text>
    <text x="420" y="707" text-anchor="middle" class="tiny">Compliance and resistance determine the pressure required</text>
    <rect x="915" y="585" width="530" height="150" rx="22" fill="#F0EAFE"/>
    <text x="1180" y="625" text-anchor="middle" class="small">Monitor what floats</text>
    <text x="1180" y="668" text-anchor="middle" class="formula">Vₜ varies</text>
    <text x="1180" y="707" text-anchor="middle" class="tiny">Compliance, resistance, and effort determine delivered volume</text>
    
</svg>