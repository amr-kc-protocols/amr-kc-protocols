<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Auto-PEEP on a flow-time waveform</title>
  <desc id="desc">Normal expiratory flow returns to zero before the next breath. With auto-PEEP, expiratory flow is still active when the next inspiration starts, indicating trapped gas.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173F6D" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0B67C2"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#C84343"/>
    </marker>
    <style>
      text { font-family: Aptos, Arial, Helvetica, sans-serif; fill: #243548; }
      .label { font-size: 30px; font-weight: 700; fill: #173F6D; }
      .small { font-size: 23px; font-weight: 600; }
      .tiny { font-size: 19px; font-weight: 500; fill: #738396; }
      .micro { font-size: 16px; font-weight: 600; fill: #738396; letter-spacing: 0.6px; }
      .formula { font-size: 34px; font-weight: 700; fill: #173F6D; }
      .card { fill: #FFFFFF; stroke: #CCD7E3; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FBFCFE"/>
  
    <rect x="70" y="80" width="1460" height="740" rx="34" class="card" filter="url(#shadow)"/>
    <text x="420" y="155" text-anchor="middle" class="label">COMPLETE EXHALATION</text>
    <text x="1180" y="155" text-anchor="middle" class="label" style="fill:#C84343">AUTO-PEEP / AIR TRAPPING</text>
    <rect x="120" y="205" width="600" height="430" rx="26" fill="#EAF3FC"/>
    <rect x="880" y="205" width="600" height="430" rx="26" fill="#FBE9E5"/>
    
    <line x1="165" y1="415" x2="665" y2="415" stroke="#CCD7E3" stroke-width="4"/>
    <path d="M165 415 L200 315 L290 315 L310 415
             C385 535 515 415 625 415
             L653 315 L730 315" fill="none" stroke="#0B67C2" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    
    <line x1="925" y1="415" x2="1425" y2="415" stroke="#CCD7E3" stroke-width="4"/>
    <path d="M925 415 L960 315 L1050 315 L1070 415
             C1145 535 1275 467 1315 467
             L1343 315 L1420 315" fill="none" stroke="#C84343" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="420" y="260" text-anchor="middle" class="micro">FLOW ABOVE ZERO = INSPIRATION</text>
    <text x="1180" y="260" text-anchor="middle" class="micro">FLOW BELOW ZERO = EXPIRATION</text>
    <circle cx="620" cy="415" r="12" fill="#1C7A4A"/>
    <line x1="620" y1="415" x2="620" y2="570" stroke="#1C7A4A" stroke-width="4"/>
    <text x="620" y="600" text-anchor="end" class="small" style="fill:#1C7A4A">returns to zero</text>
    <circle cx="1315" cy="467" r="12" fill="#C84343"/>
    <line x1="1315" y1="467" x2="1315" y2="580" stroke="#C84343" stroke-width="4"/>
    <text x="1315" y="610" text-anchor="middle" class="small" style="fill:#C84343">next breath starts too soon</text>
    <rect x="210" y="690" width="1180" height="82" rx="20" fill="#FCEFD9"/>
    <text x="800" y="725" text-anchor="middle" class="small">Create more expiratory time: lower RR · shorten inspiratory time · reduce Vₜ when appropriate</text>
    <text x="800" y="757" text-anchor="middle" class="tiny">If the patient becomes unstable, disconnect briefly to release trapped gas while correcting the cause</text>
    
</svg>