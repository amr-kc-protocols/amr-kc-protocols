<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dead space</title>
  <desc id="desc">Anatomic dead space in conducting airways compared with alveolar dead space caused by ventilation without perfusion.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173F6D" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0B67C2"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#45BDEB"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#C84343"/>
    </marker>
    <style>
      text { font-family: Aptos, Arial, Helvetica, sans-serif; fill: #243548; }
      .label { font-size: 30px; font-weight: 700; fill: #173F6D; }
      .small { font-size: 23px; font-weight: 600; }
      .tiny { font-size: 19px; font-weight: 500; fill: #738396; }
      .micro { font-size: 16px; font-weight: 600; fill: #738396; letter-spacing: 0.7px; }
      .formula { font-size: 34px; font-weight: 700; fill: #173F6D; }
      .card { fill: #FFFFFF; stroke: #CCD7E3; stroke-width: 2; }
      .flow { fill: none; stroke: #45BDEB; stroke-width: 12; stroke-linecap: round; marker-end: url(#arrow-cyan); }
      .blood { fill: none; stroke: #C84343; stroke-width: 12; stroke-linecap: round; marker-end: url(#arrow-red); }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FBFCFE"/>
  
    <rect x="70" y="80" width="690" height="740" rx="34" class="card" filter="url(#shadow)"/>
    <rect x="840" y="80" width="690" height="740" rx="34" class="card" filter="url(#shadow)"/>
    <text x="415" y="145" text-anchor="middle" class="label">ANATOMIC DEAD SPACE</text>
    <text x="1185" y="145" text-anchor="middle" class="label">ALVEOLAR DEAD SPACE</text>
    <text x="415" y="185" text-anchor="middle" class="tiny">Conducting airways move gas but do not exchange it</text>
    <text x="1185" y="185" text-anchor="middle" class="tiny">Air reaches alveoli, but blood flow does not</text>
    <path d="M185 325 H525 C602 325 632 390 632 455" fill="none" stroke="#173F6D" stroke-width="88" stroke-linecap="round"/>
    <path d="M185 325 H525 C602 325 632 390 632 455" fill="none" stroke="#EAF3FC" stroke-width="62" stroke-linecap="round"/>
    <path d="M195 325 H505 C570 325 590 390 590 455" class="flow"/>
    <path d="M592 458 L550 525 M592 458 L635 525" stroke="#173F6D" stroke-width="38" stroke-linecap="round"/>
    <circle cx="544" cy="550" r="38" fill="#FBE9E5" stroke="#E56B5D" stroke-width="4"/>
    <circle cx="638" cy="550" r="38" fill="#FBE9E5" stroke="#E56B5D" stroke-width="4"/>
    <rect x="175" y="650" width="480" height="92" rx="18" fill="#EAF3FC"/>
    <text x="415" y="692" text-anchor="middle" class="small">Normal and unavoidable</text>
    <text x="415" y="724" text-anchor="middle" class="tiny">~2 mL/kg predicted body weight</text>
    <path d="M936,450 C1016.5,450 1051,450 1106.2,450" class="flow"/><path d="M1125.75,576.5 C1217.75,639.75 1309.75,613.3 1363.8,539.7" fill="none" stroke="#CCD7E3" stroke-width="20.7" stroke-linecap="round" stroke-dasharray="20.7 17.25"/>
       <line x1="1212" y1="570.75" x2="1281" y2="639.75" stroke="#C84343" stroke-width="11.5" stroke-linecap="round"/>
       <line x1="1212" y1="639.75" x2="1281" y2="570.75" stroke="#C84343" stroke-width="11.5" stroke-linecap="round"/><circle cx="1152.2" cy="431.6" r="54.05" fill="#F6C4B8" stroke="#E56B5D" stroke-width="3.4499999999999997"/><circle cx="1191.3" cy="383.3" r="56.349999999999994" fill="#F6C4B8" stroke="#E56B5D" stroke-width="3.4499999999999997"/><circle cx="1252.25" cy="369.5" r="59.8" fill="#F6C4B8" stroke="#E56B5D" stroke-width="3.4499999999999997"/><circle cx="1308.6" cy="410.9" r="56.349999999999994" fill="#F6C4B8" stroke="#E56B5D" stroke-width="3.4499999999999997"/><circle cx="1317.8" cy="470.7" r="55.199999999999996" fill="#F6C4B8" stroke="#E56B5D" stroke-width="3.4499999999999997"/><circle cx="1277.55" cy="516.7" r="58.65" fill="#F6C4B8" stroke="#E56B5D" stroke-width="3.4499999999999997"/><circle cx="1214.3" cy="524.75" r="59.8" fill="#F6C4B8" stroke="#E56B5D" stroke-width="3.4499999999999997"/><circle cx="1162.55" cy="493.7" r="55.199999999999996" fill="#F6C4B8" stroke="#E56B5D" stroke-width="3.4499999999999997"/><circle cx="1235" cy="450" r="71.3" fill="#F6C4B8" stroke="#E56B5D" stroke-width="3.4499999999999997"/>
    <rect x="945" y="650" width="480" height="92" rx="18" fill="#FBE9E5"/>
    <text x="1185" y="692" text-anchor="middle" class="small">Ventilation without perfusion</text>
    <text x="1185" y="724" text-anchor="middle" class="tiny">Example: pulmonary embolism</text>
    
</svg>