<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Predicted body weight and tidal volume</title>
  <desc id="desc">Predicted body weight is based on height and sex, not actual body weight. The example shows the different predicted weights and tidal-volume ranges for a five-foot-ten adult male and female.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173F6D" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0B67C2"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#C84343"/>
    </marker>
    <style>
      text { font-family: Aptos, Arial, Helvetica, sans-serif; fill: #243548; }
      .label { font-size: 30px; font-weight: 700; fill: #173F6D; }
      .small { font-size: 23px; font-weight: 600; }
      .tiny { font-size: 19px; font-weight: 500; fill: #738396; }
      .micro { font-size: 16px; font-weight: 600; fill: #738396; letter-spacing: 0.6px; }
      .formula { font-size: 34px; font-weight: 700; fill: #173F6D; }
      .card { fill: #FFFFFF; stroke: #CCD7E3; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FBFCFE"/>
  
    <rect x="70" y="70" width="1460" height="760" rx="34" class="card" filter="url(#shadow)"/>
    <text x="800" y="135" text-anchor="middle" class="label">TIDAL VOLUME STARTS WITH HEIGHT—NOT SCALE WEIGHT</text>
    <path d="M300 265 V650" stroke="#173F6D" stroke-width="18" stroke-linecap="round"/>
    <line x1="255" y1="265" x2="345" y2="265" stroke="#173F6D" stroke-width="10" stroke-linecap="round"/>
    <line x1="255" y1="650" x2="345" y2="650" stroke="#173F6D" stroke-width="10" stroke-linecap="round"/>
    <line x1="250" y1="265" x2="300" y2="265" stroke="#173F6D" stroke-width="6"/><line x1="270" y1="303.5" x2="300" y2="303.5" stroke="#173F6D" stroke-width="3"/><line x1="270" y1="342" x2="300" y2="342" stroke="#173F6D" stroke-width="3"/><line x1="270" y1="380.5" x2="300" y2="380.5" stroke="#173F6D" stroke-width="3"/><line x1="270" y1="419" x2="300" y2="419" stroke="#173F6D" stroke-width="3"/><line x1="250" y1="457.5" x2="300" y2="457.5" stroke="#173F6D" stroke-width="6"/><line x1="270" y1="496" x2="300" y2="496" stroke="#173F6D" stroke-width="3"/><line x1="270" y1="534.5" x2="300" y2="534.5" stroke="#173F6D" stroke-width="3"/><line x1="270" y1="573" x2="300" y2="573" stroke="#173F6D" stroke-width="3"/><line x1="270" y1="611.5" x2="300" y2="611.5" stroke="#173F6D" stroke-width="3"/><line x1="250" y1="650" x2="300" y2="650" stroke="#173F6D" stroke-width="6"/>
    <circle cx="300" cy="220" r="48" fill="#EAF3FC" stroke="#0B67C2" stroke-width="5"/>
    <path d="M300 270 V410 M300 320 L220 385 M300 320 L380 385 M300 410 L235 550 M300 410 L365 550" fill="none" stroke="#0B67C2" stroke-width="24" stroke-linecap="round"/>
    <rect x="185" y="690" width="230" height="76" rx="18" fill="#EAF3FC"/>
    <text x="300" y="724" text-anchor="middle" class="small">Example height</text>
    <text x="300" y="754" text-anchor="middle" class="formula">5′10″</text>
    <rect x="500" y="220" width="440" height="500" rx="28" fill="#EAF3FC" stroke="#0B67C2" stroke-width="3"/>
    <text x="720" y="285" text-anchor="middle" class="label">MALE PBW</text>
    <text x="720" y="333" text-anchor="middle" class="formula">50 + 2.3 ×</text>
    <text x="720" y="370" text-anchor="middle" class="small">inches over 5 ft</text>
    <line x1="565" y1="400" x2="875" y2="400" stroke="#CCD7E3" stroke-width="3"/>
    <text x="720" y="452" text-anchor="middle" font-size="56" font-weight="700" style="fill:#0B67C2">≈73 kg</text>
    <text x="720" y="520" text-anchor="middle" class="small">6–8 mL/kg example range</text>
    <rect x="570" y="548" width="300" height="90" rx="20" fill="#FFFFFF" stroke="#0B67C2" stroke-width="3"/>
    <text x="720" y="605" text-anchor="middle" font-size="38" font-weight="700" style="fill:#173F6D">438–584 mL</text>
    <text x="720" y="680" text-anchor="middle" class="tiny">Use the clinical condition and pressures to refine the target</text>
    <rect x="990" y="220" width="440" height="500" rx="28" fill="#FBE9E5" stroke="#E56B5D" stroke-width="3"/>
    <text x="1210" y="285" text-anchor="middle" class="label">FEMALE PBW</text>
    <text x="1210" y="333" text-anchor="middle" class="formula">45.5 + 2.3 ×</text>
    <text x="1210" y="370" text-anchor="middle" class="small">inches over 5 ft</text>
    <line x1="1055" y1="400" x2="1365" y2="400" stroke="#CCD7E3" stroke-width="3"/>
    <text x="1210" y="452" text-anchor="middle" font-size="56" font-weight="700" style="fill:#E56B5D">≈68.5 kg</text>
    <text x="1210" y="520" text-anchor="middle" class="small">6–8 mL/kg example range</text>
    <rect x="1060" y="548" width="300" height="90" rx="20" fill="#FFFFFF" stroke="#E56B5D" stroke-width="3"/>
    <text x="1210" y="605" text-anchor="middle" font-size="38" font-weight="700" style="fill:#173F6D">411–548 mL</text>
    <text x="1210" y="680" text-anchor="middle" class="tiny">A single 5′10″ shortcut is not sex-neutral</text>
    
</svg>