<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">LTV 1200 monitored data</title>
  <desc id="desc">The LTV monitored-data scan includes PIP, MAP, PEEP, total breath rate, exhaled tidal volume, exhaled minute volume, and measured inspiratory-to-expiratory ratio.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173F6D" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0B67C2"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#C84343"/>
    </marker>
    <style>
      text { font-family: Aptos, Arial, Helvetica, sans-serif; fill: #243548; }
      .label { font-size: 30px; font-weight: 700; fill: #173F6D; }
      .small { font-size: 23px; font-weight: 600; }
      .tiny { font-size: 19px; font-weight: 500; fill: #738396; }
      .micro { font-size: 16px; font-weight: 600; fill: #738396; letter-spacing: 0.6px; }
      .formula { font-size: 34px; font-weight: 700; fill: #173F6D; }
      .card { fill: #FFFFFF; stroke: #CCD7E3; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FBFCFE"/>
  
    <rect x="70" y="70" width="650" height="760" rx="34" class="card" filter="url(#shadow)"/>
    <rect x="790" y="70" width="740" height="760" rx="34" class="card" filter="url(#shadow)"/>
    <text x="395" y="140" text-anchor="middle" class="label">SET VALUES</text>
    <text x="1160" y="140" text-anchor="middle" class="label">MONITORED DATA SCAN</text>
    <text x="395" y="180" text-anchor="middle" class="tiny">What the operator asks the ventilator to do</text>
    <text x="1160" y="180" text-anchor="middle" class="tiny">What the ventilator measures breath by breath</text>
    <rect x="165" y="245" width="460" height="430" rx="28" fill="#173F6D"/>
    <rect x="220" y="300" width="350" height="90" rx="14" fill="#0B1E36" stroke="#45BDEB" stroke-width="4"/>
    <text x="395" y="360" text-anchor="middle" font-size="44" font-weight="700" style="fill:#45BDEB">SET CONTROL</text>
    
      <circle cx="235" cy="450" r="8" fill="#45BDEB"/>
      <text x="255" y="457" font-size="21" font-weight="600" style="fill:#FFFFFF">Mode / breath type</text>
    
      <circle cx="235" cy="494" r="8" fill="#45BDEB"/>
      <text x="255" y="501" font-size="21" font-weight="600" style="fill:#FFFFFF">Breath rate</text>
    
      <circle cx="235" cy="538" r="8" fill="#45BDEB"/>
      <text x="255" y="545" font-size="21" font-weight="600" style="fill:#FFFFFF">Vₜ or pressure control</text>
    
      <circle cx="235" cy="582" r="8" fill="#45BDEB"/>
      <text x="255" y="589" font-size="21" font-weight="600" style="fill:#FFFFFF">Inspiratory time</text>
    
      <circle cx="235" cy="626" r="8" fill="#45BDEB"/>
      <text x="255" y="633" font-size="21" font-weight="600" style="fill:#FFFFFF">FiO₂ · PEEP · sensitivity</text>
    
      <circle cx="235" cy="670" r="8" fill="#45BDEB"/>
      <text x="255" y="677" font-size="21" font-weight="600" style="fill:#FFFFFF">Alarm limits</text>
    
    
    <rect x="875" y="230" width="180" height="62" rx="14" fill="#0B67C2"/>
    <text x="965" y="270" text-anchor="middle" font-size="24" font-weight="700" style="fill:#FFFFFF">PIP</text>
    <text x="1090" y="270" class="small">peak inspiratory pressure</text>
    
    <rect x="875" y="305" width="180" height="62" rx="14" fill="#7B3CE8"/>
    <text x="965" y="345" text-anchor="middle" font-size="24" font-weight="700" style="fill:#FFFFFF">MAP</text>
    <text x="1090" y="345" class="small">mean airway pressure</text>
    
    <rect x="875" y="380" width="180" height="62" rx="14" fill="#E56B5D"/>
    <text x="965" y="420" text-anchor="middle" font-size="24" font-weight="700" style="fill:#FFFFFF">PEEP</text>
    <text x="1090" y="420" class="small">end-expiratory pressure</text>
    
    <rect x="875" y="455" width="180" height="62" rx="14" fill="#1C7A4A"/>
    <text x="965" y="495" text-anchor="middle" font-size="24" font-weight="700" style="fill:#FFFFFF">f</text>
    <text x="1090" y="495" class="small">total breath rate</text>
    
    <rect x="875" y="530" width="180" height="62" rx="14" fill="#B86A05"/>
    <text x="965" y="570" text-anchor="middle" font-size="24" font-weight="700" style="fill:#FFFFFF">Vte</text>
    <text x="1090" y="570" class="small">exhaled tidal volume</text>
    
    <rect x="875" y="605" width="180" height="62" rx="14" fill="#173F6D"/>
    <text x="965" y="645" text-anchor="middle" font-size="24" font-weight="700" style="fill:#FFFFFF">V̇E</text>
    <text x="1090" y="645" class="small">exhaled minute volume</text>
    
    <rect x="875" y="680" width="180" height="62" rx="14" fill="#738396"/>
    <text x="965" y="720" text-anchor="middle" font-size="24" font-weight="700" style="fill:#FFFFFF">I:E</text>
    <text x="1090" y="720" class="small">measured inspiratory : expiratory time</text>
    <rect x="225" y="730" width="340" height="60" rx="16" fill="#FCEFD9"/>
    <text x="395" y="768" text-anchor="middle" class="small">Always compare SET with EXHALED</text>
    
</svg>