<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CPAP compared with bilevel positive airway pressure</title>
  <desc id="desc">CPAP maintains one constant pressure; bilevel pressure alternates between EPAP during expiration and IPAP during inspiration, with pressure support equal to IPAP minus EPAP.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173F6D" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0B67C2"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1C7A4A"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#C84343"/>
    </marker>
    <style>
      text { font-family: Aptos, Arial, Helvetica, sans-serif; fill: #243548; }
      .label { font-size: 30px; font-weight: 700; fill: #173F6D; }
      .small { font-size: 23px; font-weight: 600; }
      .tiny { font-size: 19px; font-weight: 500; fill: #738396; }
      .micro { font-size: 16px; font-weight: 600; fill: #738396; letter-spacing: 0.6px; }
      .formula { font-size: 34px; font-weight: 700; fill: #173F6D; }
      .card { fill: #FFFFFF; stroke: #CCD7E3; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FBFCFE"/>
  
    <rect x="70" y="70" width="700" height="750" rx="34" class="card" filter="url(#shadow)"/>
    <rect x="830" y="70" width="700" height="750" rx="34" class="card" filter="url(#shadow)"/>
    <rect x="70" y="70" width="700" height="110" rx="34" fill="#0B67C2"/>
    <path d="M70 145 V104 Q70 70 104 70 H736 Q770 70 770 104 V180 H70Z" fill="#0B67C2"/>
    <rect x="830" y="70" width="700" height="110" rx="34" fill="#7B3CE8"/>
    <path d="M830 145 V104 Q830 70 864 70 H1496 Q1530 70 1530 104 V180 H830Z" fill="#7B3CE8"/>
    <text x="420" y="139" text-anchor="middle" font-size="42" font-weight="700" style="fill:#FFFFFF">CPAP</text>
    <text x="1180" y="139" text-anchor="middle" font-size="42" font-weight="700" style="fill:#FFFFFF">BILEVEL</text>
    <text x="420" y="225" text-anchor="middle" class="label">One pressure all cycle long</text>
    <text x="1180" y="225" text-anchor="middle" class="label">Two pressure levels</text>
    
    <line x1="175" y1="620" x2="675" y2="620" stroke="#173F6D" stroke-width="4"/>
    <line x1="175" y1="620" x2="175" y2="305" stroke="#173F6D" stroke-width="4"/>
    <text x="425" y="682" text-anchor="middle" class="small">TIME</text>
    <text x="120" y="462.5" transform="rotate(-90 120 462.5)" text-anchor="middle" class="small">PRESSURE</text>
    
    <line x1="935" y1="620" x2="1435" y2="620" stroke="#173F6D" stroke-width="4"/>
    <line x1="935" y1="620" x2="935" y2="305" stroke="#173F6D" stroke-width="4"/>
    <text x="1185" y="682" text-anchor="middle" class="small">TIME</text>
    <text x="880" y="462.5" transform="rotate(-90 880 462.5)" text-anchor="middle" class="small">PRESSURE</text>
    <line x1="175" y1="475" x2="675" y2="475" stroke="#0B67C2" stroke-width="12" stroke-linecap="round"/>
    <text x="660" y="447" text-anchor="end" class="small" style="fill:#0B67C2">constant positive pressure</text>
    <path d="M935 555 H1015 V395 H1145 V555 H1225 V395 H1355 V555 H1435" fill="none" stroke="#7B3CE8" stroke-width="12" stroke-linejoin="round"/>
    <line x1="935" y1="555" x2="1435" y2="555" stroke="#E56B5D" stroke-width="4" stroke-dasharray="12 10"/>
    <line x1="935" y1="395" x2="1435" y2="395" stroke="#0B67C2" stroke-width="4" stroke-dasharray="12 10"/>
    <text x="1415" y="378" text-anchor="end" class="small" style="fill:#0B67C2">IPAP · inspiration</text>
    <text x="1415" y="585" text-anchor="end" class="small" style="fill:#E56B5D">EPAP · expiration</text>
    <path d="M1065 405 V545" stroke="#B86A05" stroke-width="5"/>
    <path d="M1054 425 L1065 405 L1076 425 M1054 525 L1065 545 L1076 525" fill="none" stroke="#B86A05" stroke-width="5" stroke-linecap="round"/>
    <rect x="1045" y="625" width="290" height="68" rx="18" fill="#FCEFD9" stroke="#B86A05" stroke-width="2"/>
    <text x="1190" y="668" text-anchor="middle" class="small">Pressure support = IPAP − EPAP</text>
    <rect x="155" y="700" width="530" height="78" rx="18" fill="#EAF3FC"/>
    <text x="420" y="734" text-anchor="middle" class="small">Primarily improves oxygenation</text>
    <text x="420" y="762" text-anchor="middle" class="tiny">Splints alveoli open throughout the cycle</text>
    <rect x="915" y="700" width="530" height="78" rx="18" fill="#F0EAFE"/>
    <text x="1180" y="734" text-anchor="middle" class="small">Adds inspiratory assistance</text>
    <text x="1180" y="762" text-anchor="middle" class="tiny">Supports ventilation while preserving EPAP</text>
    
</svg>