<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Peak inspiratory pressure and plateau pressure</title>
  <desc id="desc">Pressure-time waveform showing PIP, plateau pressure during an inspiratory hold, PEEP, and the resistive pressure difference.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173F6D" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0B67C2"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#45BDEB"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#C84343"/>
    </marker>
    <style>
      text { font-family: Aptos, Arial, Helvetica, sans-serif; fill: #243548; }
      .label { font-size: 30px; font-weight: 700; fill: #173F6D; }
      .small { font-size: 23px; font-weight: 600; }
      .tiny { font-size: 19px; font-weight: 500; fill: #738396; }
      .micro { font-size: 16px; font-weight: 600; fill: #738396; letter-spacing: 0.7px; }
      .formula { font-size: 34px; font-weight: 700; fill: #173F6D; }
      .card { fill: #FFFFFF; stroke: #CCD7E3; stroke-width: 2; }
      .flow { fill: none; stroke: #45BDEB; stroke-width: 12; stroke-linecap: round; marker-end: url(#arrow-cyan); }
      .blood { fill: none; stroke: #C84343; stroke-width: 12; stroke-linecap: round; marker-end: url(#arrow-red); }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FBFCFE"/>
  
    <line x1="110" y1="700" x2="1490" y2="700" stroke="#173F6D" stroke-width="4"/>
    <line x1="120" y1="745" x2="120" y2="165" stroke="#173F6D" stroke-width="4"/>
    <text x="76" y="435" transform="rotate(-90 76 435)" text-anchor="middle" class="small">AIRWAY PRESSURE</text>
    <text x="800" y="785" text-anchor="middle" class="small">TIME</text>
    <line x1="120" y1="405" x2="1490" y2="405" stroke="#CCD7E3" stroke-width="3" stroke-dasharray="12 12"/>
    <line x1="120" y1="270" x2="1490" y2="270" stroke="#CCD7E3" stroke-width="3" stroke-dasharray="12 12"/>
    <line x1="120" y1="700" x2="1490" y2="700" stroke="#CCD7E3" stroke-width="3" stroke-dasharray="12 12"/>
    <path d="M120 700 L230 700 L245 690 L270 620 L300 490 L332 325 L350 270 L390 310 L420 360 L455 390 L520 405 L790 405 L825 430 L845 520 L860 660 L880 700 L980 700 L995 690 L1020 620 L1050 490 L1082 325 L1100 270 L1140 310 L1170 360 L1205 390 L1270 405 L1450 405" fill="none" stroke="#0B67C2" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="360" y="384" width="430" height="42" rx="18" fill="#EAF3FC" opacity="0.9"/>
    <text x="575" y="376" text-anchor="middle" class="micro">INSPIRATORY HOLD: FLOW = 0</text>
    <circle cx="350" cy="270" r="13" fill="#C84343"/>
    <line x1="350" y1="270" x2="350" y2="160" stroke="#C84343" stroke-width="4"/>
    <rect x="245" y="92" width="210" height="72" rx="18" fill="#FBE9E5"/>
    <text x="350" y="122" text-anchor="middle" class="small">PIP</text>
    <text x="350" y="151" text-anchor="middle" class="tiny">total airway pressure</text>
    <circle cx="575" cy="405" r="13" fill="#0B67C2"/>
    <line x1="575" y1="405" x2="575" y2="515" stroke="#0B67C2" stroke-width="4"/>
    <rect x="455" y="515" width="240" height="78" rx="18" fill="#EAF3FC"/>
    <text x="575" y="547" text-anchor="middle" class="small">Pplat</text>
    <text x="575" y="578" text-anchor="middle" class="tiny">alveolar pressure</text>
    <circle cx="230" cy="700" r="13" fill="#1C7A4A"/>
    <line x1="230" y1="700" x2="230" y2="780" stroke="#1C7A4A" stroke-width="4"/>
    <rect x="135" y="782" width="190" height="68" rx="18" fill="#E7F4EC"/>
    <text x="230" y="825" text-anchor="middle" class="small">PEEP</text>
    <path d="M470 270 H760 M470 405 H760" stroke="#B86A05" stroke-width="5"/>
    <path d="M735 278 L760 270 L752 295 M735 397 L760 405 L752 380" fill="none" stroke="#B86A05" stroke-width="5" stroke-linecap="round"/>
    <rect x="805" y="270" width="370" height="136" rx="22" fill="#FCEFD9" stroke="#B86A05" stroke-width="3"/>
    <text x="990" y="313" text-anchor="middle" class="small">RESISTIVE PRESSURE</text>
    <text x="990" y="351" text-anchor="middle" class="formula">PIP − Pplat</text>
    <text x="990" y="384" text-anchor="middle" class="tiny">measured only when flow stops</text>
    <rect x="990" y="520" width="500" height="92" rx="20" fill="#EAF3FC"/>
    <text x="1240" y="556" text-anchor="middle" class="small">PIP ↑, Pplat unchanged</text>
    <text x="1240" y="590" text-anchor="middle" class="tiny">Think airway resistance</text>
    <rect x="990" y="630" width="500" height="92" rx="20" fill="#FBE9E5"/>
    <text x="1240" y="666" text-anchor="middle" class="small">PIP ↑ and Pplat ↑</text>
    <text x="1240" y="700" text-anchor="middle" class="tiny">Think reduced compliance</text>
    
</svg>