<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">LTV 1200 internal battery indicator</title>
  <desc id="desc">The quick reference guide lists approximately 45 minutes for green, 10 minutes for amber, and 5 minutes for red at nominal settings. The indicator is off while running on AC or an external battery.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173F6D" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0B67C2"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#C84343"/>
    </marker>
    <style>
      text { font-family: Aptos, Arial, Helvetica, sans-serif; fill: #243548; }
      .label { font-size: 30px; font-weight: 700; fill: #173F6D; }
      .small { font-size: 23px; font-weight: 600; }
      .tiny { font-size: 19px; font-weight: 500; fill: #738396; }
      .micro { font-size: 16px; font-weight: 600; fill: #738396; letter-spacing: 0.6px; }
      .formula { font-size: 34px; font-weight: 700; fill: #173F6D; }
      .card { fill: #FFFFFF; stroke: #CCD7E3; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FBFCFE"/>
  
    <text x="800" y="125" text-anchor="middle" class="label">INTERNAL BATTERY INDICATOR · APPROXIMATE TIME AT NOMINAL SETTINGS</text>
    <text x="800" y="170" text-anchor="middle" class="tiny">Treat the internal battery as reserve—not the transport plan</text>
    
    <rect x="90" y="245" width="315" height="420" rx="30" fill="#FFFFFF" stroke="#1C7A4A" stroke-width="4" filter="url(#shadow)"/>
    <circle cx="247.5" cy="340" r="58" fill="#E7F4EC" stroke="#1C7A4A" stroke-width="5"/>
    <circle cx="247.5" cy="340" r="26" fill="#1C7A4A"/>
    <text x="247.5" y="445" text-anchor="middle" class="label">GREEN</text>
    <text x="247.5" y="515" text-anchor="middle" font-size="44" font-weight="700" style="fill:#1C7A4A">~45 min</text>
    <text x="247.5" y="558" text-anchor="middle" class="small">level acceptable</text>
    
    <rect x="455" y="245" width="315" height="420" rx="30" fill="#FFFFFF" stroke="#B86A05" stroke-width="4" filter="url(#shadow)"/>
    <circle cx="612.5" cy="340" r="58" fill="#FCEFD9" stroke="#B86A05" stroke-width="5"/>
    <circle cx="612.5" cy="340" r="26" fill="#B86A05"/>
    <text x="612.5" y="445" text-anchor="middle" class="label">AMBER</text>
    <text x="612.5" y="515" text-anchor="middle" font-size="44" font-weight="700" style="fill:#B86A05">~10 min</text>
    <text x="612.5" y="558" text-anchor="middle" class="small">battery low</text>
    
    <rect x="820" y="245" width="315" height="420" rx="30" fill="#FFFFFF" stroke="#C84343" stroke-width="4" filter="url(#shadow)"/>
    <circle cx="977.5" cy="340" r="58" fill="#FBE9E5" stroke="#C84343" stroke-width="5"/>
    <circle cx="977.5" cy="340" r="26" fill="#C84343"/>
    <text x="977.5" y="445" text-anchor="middle" class="label">RED</text>
    <text x="977.5" y="515" text-anchor="middle" font-size="44" font-weight="700" style="fill:#C84343">~5 min</text>
    <text x="977.5" y="558" text-anchor="middle" class="small">critically low</text>
    
    <rect x="1185" y="245" width="315" height="420" rx="30" fill="#FFFFFF" stroke="#738396" stroke-width="4" filter="url(#shadow)"/>
    <circle cx="1342.5" cy="340" r="58" fill="#EEF1F4" stroke="#738396" stroke-width="5"/>
    <circle cx="1342.5" cy="340" r="26" fill="#738396"/>
    <text x="1342.5" y="445" text-anchor="middle" class="label">OFF</text>
    <text x="1342.5" y="515" text-anchor="middle" font-size="44" font-weight="700" style="fill:#738396">external</text>
    <text x="1342.5" y="558" text-anchor="middle" class="small">AC or battery source</text>
    <rect x="235" y="725" width="1130" height="86" rx="22" fill="#173F6D"/>
    <text x="800" y="760" text-anchor="middle" font-size="25" font-weight="700" style="fill:#FFFFFF">CONFIRM EXTERNAL POWER BEFORE LOADING THE PATIENT</text>
    <text x="800" y="790" text-anchor="middle" font-size="18" font-weight="500" style="fill:#D7E7F7">Actual duration varies with battery condition, settings, and operating conditions</text>
    
</svg>