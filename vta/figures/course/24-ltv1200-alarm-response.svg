<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">LTV 1200 alarm response</title>
  <desc id="desc">Read the alarm message, assess the patient, silence the audible alarm, correct the cause, and press Silence Reset again to clear a corrected alarm. Disconnect and bag when ventilation is unsafe or the cause cannot be resolved.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173F6D" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0B67C2"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#C84343"/>
    </marker>
    <style>
      text { font-family: Aptos, Arial, Helvetica, sans-serif; fill: #243548; }
      .label { font-size: 30px; font-weight: 700; fill: #173F6D; }
      .small { font-size: 23px; font-weight: 600; }
      .tiny { font-size: 19px; font-weight: 500; fill: #738396; }
      .micro { font-size: 16px; font-weight: 600; fill: #738396; letter-spacing: 0.6px; }
      .formula { font-size: 34px; font-weight: 700; fill: #173F6D; }
      .card { fill: #FFFFFF; stroke: #CCD7E3; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FBFCFE"/>
  
    <rect x="70" y="80" width="1460" height="740" rx="34" class="card" filter="url(#shadow)"/>
    <text x="800" y="150" text-anchor="middle" class="label">ALARM RESPONSE: PATIENT FIRST, MESSAGE SECOND, BUTTONS THIRD</text>
    <path d="M220 375 H1380" stroke="#CCD7E3" stroke-width="14" stroke-linecap="round"/>
    
    <circle cx="235" cy="375" r="58" fill="#EAF3FC" stroke="#0B67C2" stroke-width="5"/>
    <text x="235" y="388" text-anchor="middle" font-size="38" font-weight="700" style="fill:#0B67C2">1</text>
    <text x="235" y="475" text-anchor="middle" class="small">READ</text>
    <text x="235" y="508" text-anchor="middle" class="tiny">name the alarm message</text>
    
    <circle cx="515" cy="375" r="58" fill="#FBE9E5" stroke="#E56B5D" stroke-width="5"/>
    <text x="515" y="388" text-anchor="middle" font-size="38" font-weight="700" style="fill:#E56B5D">2</text>
    <text x="515" y="475" text-anchor="middle" class="small">ASSESS</text>
    <text x="515" y="508" text-anchor="middle" class="tiny">patient · airway · circuit</text>
    
    <circle cx="795" cy="375" r="58" fill="#FCEFD9" stroke="#B86A05" stroke-width="5"/>
    <text x="795" y="388" text-anchor="middle" font-size="38" font-weight="700" style="fill:#B86A05">3</text>
    <text x="795" y="475" text-anchor="middle" class="small">SILENCE</text>
    <text x="795" y="508" text-anchor="middle" class="tiny">press Silence/Reset once</text>
    
    <circle cx="1075" cy="375" r="58" fill="#F0EAFE" stroke="#7B3CE8" stroke-width="5"/>
    <text x="1075" y="388" text-anchor="middle" font-size="38" font-weight="700" style="fill:#7B3CE8">4</text>
    <text x="1075" y="475" text-anchor="middle" class="small">CORRECT</text>
    <text x="1075" y="508" text-anchor="middle" class="tiny">fix the identified cause</text>
    
    <circle cx="1355" cy="375" r="58" fill="#E7F4EC" stroke="#1C7A4A" stroke-width="5"/>
    <text x="1355" y="388" text-anchor="middle" font-size="38" font-weight="700" style="fill:#1C7A4A">5</text>
    <text x="1355" y="475" text-anchor="middle" class="small">RESET</text>
    <text x="1355" y="508" text-anchor="middle" class="tiny">press again after correction</text>
    <rect x="215" y="650" width="1170" height="100" rx="22" fill="#FBE9E5" stroke="#C84343" stroke-width="3"/>
    <text x="800" y="692" text-anchor="middle" class="small" style="fill:#C84343">UNSTABLE OR NOT VENTILATING?</text>
    <text x="800" y="727" text-anchor="middle" class="tiny">Disconnect from the ventilator and ventilate by an alternative means while troubleshooting</text>
    
</svg>