<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pediatric ventilation guardrails</title>
  <desc id="desc">Pediatric ventilation uses length-based weight, patient-sized airway and circuit equipment, small tidal volumes measured carefully, age-appropriate rates, and tight alarm surveillance.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173F6D" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: Aptos, Arial, Helvetica, sans-serif; fill: #243548; }
      .label { font-size: 30px; font-weight: 700; fill: #173F6D; }
      .small { font-size: 23px; font-weight: 600; }
      .tiny { font-size: 19px; font-weight: 500; fill: #738396; }
      .micro { font-size: 16px; font-weight: 600; fill: #738396; letter-spacing: 0.6px; }
      .card { fill: #FFFFFF; stroke: #CCD7E3; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FBFCFE"/>
  
    <rect x="70" y="70" width="1460" height="760" rx="34" class="card" filter="url(#shadow)"/>
    <text x="800" y="135" text-anchor="middle" class="label">PEDIATRICS: SMALLER VOLUMES, SMALLER ERRORS, LESS RESERVE</text>
    <circle cx="250" cy="330" r="70" fill="#EAF3FC" stroke="#0B67C2" stroke-width="6"/>
    <path d="M250 405 V555 M250 445 L175 505 M250 445 L325 505 M250 555 L195 680 M250 555 L305 680" fill="none" stroke="#0B67C2" stroke-width="30" stroke-linecap="round"/>
    <path d="M150 700 H350" stroke="#173F6D" stroke-width="10" stroke-linecap="round"/>
    <line x1="145" y1="280" x2="205" y2="280" stroke="#173F6D" stroke-width="6"/><line x1="165" y1="332" x2="205" y2="332" stroke="#173F6D" stroke-width="3"/><line x1="145" y1="384" x2="205" y2="384" stroke="#173F6D" stroke-width="6"/><line x1="165" y1="436" x2="205" y2="436" stroke="#173F6D" stroke-width="3"/><line x1="145" y1="488" x2="205" y2="488" stroke="#173F6D" stroke-width="6"/><line x1="165" y1="540" x2="205" y2="540" stroke="#173F6D" stroke-width="3"/><line x1="145" y1="592" x2="205" y2="592" stroke="#173F6D" stroke-width="6"/><line x1="165" y1="644" x2="205" y2="644" stroke="#173F6D" stroke-width="3"/><line x1="145" y1="696" x2="205" y2="696" stroke="#173F6D" stroke-width="6"/>
    <path d="M205 265 V710" stroke="#173F6D" stroke-width="10"/>
    <text x="250" y="758" text-anchor="middle" class="small">LENGTH-BASED WEIGHT</text>
    
    <circle cx="560" cy="295" r="54" fill="#EAF3FC" stroke="#0B67C2" stroke-width="5"/>
    <text x="560" y="308" text-anchor="middle" font-size="36" font-weight="700" style="fill:#0B67C2">1</text>
    <text x="560" y="395" text-anchor="middle" class="small">SIZE THE EQUIPMENT</text>
    <text x="560" y="429" text-anchor="middle" class="tiny">ETT · circuit · sensors · cuff</text>
    
    <circle cx="920" cy="295" r="54" fill="#FBE9E5" stroke="#E56B5D" stroke-width="5"/>
    <text x="920" y="308" text-anchor="middle" font-size="36" font-weight="700" style="fill:#E56B5D">2</text>
    <text x="920" y="395" text-anchor="middle" class="small">MEASURE SMALL Vₜ</text>
    <text x="920" y="429" text-anchor="middle" class="tiny">mL/kg errors become important quickly</text>
    
    <circle cx="1280" cy="295" r="54" fill="#F0EAFE" stroke="#7B3CE8" stroke-width="5"/>
    <text x="1280" y="308" text-anchor="middle" font-size="36" font-weight="700" style="fill:#7B3CE8">3</text>
    <text x="1280" y="395" text-anchor="middle" class="small">USE AGE-BASED RATE</text>
    <text x="1280" y="429" text-anchor="middle" class="tiny">avoid adult defaults</text>
    
    <circle cx="740" cy="555" r="54" fill="#E7F4EC" stroke="#1C7A4A" stroke-width="5"/>
    <text x="740" y="568" text-anchor="middle" font-size="36" font-weight="700" style="fill:#1C7A4A">4</text>
    <text x="740" y="655" text-anchor="middle" class="small">WATCH EXHALED VOLUME</text>
    <text x="740" y="689" text-anchor="middle" class="tiny">compressible volume and leaks matter</text>
    
    <circle cx="1100" cy="555" r="54" fill="#FCEFD9" stroke="#B86A05" stroke-width="5"/>
    <text x="1100" y="568" text-anchor="middle" font-size="36" font-weight="700" style="fill:#B86A05">5</text>
    <text x="1100" y="655" text-anchor="middle" class="small">SET TIGHT ALARMS</text>
    <text x="1100" y="689" text-anchor="middle" class="tiny">small changes can be clinically large</text>
    <rect x="480" y="740" width="920" height="58" rx="18" fill="#173F6D"/>
    <text x="940" y="778" text-anchor="middle" font-size="22" font-weight="700" style="fill:#FFFFFF">VERIFY EVERY PRESET—A PATIENT CATEGORY IS NOT A PRESCRIPTION</text>
    
</svg>