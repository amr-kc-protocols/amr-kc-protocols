<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Richmond Agitation-Sedation Scale</title>
  <desc id="desc">RASS ranges from positive four, combative, to negative five, unarousable. Sedation depth must be individualized to the patient and clinical indication.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173F6D" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: Aptos, Arial, Helvetica, sans-serif; fill: #243548; }
      .label { font-size: 30px; font-weight: 700; fill: #173F6D; }
      .small { font-size: 23px; font-weight: 600; }
      .tiny { font-size: 19px; font-weight: 500; fill: #738396; }
      .micro { font-size: 16px; font-weight: 600; fill: #738396; letter-spacing: 0.6px; }
      .card { fill: #FFFFFF; stroke: #CCD7E3; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FBFCFE"/>
  
    <rect x="70" y="70" width="1460" height="760" rx="34" class="card" filter="url(#shadow)"/>
    <text x="800" y="130" text-anchor="middle" class="label">RICHMOND AGITATION–SEDATION SCALE</text>
    <text x="800" y="166" text-anchor="middle" class="tiny">Score the patient you see; do not infer a score from the medication dose</text>
    
        <rect x="150" y="220" width="620" height="82" rx="20" fill="#F8DEDE" stroke="#B93030" stroke-width="3"/>
        <circle cx="208" cy="261" r="29" fill="#B93030"/>
        <text x="208" y="270" text-anchor="middle" font-size="25" font-weight="700" style="fill:#FFFFFF">+4</text>
        <text x="262" y="271" class="small">COMBATIVE</text>
        
      
        <rect x="150" y="328" width="620" height="82" rx="20" fill="#FBE5E2" stroke="#CE4B3F" stroke-width="3"/>
        <circle cx="208" cy="369" r="29" fill="#CE4B3F"/>
        <text x="208" y="378" text-anchor="middle" font-size="25" font-weight="700" style="fill:#FFFFFF">+3</text>
        <text x="262" y="379" class="small">VERY AGITATED</text>
        
      
        <rect x="150" y="436" width="620" height="82" rx="20" fill="#FCE9DE" stroke="#E16C43" stroke-width="3"/>
        <circle cx="208" cy="477" r="29" fill="#E16C43"/>
        <text x="208" y="486" text-anchor="middle" font-size="25" font-weight="700" style="fill:#FFFFFF">+2</text>
        <text x="262" y="487" class="small">AGITATED</text>
        
      
        <rect x="150" y="544" width="620" height="82" rx="20" fill="#FCEFD9" stroke="#C8880B" stroke-width="3"/>
        <circle cx="208" cy="585" r="29" fill="#C8880B"/>
        <text x="208" y="594" text-anchor="middle" font-size="25" font-weight="700" style="fill:#FFFFFF">+1</text>
        <text x="262" y="595" class="small">RESTLESS</text>
        
      
        <rect x="150" y="652" width="620" height="82" rx="20" fill="#EAF3FC" stroke="#0B67C2" stroke-width="3"/>
        <circle cx="208" cy="693" r="29" fill="#0B67C2"/>
        <text x="208" y="702" text-anchor="middle" font-size="25" font-weight="700" style="fill:#FFFFFF">0</text>
        <text x="262" y="703" class="small">ALERT &amp; CALM</text>
        
      
        <rect x="830" y="220" width="620" height="82" rx="20" fill="#EAF3FC" stroke="#0B67C2" stroke-width="3"/>
        <circle cx="888" cy="261" r="29" fill="#0B67C2"/>
        <text x="888" y="270" text-anchor="middle" font-size="25" font-weight="700" style="fill:#FFFFFF">−1</text>
        <text x="942" y="271" class="small">DROWSY</text>
      
        <rect x="830" y="328" width="620" height="82" rx="20" fill="#EAF3FC" stroke="#0B67C2" stroke-width="3"/>
        <circle cx="888" cy="369" r="29" fill="#0B67C2"/>
        <text x="888" y="378" text-anchor="middle" font-size="25" font-weight="700" style="fill:#FFFFFF">−2</text>
        <text x="942" y="379" class="small">LIGHT SEDATION</text>
      
        <rect x="830" y="436" width="620" height="82" rx="20" fill="#F0EAFE" stroke="#7B3CE8" stroke-width="3"/>
        <circle cx="888" cy="477" r="29" fill="#7B3CE8"/>
        <text x="888" y="486" text-anchor="middle" font-size="25" font-weight="700" style="fill:#FFFFFF">−3</text>
        <text x="942" y="487" class="small">MODERATE SEDATION</text>
        
      
        <rect x="830" y="544" width="620" height="82" rx="20" fill="#ECECF8" stroke="#5B5B9B" stroke-width="3"/>
        <circle cx="888" cy="585" r="29" fill="#5B5B9B"/>
        <text x="888" y="594" text-anchor="middle" font-size="25" font-weight="700" style="fill:#FFFFFF">−4</text>
        <text x="942" y="595" class="small">DEEP SEDATION</text>
        
      
        <rect x="830" y="652" width="620" height="82" rx="20" fill="#EAF3FC" stroke="#173F6D" stroke-width="3"/>
        <circle cx="888" cy="693" r="29" fill="#173F6D"/>
        <text x="888" y="702" text-anchor="middle" font-size="25" font-weight="700" style="fill:#FFFFFF">−5</text>
        <text x="942" y="703" class="small">UNAROUSABLE</text>
        
      
    <rect x="430" y="775" width="740" height="40" rx="20" fill="#FCEFD9"/>
    <text x="800" y="802" text-anchor="middle" class="tiny">Target depth varies with indication, hemodynamics, neuromuscular blockade, and local protocol</text>
    
</svg>
