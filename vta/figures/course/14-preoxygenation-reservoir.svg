  <text x="380" y="328" text-anchor="middle" font-size="27.900000000000002" font-weight="700" style="fill:#FFFFFF;opacity:1">O₂</text><circle cx="470" cy="345" r="31" fill="#738396" fill-opacity="0.72"/>
  <text x="470" y="353" text-anchor="middle" font-size="27.900000000000002" font-weight="700" style="fill:#FFFFFF;opacity:0.72">N₂</text><circle cx="535" cy="395" r="31" fill="#738396" fill-opacity="0.72"/>
  <text x="535" y="403" text-anchor="middle" font-size="27.900000000000002" font-weight="700" style="fill:#FFFFFF;opacity:0.72">N₂</text><circle cx="325" cy="455" r="31" fill="#738396" fill-opacity="0.72"/>
