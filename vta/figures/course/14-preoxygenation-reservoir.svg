<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Preoxygenation fills the lung oxygen reservoir</title>
  <desc id="desc">Room air leaves the functional residual capacity mostly filled with nitrogen, while effective preoxygenation replaces much of that nitrogen with oxygen and increases the oxygen reservoir before apnea.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173F6D" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0B67C2"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1C7A4A"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#C84343"/>
    </marker>
    <style>
      text { font-family: Aptos, Arial, Helvetica, sans-serif; fill: #243548; }
      .label { font-size: 30px; font-weight: 700; fill: #173F6D; }
      .small { font-size: 23px; font-weight: 600; }
      .tiny { font-size: 19px; font-weight: 500; fill: #738396; }
      .micro { font-size: 16px; font-weight: 600; fill: #738396; letter-spacing: 0.6px; }
      .formula { font-size: 34px; font-weight: 700; fill: #173F6D; }
      .card { fill: #FFFFFF; stroke: #CCD7E3; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FBFCFE"/>
  
    <rect x="70" y="70" width="700" height="760" rx="34" class="card" filter="url(#shadow)"/>
    <rect x="830" y="70" width="700" height="760" rx="34" class="card" filter="url(#shadow)"/>
    <text x="420" y="135" text-anchor="middle" class="label">ROOM AIR</text>
    <text x="1180" y="135" text-anchor="middle" class="label">EFFECTIVE PREOXYGENATION</text>
    <text x="420" y="175" text-anchor="middle" class="tiny">The lung reservoir is mostly nitrogen</text>
    <text x="1180" y="175" text-anchor="middle" class="tiny">High inspired O₂ washes nitrogen out of the FRC</text>
    
    <path d="M400 285 C285 290 210 420 215 570
             C220 700 350 720 400 625
             C425 575 422 380 400 285Z"
          fill="#EAF3FC" fill-opacity="0.9" stroke="#0B67C2" stroke-width="6"/>
    <path d="M440 285 C555 290 630 420 625 570
             C620 700 490 720 440 625
             C415 575 418 380 440 285Z"
          fill="#EAF3FC" fill-opacity="0.9" stroke="#0B67C2" stroke-width="6"/>
    <path d="M420 200 V380 M420 380 L330 480 M420 380 L510 480"
          fill="none" stroke="#173F6D" stroke-width="24" stroke-linecap="round"/>
    
    <path d="M1160 285 C1045 290 970 420 975 570
             C980 700 1110 720 1160 625
             C1185 575 1182 380 1160 285Z"
          fill="#E8F8FD" fill-opacity="0.95" stroke="#45BDEB" stroke-width="6"/>
    <path d="M1200 285 C1315 290 1390 420 1385 570
             C1380 700 1250 720 1200 625
             C1175 575 1178 380 1200 285Z"
          fill="#E8F8FD" fill-opacity="0.95" stroke="#45BDEB" stroke-width="6"/>
    <path d="M1180 200 V380 M1180 380 L1090 480 M1180 380 L1270 480"
          fill="none" stroke="#173F6D" stroke-width="24" stroke-linecap="round"/>
    <circle cx="310" cy="350" r="31" fill="#45BDEB" fill-opacity="1"/>
