  <text x="400" y="438" text-anchor="middle" font-size="27.900000000000002" font-weight="700" style="fill:#FFFFFF;opacity:0.72">N₂</text><circle cx="490" cy="470" r="31" fill="#738396" fill-opacity="0.72"/>
  <text x="490" y="478" text-anchor="middle" font-size="27.900000000000002" font-weight="700" style="fill:#FFFFFF;opacity:0.72">N₂</text><circle cx="355" cy="540" r="31" fill="#738396" fill-opacity="0.72"/>
  <text x="355" y="548" text-anchor="middle" font-size="27.900000000000002" font-weight="700" style="fill:#FFFFFF;opacity:0.72">N₂</text><circle cx="455" cy="555" r="31" fill="#738396" fill-opacity="0.72"/>
  <text x="455" y="563" text-anchor="middle" font-size="27.900000000000002" font-weight="700" style="fill:#FFFFFF;opacity:0.72">N₂</text>
    <circle cx="1070" cy="350" r="31" fill="#45BDEB" fill-opacity="1"/>
  <text x="1070" y="358" text-anchor="middle" font-size="27.900000000000002" font-weight="700" style="fill:#FFFFFF;opacity:1">O₂</text><circle cx="1140" cy="320" r="31" fill="#45BDEB" fill-opacity="1"/>
  <text x="1140" y="328" text-anchor="middle" font-size="27.900000000000002" font-weight="700" style="fill:#FFFFFF;opacity:1">O₂</text><circle cx="1230" cy="345" r="31" fill="#45BDEB" fill-opacity="1"/>
  <text x="1230" y="353" text-anchor="middle" font-size="27.900000000000002" font-weight="700" style="fill:#FFFFFF;opacity:1">O₂</text><circle cx="1295" cy="395" r="31" fill="#45BDEB" fill-opacity="1"/>
  <text x="1295" y="403" text-anchor="middle" font-size="27.900000000000002" font-weight="700" style="fill:#FFFFFF;opacity:1">O₂</text><circle cx="1085" cy="455" r="31" fill="#45BDEB" fill-opacity="1"/>
  <text x="1085" y="463" text-anchor="middle" font-size="27.900000000000002" font-weight="700" style="fill:#FFFFFF;opacity:1">O₂</text><circle cx="1160" cy="430" r="31" fill="#45BDEB" fill-opacity="1"/>
  <text x="1160" y="438" text-anchor="middle" font-size="27.900000000000002" font-weight="700" style="fill:#FFFFFF;opacity:1">O₂</text><circle cx="1250" cy="470" r="31" fill="#45BDEB" fill-opacity="1"/>
  <text x="1250" y="478" text-anchor="middle" font-size="27.900000000000002" font-weight="700" style="fill:#FFFFFF;opacity:1">O₂</text><circle cx="1115" cy="540" r="31" fill="#45BDEB" fill-opacity="1"/>
  <text x="1115" y="548" text-anchor="middle" font-size="27.900000000000002" font-weight="700" style="fill:#FFFFFF;opacity:1">O₂</text><circle cx="1215" cy="555" r="31" fill="#45BDEB" fill-opacity="1"/>
  <text x="1215" y="563" text-anchor="middle" font-size="27.900000000000002" font-weight="700" style="fill:#FFFFFF;opacity:1">O₂</text>
    <rect x="155" y="690" width="530" height="82" rx="18" fill="#FCEFD9"/>
    <text x="420" y="726" text-anchor="middle" class="small">Small oxygen reservoir</text>
    <text x="420" y="756" text-anchor="middle" class="tiny">Desaturation can occur quickly after apnea</text>
    <rect x="915" y="690" width="530" height="82" rx="18" fill="#E8F8FD"/>
    <text x="1180" y="726" text-anchor="middle" class="small">Larger oxygen reservoir</text>
    <text x="1180" y="756" text-anchor="middle" class="tiny">More time before desaturation—but duration varies by patient</text>
    
</svg>