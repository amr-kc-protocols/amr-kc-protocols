<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DOPE ventilator troubleshooting</title>
  <desc id="desc">A four-part ventilator emergency check for dislodgement, obstruction, pneumothorax, and equipment failure.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173F6D" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0B67C2"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#C84343"/>
    </marker>
    <style>
      text { font-family: Aptos, Arial, Helvetica, sans-serif; fill: #243548; }
      .label { font-size: 30px; font-weight: 700; fill: #173F6D; }
      .small { font-size: 23px; font-weight: 600; }
      .tiny { font-size: 19px; font-weight: 500; fill: #738396; }
      .micro { font-size: 16px; font-weight: 600; fill: #738396; letter-spacing: 0.6px; }
      .formula { font-size: 34px; font-weight: 700; fill: #173F6D; }
      .card { fill: #FFFFFF; stroke: #CCD7E3; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FBFCFE"/>
  
    
    <rect x="70" y="140" width="330" height="610" rx="30" fill="#FFFFFF" stroke="#0B67C2" stroke-width="4" filter="url(#shadow)"/>
    <circle cx="235" cy="245" r="74" fill="#EAF3FC" stroke="#0B67C2" stroke-width="6"/>
    <text x="235" y="272" text-anchor="middle" font-size="76" font-weight="700" style="fill:#0B67C2">D</text>
    <text x="235" y="360" text-anchor="middle" class="label">DISLODGEMENT</text>
    
      <circle cx="128" cy="430" r="12" fill="#0B67C2"/>
      <text x="156" y="438" class="small">tube depth</text>
    
      <circle cx="128" cy="505" r="12" fill="#0B67C2"/>
      <text x="156" y="513" class="small">capnography</text>
    
      <circle cx="128" cy="580" r="12" fill="#0B67C2"/>
      <text x="156" y="588" class="small">bilateral sounds</text>
    
    
    <rect x="445" y="140" width="330" height="610" rx="30" fill="#FFFFFF" stroke="#B86A05" stroke-width="4" filter="url(#shadow)"/>
    <circle cx="610" cy="245" r="74" fill="#FCEFD9" stroke="#B86A05" stroke-width="6"/>
    <text x="610" y="272" text-anchor="middle" font-size="76" font-weight="700" style="fill:#B86A05">O</text>
    <text x="610" y="360" text-anchor="middle" class="label">OBSTRUCTION</text>
    
      <circle cx="503" cy="430" r="12" fill="#B86A05"/>
      <text x="531" y="438" class="small">pass suction</text>
    
      <circle cx="503" cy="505" r="12" fill="#B86A05"/>
      <text x="531" y="513" class="small">kink / biting</text>
    
      <circle cx="503" cy="580" r="12" fill="#B86A05"/>
      <text x="531" y="588" class="small">bronchospasm</text>
    
    
    <rect x="820" y="140" width="330" height="610" rx="30" fill="#FFFFFF" stroke="#C84343" stroke-width="4" filter="url(#shadow)"/>
    <circle cx="985" cy="245" r="74" fill="#FBE9E5" stroke="#C84343" stroke-width="6"/>
    <text x="985" y="272" text-anchor="middle" font-size="76" font-weight="700" style="fill:#C84343">P</text>
    <text x="985" y="360" text-anchor="middle" class="label">PNEUMOTHORAX</text>
    
      <circle cx="878" cy="430" r="12" fill="#C84343"/>
      <text x="906" y="438" class="small">sudden PIP rise</text>
    
      <circle cx="878" cy="505" r="12" fill="#C84343"/>
      <text x="906" y="513" class="small">asymmetric exam</text>
    
      <circle cx="878" cy="580" r="12" fill="#C84343"/>
      <text x="906" y="588" class="small">falling BP / SpO₂</text>
    
    
    <rect x="1195" y="140" width="330" height="610" rx="30" fill="#FFFFFF" stroke="#1C7A4A" stroke-width="4" filter="url(#shadow)"/>
    <circle cx="1360" cy="245" r="74" fill="#E7F4EC" stroke="#1C7A4A" stroke-width="6"/>
    <text x="1360" y="272" text-anchor="middle" font-size="76" font-weight="700" style="fill:#1C7A4A">E</text>
    <text x="1360" y="360" text-anchor="middle" class="label">EQUIPMENT</text>
    
      <circle cx="1253" cy="430" r="12" fill="#1C7A4A"/>
      <text x="1281" y="438" class="small">disconnect vent</text>
    
      <circle cx="1253" cy="505" r="12" fill="#1C7A4A"/>
      <text x="1281" y="513" class="small">bag manually</text>
    
      <circle cx="1253" cy="580" r="12" fill="#1C7A4A"/>
      <text x="1281" y="588" class="small">walk the circuit</text>
    
    <rect x="255" y="790" width="1090" height="70" rx="20" fill="#173F6D"/>
    <text x="800" y="834" text-anchor="middle" font-size="21" font-weight="700" style="fill:#FFFFFF">UNSTABLE OR NOT VENTILATING? USE CONTROLLED BVM VENTILATION WITH O₂ + PEEP WHILE TROUBLESHOOTING.</text>
    
</svg>
