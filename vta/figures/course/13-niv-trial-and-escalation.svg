<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Noninvasive ventilation trial and escalation</title>
  <desc id="desc">A monitored NIV trial begins with an appropriate patient, is reassessed within minutes, and either continues with improvement or stops for intubation when the patient worsens.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173F6D" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0B67C2"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1C7A4A"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#C84343"/>
    </marker>
    <style>
      text { font-family: Aptos, Arial, Helvetica, sans-serif; fill: #243548; }
      .label { font-size: 30px; font-weight: 700; fill: #173F6D; }
      .small { font-size: 23px; font-weight: 600; }
      .tiny { font-size: 19px; font-weight: 500; fill: #738396; }
      .micro { font-size: 16px; font-weight: 600; fill: #738396; letter-spacing: 0.6px; }
      .formula { font-size: 34px; font-weight: 700; fill: #173F6D; }
      .card { fill: #FFFFFF; stroke: #CCD7E3; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FBFCFE"/>
  
    <rect x="70" y="80" width="420" height="730" rx="34" class="card" filter="url(#shadow)"/>
    <rect x="590" y="80" width="420" height="730" rx="34" class="card" filter="url(#shadow)"/>
    <rect x="1110" y="80" width="420" height="730" rx="34" class="card" filter="url(#shadow)"/>
    <circle cx="280" cy="180" r="56" fill="#E7F4EC" stroke="#1C7A4A" stroke-width="5"/>
    <path d="M251 181 L271 202 L312 155" fill="none" stroke="#1C7A4A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="280" y="275" text-anchor="middle" class="label">START ONLY IF APPROPRIATE</text>
    <rect x="115" y="325" width="330" height="52" rx="26" fill="#E7F4EC" stroke="#1C7A4A" stroke-width="2"/>
  <text x="280" y="359" text-anchor="middle" font-size="19" font-weight="600" style="fill:#243548">awake and cooperative</text>
    <rect x="115" y="397" width="330" height="52" rx="26" fill="#E7F4EC" stroke="#1C7A4A" stroke-width="2"/>
  <text x="280" y="431" text-anchor="middle" font-size="19" font-weight="600" style="fill:#243548">protecting the airway</text>
    <rect x="115" y="469" width="330" height="52" rx="26" fill="#E7F4EC" stroke="#1C7A4A" stroke-width="2"/>
  <text x="280" y="503" text-anchor="middle" font-size="19" font-weight="600" style="fill:#243548">spontaneously breathing</text>
    <rect x="115" y="541" width="330" height="52" rx="26" fill="#E7F4EC" stroke="#1C7A4A" stroke-width="2"/>
  <text x="280" y="575" text-anchor="middle" font-size="19" font-weight="600" style="fill:#243548">mask can seal</text>
    <rect x="115" y="613" width="330" height="52" rx="26" fill="#E7F4EC" stroke="#1C7A4A" stroke-width="2"/>
  <text x="280" y="647" text-anchor="middle" font-size="19" font-weight="600" style="fill:#243548">closely monitored</text>
    <circle cx="800" cy="180" r="56" fill="#EAF3FC" stroke="#0B67C2" stroke-width="5"/>
    <path d="M800 143 V180 L833 202" fill="none" stroke="#0B67C2" stroke-width="9" stroke-linecap="round"/>
    <text x="800" y="275" text-anchor="middle" class="label">REASSESS IN MINUTES</text>
    <rect x="635" y="325" width="330" height="52" rx="26" fill="#EAF3FC" stroke="#0B67C2" stroke-width="2"/>
  <text x="800" y="359" text-anchor="middle" font-size="19" font-weight="600" style="fill:#243548">work of breathing</text>
    <rect x="635" y="397" width="330" height="52" rx="26" fill="#EAF3FC" stroke="#0B67C2" stroke-width="2"/>
  <text x="800" y="431" text-anchor="middle" font-size="19" font-weight="600" style="fill:#243548">respiratory rate and volume</text>
    <rect x="635" y="469" width="330" height="52" rx="26" fill="#EAF3FC" stroke="#0B67C2" stroke-width="2"/>
  <text x="800" y="503" text-anchor="middle" font-size="19" font-weight="600" style="fill:#243548">mental status</text>
    <rect x="635" y="541" width="330" height="52" rx="26" fill="#EAF3FC" stroke="#0B67C2" stroke-width="2"/>
  <text x="800" y="575" text-anchor="middle" font-size="19" font-weight="600" style="fill:#243548">SpO₂ and EtCO₂ trend</text>
    <rect x="635" y="613" width="330" height="52" rx="26" fill="#EAF3FC" stroke="#0B67C2" stroke-width="2"/>
  <text x="800" y="647" text-anchor="middle" font-size="19" font-weight="600" style="fill:#243548">blood pressure and mask seal</text>
    <circle cx="1320" cy="180" r="56" fill="#FBE9E5" stroke="#C84343" stroke-width="5"/>
    <path d="M1292 152 L1348 208 M1348 152 L1292 208" fill="none" stroke="#C84343" stroke-width="10" stroke-linecap="round"/>
    <text x="1320" y="275" text-anchor="middle" class="label">STOP AND ESCALATE</text>
    <rect x="1155" y="325" width="330" height="52" rx="26" fill="#FBE9E5" stroke="#C84343" stroke-width="2"/>
  <text x="1320" y="359" text-anchor="middle" font-size="19" font-weight="600" style="fill:#243548">apnea or arrest</text>
    <rect x="1155" y="397" width="330" height="52" rx="26" fill="#FBE9E5" stroke="#C84343" stroke-width="2"/>
  <text x="1320" y="431" text-anchor="middle" font-size="19" font-weight="600" style="fill:#243548">cannot protect airway</text>
    <rect x="1155" y="469" width="330" height="52" rx="26" fill="#FBE9E5" stroke="#C84343" stroke-width="2"/>
  <text x="1320" y="503" text-anchor="middle" font-size="19" font-weight="600" style="fill:#243548">active vomiting / aspiration risk</text>
    <rect x="1155" y="541" width="330" height="52" rx="26" fill="#FBE9E5" stroke="#C84343" stroke-width="2"/>
  <text x="1320" y="575" text-anchor="middle" font-size="19" font-weight="600" style="fill:#243548">worsening mentation or fatigue</text>
    <rect x="1155" y="613" width="330" height="52" rx="26" fill="#FBE9E5" stroke="#C84343" stroke-width="2"/>
  <text x="1320" y="647" text-anchor="middle" font-size="19" font-weight="600" style="fill:#243548">shock or clinical deterioration</text>
    <path d="M500 445 H560" stroke="#0B67C2" stroke-width="8" marker-end="url(#arrow-blue)"/>
    <path d="M1020 445 H1080" stroke="#C84343" stroke-width="8" marker-end="url(#arrow-red)"/>
    <rect x="575" y="730" width="450" height="70" rx="18" fill="#FCEFD9"/>
    <text x="800" y="759" text-anchor="middle" class="small">Improving? Continue and titrate.</text>
    <text x="800" y="787" text-anchor="middle" class="tiny">Not improving? Do not prolong a failing trial.</text>
    
</svg>