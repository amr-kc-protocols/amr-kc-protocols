<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Compliance compared with resistance</title>
  <desc id="desc">Compliance describes pressure required to expand the lung; resistance describes pressure lost moving gas through an airway.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173F6D" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0B67C2"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#45BDEB"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#C84343"/>
    </marker>
    <style>
      text { font-family: Aptos, Arial, Helvetica, sans-serif; fill: #243548; }
      .label { font-size: 30px; font-weight: 700; fill: #173F6D; }
      .small { font-size: 23px; font-weight: 600; }
      .tiny { font-size: 19px; font-weight: 500; fill: #738396; }
      .micro { font-size: 16px; font-weight: 600; fill: #738396; letter-spacing: 0.7px; }
      .formula { font-size: 34px; font-weight: 700; fill: #173F6D; }
      .card { fill: #FFFFFF; stroke: #CCD7E3; stroke-width: 2; }
      .flow { fill: none; stroke: #45BDEB; stroke-width: 12; stroke-linecap: round; marker-end: url(#arrow-cyan); }
      .blood { fill: none; stroke: #C84343; stroke-width: 12; stroke-linecap: round; marker-end: url(#arrow-red); }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FBFCFE"/>
  
    <rect x="70" y="80" width="690" height="740" rx="34" class="card" filter="url(#shadow)"/>
    <rect x="840" y="80" width="690" height="740" rx="34" class="card" filter="url(#shadow)"/>
    <text x="415" y="145" text-anchor="middle" class="label">COMPLIANCE</text>
    <text x="1185" y="145" text-anchor="middle" class="label">RESISTANCE</text>
    <text x="415" y="185" text-anchor="middle" class="tiny">How easily the lung expands</text>
    <text x="1185" y="185" text-anchor="middle" class="tiny">How easily gas moves through the airway</text>
    <path d="M205 445 C205 300 310 235 415 235 C520 235 625 300 625 445 C625 610 520 655 415 655 C310 655 205 610 205 445Z" fill="#FBE9E5" stroke="#E56B5D" stroke-width="8"/>
    <path d="M415 238 V350" stroke="#173F6D" stroke-width="34" stroke-linecap="round"/>
    <path d="M415 352 L340 430 M415 352 L490 430" stroke="#173F6D" stroke-width="28" stroke-linecap="round"/>
    <path d="M115 445 H225" class="flow"/>
    <path d="M300 530 C335 565 360 580 415 580 C470 580 495 565 530 530" fill="none" stroke="#C84343" stroke-width="8"/>
    <path d="M320 555 L300 530 L332 523 M510 555 L530 530 L498 523" fill="none" stroke="#C84343" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="165" y="688" width="500" height="78" rx="18" fill="#FBE9E5"/>
    <text x="415" y="723" text-anchor="middle" class="small">Stiff lung → more pressure to inflate</text>
    <text x="415" y="752" text-anchor="middle" class="tiny">Pplat rises</text>
    <path d="M950 445 H1418" stroke="#173F6D" stroke-width="116" stroke-linecap="round"/>
    <path d="M950 445 H1418" stroke="#EAF3FC" stroke-width="68" stroke-linecap="round"/>
    <path d="M965 445 H1390" class="flow"/>
    <path d="M1120 372 L1185 445 L1250 372" fill="#FCEFD9" stroke="#B86A05" stroke-width="6" stroke-linejoin="round"/>
    <path d="M1120 518 L1185 445 L1250 518" fill="#FCEFD9" stroke="#B86A05" stroke-width="6" stroke-linejoin="round"/>
    <rect x="935" y="688" width="500" height="78" rx="18" fill="#EAF3FC"/>
    <text x="1185" y="723" text-anchor="middle" class="small">Narrow airway → more pressure to flow</text>
    <text x="1185" y="752" text-anchor="middle" class="tiny">PIP rises while Pplat may stay normal</text>
    
</svg>