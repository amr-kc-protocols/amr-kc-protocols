<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Type I and Type II respiratory failure</title>
  <desc id="desc">Type I is hypoxemic failure with low arterial oxygen; Type II is hypercapnic failure with elevated arterial carbon dioxide and acute respiratory acidosis.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173F6D" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0B67C2"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#45BDEB"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#C84343"/>
    </marker>
    <style>
      text { font-family: Aptos, Arial, Helvetica, sans-serif; fill: #243548; }
      .label { font-size: 30px; font-weight: 700; fill: #173F6D; }
      .small { font-size: 23px; font-weight: 600; }
      .tiny { font-size: 19px; font-weight: 500; fill: #738396; }
      .micro { font-size: 16px; font-weight: 600; fill: #738396; letter-spacing: 0.6px; }
      .formula { font-size: 34px; font-weight: 700; fill: #173F6D; }
      .card { fill: #FFFFFF; stroke: #CCD7E3; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FBFCFE"/>
  
    <rect x="70" y="70" width="700" height="760" rx="34" class="card" filter="url(#shadow)"/>
    <rect x="830" y="70" width="700" height="760" rx="34" class="card" filter="url(#shadow)"/>
    <rect x="70" y="70" width="700" height="112" rx="34" fill="#0B67C2"/>
    <path d="M70 145 V104 Q70 70 104 70 H736 Q770 70 770 104 V182 H70Z" fill="#0B67C2"/>
    <rect x="830" y="70" width="700" height="112" rx="34" fill="#E56B5D"/>
    <path d="M830 145 V104 Q830 70 864 70 H1496 Q1530 70 1530 104 V182 H830Z" fill="#E56B5D"/>
    <text x="420" y="126" text-anchor="middle" font-size="38" font-weight="700" style="fill:#FFFFFF">TYPE I · HYPOXEMIC</text>
    <text x="1180" y="126" text-anchor="middle" font-size="38" font-weight="700" style="fill:#FFFFFF">TYPE II · HYPERCAPNIC</text>
    <text x="420" y="224" text-anchor="middle" class="label">O₂ loading fails</text>
    <text x="1180" y="224" text-anchor="middle" class="label">CO₂ clearance fails</text>
    
    <rect x="205" y="290" width="140" height="260" rx="70" fill="#FFFFFF" stroke="#CCD7E3" stroke-width="4"/>
    <rect x="227" y="463.6" width="96" height="64.4" rx="48" fill="#0B67C2" opacity="0.88"/>
    <text x="275" y="605" text-anchor="middle" class="formula">PaO₂ &lt; 60</text>
    <text x="275" y="640" text-anchor="middle" class="tiny">mm Hg on room air</text>
    
    <rect x="965" y="290" width="140" height="260" rx="70" fill="#FFFFFF" stroke="#CCD7E3" stroke-width="4"/>
    <rect x="987" y="325.6" width="96" height="202.4" rx="48" fill="#E56B5D" opacity="0.88"/>
    <text x="1035" y="605" text-anchor="middle" class="formula">PaCO₂ ≥ 45</text>
    <text x="1035" y="640" text-anchor="middle" class="tiny">with pH &lt; 7.35 when acute</text>
    <g transform="translate(510,330)">
      <circle cx="0" cy="0" r="92" fill="#EAF3FC" stroke="#0B67C2" stroke-width="5"/>
      <circle cx="-32" cy="-6" r="33" fill="#FBE9E5" stroke="#E56B5D" stroke-width="3"/>
      <circle cx="12" cy="-30" r="36" fill="#FBE9E5" stroke="#E56B5D" stroke-width="3"/>
      <circle cx="42" cy="12" r="34" fill="#FBE9E5" stroke="#E56B5D" stroke-width="3"/>
      <circle cx="-5" cy="32" r="38" fill="#FBE9E5" stroke="#E56B5D" stroke-width="3"/>
      <path d="M-155 0 H-85" stroke="#45BDEB" stroke-width="12" marker-end="url(#arrow-cyan)"/>
      <path d="M42 102 C90 130 132 100 150 62" fill="none" stroke="#C84343" stroke-width="13" stroke-linecap="round"/>
      <path d="M-40 105 C-90 130 -125 95 -145 55" fill="none" stroke="#0B67C2" stroke-width="13" stroke-linecap="round"/>
      <line x1="-5" y1="-128" x2="-5" y2="-78" stroke="#C84343" stroke-width="9"/>
      <line x1="-30" y1="-103" x2="20" y2="-103" stroke="#C84343" stroke-width="9"/>
    </g>
    <g transform="translate(1270,330)">
      <path d="M-145 0 H-55" stroke="#45BDEB" stroke-width="12" marker-end="url(#arrow-cyan)"/>
      <circle cx="25" cy="0" r="102" fill="#EAF3FC" stroke="#173F6D" stroke-width="5"/>
      <text x="25" y="-10" text-anchor="middle" font-size="54" font-weight="700" style="fill:#E56B5D">CO₂</text>
      <text x="25" y="38" text-anchor="middle" class="tiny">retained</text>
      <path d="M86 -78 C155 -110 165 -30 145 20" fill="none" stroke="#E56B5D" stroke-width="12" stroke-linecap="round"/>
      <line x1="110" y1="-83" x2="158" y2="-38" stroke="#C84343" stroke-width="9"/>
      <line x1="158" y1="-83" x2="110" y2="-38" stroke="#C84343" stroke-width="9"/>
    </g>
    <rect x="150" y="640" width="540" height="126" rx="20" fill="#EAF3FC"/>
    <text x="420" y="680" text-anchor="middle" class="small">Common mechanisms</text>
    <text x="420" y="715" text-anchor="middle" class="tiny">V/Q mismatch · shunt · diffusion impairment</text>
    <text x="420" y="748" text-anchor="middle" class="tiny">PaCO₂ is often normal or low early</text>
    <rect x="910" y="640" width="540" height="126" rx="20" fill="#FBE9E5"/>
    <text x="1180" y="680" text-anchor="middle" class="small">Common mechanisms</text>
    <text x="1180" y="715" text-anchor="middle" class="tiny">Reduced drive · muscle fatigue · severe obstruction</text>
    <text x="1180" y="748" text-anchor="middle" class="tiny">Hypoxemia may also be present</text>
    
</svg>