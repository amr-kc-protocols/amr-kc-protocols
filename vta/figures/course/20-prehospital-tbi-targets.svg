<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Prehospital traumatic brain injury targets</title>
  <desc id="desc">Brain Trauma Foundation prehospital targets: oxygen saturation above 90 percent, adult systolic blood pressure at least 110 millimeters of mercury, and end-tidal carbon dioxide 35 to 45 millimeters of mercury.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173F6D" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0B67C2"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#C84343"/>
    </marker>
    <style>
      text { font-family: Aptos, Arial, Helvetica, sans-serif; fill: #243548; }
      .label { font-size: 30px; font-weight: 700; fill: #173F6D; }
      .small { font-size: 23px; font-weight: 600; }
      .tiny { font-size: 19px; font-weight: 500; fill: #738396; }
      .micro { font-size: 16px; font-weight: 600; fill: #738396; letter-spacing: 0.6px; }
      .formula { font-size: 34px; font-weight: 700; fill: #173F6D; }
      .card { fill: #FFFFFF; stroke: #CCD7E3; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FBFCFE"/>
  
    <text x="800" y="115" text-anchor="middle" class="label">PREVENT THE SECOND HIT: HYPOXEMIA · HYPOTENSION · VENTILATION EXTREMES</text>
    
    <rect x="100" y="195" width="420" height="430" rx="30" fill="#FFFFFF" stroke="#0B67C2" stroke-width="4" filter="url(#shadow)"/>
    <circle cx="310" cy="310" r="72" fill="#EAF3FC" stroke="#0B67C2" stroke-width="5"/>
    <text x="310" y="329" text-anchor="middle" font-size="52" font-weight="700" style="fill:#0B67C2">O₂</text>
    <text x="310" y="458" text-anchor="middle" font-size="46" font-weight="700" style="fill:#173F6D">SpO₂ > 90%</text>
    <text x="310" y="510" text-anchor="middle" class="small">continuous pulse oximetry</text>
    
    <rect x="590" y="195" width="420" height="430" rx="30" fill="#FFFFFF" stroke="#C84343" stroke-width="4" filter="url(#shadow)"/>
    <circle cx="800" cy="310" r="72" fill="#FBE9E5" stroke="#C84343" stroke-width="5"/>
    <text x="800" y="329" text-anchor="middle" font-size="52" font-weight="700" style="fill:#C84343">BP</text>
    <text x="800" y="458" text-anchor="middle" font-size="46" font-weight="700" style="fill:#173F6D">SBP ≥ 110</text>
    <text x="800" y="510" text-anchor="middle" class="small">adult target · mm Hg</text>
    
    <rect x="1080" y="195" width="420" height="430" rx="30" fill="#FFFFFF" stroke="#1C7A4A" stroke-width="4" filter="url(#shadow)"/>
    <circle cx="1290" cy="310" r="72" fill="#E7F4EC" stroke="#1C7A4A" stroke-width="5"/>
    <text x="1290" y="329" text-anchor="middle" font-size="52" font-weight="700" style="fill:#1C7A4A">CO₂</text>
    <text x="1290" y="458" text-anchor="middle" font-size="46" font-weight="700" style="fill:#173F6D">EtCO₂ 35–45</text>
    <text x="1290" y="510" text-anchor="middle" class="small">continuous capnography · mm Hg</text>
    <rect x="235" y="690" width="1130" height="100" rx="22" fill="#FCEFD9"/>
    <text x="800" y="730" text-anchor="middle" class="small">Avoid routine hyperventilation</text>
    <text x="800" y="765" text-anchor="middle" class="tiny">Ventilation outside the target may worsen secondary brain injury; follow protocol for impending herniation</text>
    
</svg>