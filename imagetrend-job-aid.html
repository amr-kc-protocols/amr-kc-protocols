d NO representative present — the ambulance crew and the receiving facility CO-SIGN. (3) Paper ABA used due to downtime or tablet failure — requires crew attestation. (4) No signature at all — requires a facility face sheet plus crew attestation; this should be VERY rare.","images":["aba_rep_present.jpg","aba_facility_cosign.jpg","aba_paper_attestation.jpg","aba_no_signature.jpg"],"source_slides":[82,83,84,85]},{"id":"refusal-worksheet","question":"How do I document a patient refusal?","aliases":["refusal signatures","ama documentation","witness signatures"],"keywords":["refusal","worksheet","witness","proxy","guardian","signature"],"answer":"When a refusal disposition is selected, the Refusal Worksheet populates. Complete ALL fields on the refusal form, capture the patient/proxy/guardian signature, and have BOTH crew members sign as witnesses. After selecting the proper Patient Evaluation/Care value, make sure the matching Crew and Transport Dispositions are selected. Remember the deck distinguishes refusals WITH assessment/vitals from refusals WITHOUT — chart the one that actually happened.","source_slides":[57,92,93,94,95,96]},{"id":"als-to-bls","question":"How does the ALS to BLS worksheet work?","aliases":["hand down transfer","als downgrade worksheet"],"keywords":["als to bls","hand down","transfer of care","worksheet"],"answer":"Activated in some systems to document a hand-down transfer of care from an ALS provider to a BLS provider. It is completed BY THE ALS PROVIDER inside the BLS crew's chart, and includes multiple yes/no checklist questions, a narrative section, and a name and signature portion.","source_slides":[90,91]},{"id":"pcs-mnc","question":"What should be on a paper PCS (medical necessity form), and who can sign it?","aliases":["physician certification statement","medical necessity","mnf","pcs","who can sign pcs"],"keywords":["pcs","mnc","mnf","physician certification","medical necessity","signer","48 hours","60 days"],"answer":"The sending facility completes the PCS; the crew never fills in the medical reasons or signs it. Check these four parts before you leave, and ask the facility to fix anything missing:","steps":["Who and where: patient name, DOB, Medicare number, origin, destination and the transport date (required for every non-repetitive trip). It must match your chart.","Why not a wheelchair or car: a checked box AND a written reason specific to this patient today. A checked box with nothing written is not a reason.","Hospital to hospital only: the service the sending hospital does not have. Leave it blank on a discharge to a SNF or home.","The signer: credential checked, printed name, signature and date.","Photograph the finished form into Attachments (see [[entry:attachments-photo|attaching documents]]), and make your narrative state the same reasons."],"warnings":["Scheduled, repetitive transports (e.g., dialysis): the attending physician signs, before the first trip, dated no more than 60 days before the transport.","Unscheduled or non-repetitive transports (e.g., a discharge): the attending physician, or if they can't be reached a PA, NP, CNS, RN, LPN, social worker, case manager or discharge planner who works for the physician or the sending facility and knows the patient. It can be obtained up to 48 hours after the transport.","A signed PCS does not prove medical necessity by itself (42 CFR §410.40(e)(3)(v)). Your assessment and narrative have to show it."],"source_slides":[86,87,88],"images":["pcs_mnc_1.jpg","pcs_mnc_2.jpg","trailing_documents.jpg"],"verified":"42 CFR §410.40 checked on eCFR, Sept 2026"},{"id":"attachments-photo","question":"How do I attach a face sheet, PCS or other paper document?","aliases":["attach face sheet","attach pcs","photo attachment","attachments"],"keywords":["attachment","face sheet","pcs","photo","camera","menu"],"answer":"Open Menu (footer) > Attachments and add a photo. Photograph the page flat, upright and whole, so every line is readable. A rotated or blurry photo is as good as no document to a reviewer. On a posted chart, add attachments in Elite Web (Menu Panel > Attachments).","verified":"Menu > Attachments Checked in Elite Field (KS-KANSAS CITY-Ground), Sept 2026"},{"id":"missing-signature","question":"A crew member signed in their partner's place (or a signature is missing). What do I do?","aliases":["signed for my partner","wrong signature","missing signature","partner signature","signed in place of partner","crew signature","signature in wrong spot"],"keywords":["signature","missing","partner","crew","caregiver","addendum","form"],"answer":"Each crew member must sign for themselves — signing in your partner's place is one of the most common documentation errors, and Clinical Education will request an addendum for these “missing signatures.” The Field Guide app has a built-in Caregiver Signature Form to capture the correct signatures.","steps":["Complete an addendum on the chart acknowledging the signature issue — see [[entry:addendum-how|how to complete an addendum]].","Open the [[url:index.html#forms|Caregiver Signature Form]] in the Field Guide app (Home → More → Caregiver Signature Form).","Enter the date of service and the case number, then have EACH crew member complete their own section: full name, certification level, and signature.","Tap “Save as PDF.” The signed form downloads to your device — attach it to the chart in Elite Web (Menu Panel → Attachments) or send it as directed by Clinical Education."]}]},{"id":"posting","title":"Posting & Finishing","entries":[{"id":"posting","question":"How does posting work?","aliases":["post chart","mark as finished","post early post often"],"keywords":["post","posting","finished","cloud","override","internet"],"answer":"Charts LIVE on the device they were written on until Posted to the ImageTrend cloud. You can post as many times as you want — you'll be prompted to override the existing data with your newer data. Once posted, the chart appears in Elite Web, where it can be edited and finished (but charts can't be created in Web). Posting requires an internet connection. When done, mark the incident as finished while posting. POST EARLY, POST OFTEN — post before closing the chart, after a signature is obtained, and after the CAD updates. This ensures the chart is visible in Web and a copy is retained.","source_slides":[98,107]},{"id":"verify-posted","question":"How do I confirm my chart actually posted and is finished?","aliases":["is my chart posted","cloud icon","green checkmark"],"keywords":["posted","verify","cloud icon","green circle","checkmark"],"answer":"On the tablet home page, look for the Cloud icon and the green circle with a checkmark. Not sure? Log in to Elite Web and search for the chart. A reminder also pops up when you return to the home screen with unposted charts on the device.","source_slides":[99,100]},{"id":"crew-member-completing","question":"Validation says “Crew Member completing this report” is missing (50 points), but it's my chart.","aliases":["crew member completing","1068","50 point rule"],"keywords":["crew member completing","narrative","summary","50"],"answer":"It can be blank even when the start-up box named you. Go to Summary > Narrative and select yourself in Crew Member Completing this Report.","verified":"Checked in Elite Field (KS-KANSAS CITY-Ground), Sept 2026"},{"id":"elite-web-use","question":"How do I find my posted charts in Elite Web?","aliases":["view existing ems","locked chart padlock","web inbox"],"keywords":["elite web","incidents tab","view existing ems","locked","padlock","inbox"],"answer":"In Elite Web, click the Incidents tab, then 'View Existing EMS.' Locked charts display a padlock and generally cannot be unlocked (contact Clinical Support for the narrow exception). Respond to CQI/documentation/billing messages via the Inbox.","source_slides":[102,103,104]},{"id":"addendum-how","question":"How do I complete an addendum on a posted chart?","aliases":["complete an addendum","addendum","add addendum","amend my chart","correct a posted chart","late entry","fix a posted chart"],"keywords":["addendum","posted","elite web","menu panel","amend","correction"],"answer":"Once a chart is posted, the original documentation is not rewritten — changes and late additions are made by addendum in Elite Web. The addendum becomes a permanent part of the record alongside the original.","steps":["Log in to Elite Web and click the Incidents tab, then “View Existing EMS.”","Search for the incident by response number, crew member, or unit, and open the chart.","Open the Menu Panel and select Addendums, then create a new addendum.","Document what is being added or corrected — and why — then save. The original entry remains; the addendum is appended to the record."]}]},{"id":"troubleshooting","title":"Troubleshooting & Support","entries":[{"id":"trouble-cant-post","question":"I can't post my chart. Why?","aliases":["post button not working","closed call rules"],"keywords":["can't post","closed call rules","validation","read only"],"answer":"You can't post because closed-call validation rules aren't satisfied. Click the validation score and complete the listed rules — clicking a rule generally takes you where you need to go. If a rule sends you to a read-only section (Medications/Procedures), make the edit in the Timeline instead. Once the closed-call rules are satisfied, post and keep working.","source_slides":[107]},{"id":"trouble-visibility","question":"A required field is hidden or has a value I can't see to fix. What do I do?","aliases":["hidden field","visibility rules","cancelled time stuck"],"keywords":["visibility rules","hidden","disposition","cancelled time"],"answer":"Visibility rules can hide fields that are either required-and-blank or completed inappropriately. Temporarily change the disposition to make the field visible, fix it, then change the disposition back. Example: a cancelled time hidden by visibility rules — change the disposition to cancelled, delete the time, then restore the correct disposition.","source_slides":[107]},{"id":"trouble-missing-chart","question":"I can't find my chart. Where is it?","aliases":["chart disappeared","lost chart","chart not in web"],"keywords":["can't find","missing chart","field incident cloud","wrong cad","search"],"answer":"Work through these in order: (1) Did you post it? If not, check the Field Incident Cloud. (2) Did you download an INCORRECT CAD? In Elite Web, search by the crew member who completed the chart, then replace the CAD with the correct data set. (3) Did you post WITHOUT any CAD? In Elite Web, search by unit number or crew member and REMOVE the date/time from the search criteria. (4) If the chart was never started, it won't exist in Field or Web, and the CAD data will show it was never downloaded.","source_slides":[107]},{"id":"missing-report","question":"Clinical Education says I have a missing report. How do I fix it?","aliases":["hunter asked me to fix a missing report","hunter","missing report","fix a missing report","response number has no pcr","missing pcr","no report for response number"],"keywords":["missing","report","pcr","response number","duplicate","wait and return","posted","final","finalized"],"answer":"A missing-report notice means the system shows a response number that should have a PCR, but no PCR has been received for it. It is almost always one of three things — work through them in order.","steps":["Wrong or duplicate run number: the report may have been completed under a different response number — frequently a duplicate chart, especially on wait-and-return calls. In Elite Web, search by crew member or unit to find the chart and confirm which response number it was completed under. If the report was written under the wrong response number, an addendum is required indicating what the correct run number should be — see [[entry:addendum-how|how to complete an addendum]].","Never posted: an unposted chart still lives on the computer that created it. Log in to Elite Field on the originating device, open the chart, and Post it.","Posted but not finalized: in Elite Web, search for the response number, open the incident, and check the box marking the report as final."]},{"id":"missing-facility","question":"The facility I need isn't in the facility list. What do I do?","aliases":["missing facility","facility not listed","add a facility","facility not in list","can't find facility","hospital not listed","destination not listed"],"keywords":["facility","list","clinical support","ticket","destination","add"],"answer":"Missing facilities are added through a Clinical Support ticket. The instructions are simple, but the ticket has to be exact.","steps":["Open a ticket with [[url:https://support-clinical.gmr.net|Clinical Support]] — the “GMR - Clinical Support” tile in Okta.","Request that the facility be added to the facility list.","Include the EXACT correct facility name and the full address."]},{"id":"kayako-support","question":"How do I get ImageTrend support or file a ticket?","aliases":["file a ticket","contact support","clinical informatics","clinical support portal","kayako"],"keywords":["clinical support","okta","ticket","support","clinical informatics","kayako"],"answer":"Support is provided internally by GMR Clinical Informatics. File a ticket through the Clinical Support portal (support-clinical.gmr.net) — open the 'GMR - Clinical Support' tile in Okta and click 'Submit a New Request'. The portal also has a searchable Knowledge Base/FAQ and shows your open and recently resolved tickets. (This portal replaces the former Kayako site.) Tickets are triaged like patients — the better the information you provide (unit, incident number, error codes, screenshots, what you already tried), the faster it resolves.","source_slides":[108,109]},{"id":"kayako-unlock","question":"My chart auto-locked. Can it be unlocked? What else can Clinical Support do?","aliases":["unlock chart","auto lock","336 hours","add facility","fix my name","kayako"],"keywords":["kayako","unlock","auto-lock","14 days","facility list","certification number","enhancement"],"answer":"Charts auto-lock after being left unfinished for 336 hours (14 days). Clinical Support can unlock an auto-locked chart only in narrow cases, so open a ticket with the incident number and what needs to change. Clinical Support can also: pull charts from the Field Incident Cloud; add response and incident numbers when none exist in CAD (CAD outage or Logis issues; you MUST also put those numbers in your narrative); correct name spelling or an incorrect certification number (in conjunction with GMR Connect, ImageTrend Licensure, or Ninth Brain); facilitate adding facilities to the facility lists; and facilitate product enhancement requests when possible.","source_slides":[110]}]}]};
var TOPIC_ICONS = {"basics": "i-doc", "devices": "i-lungs", "crew": "i-cap", "toolbar": "i-wrench", "incidents": "i-clipboard", "validation": "i-check-circle", "demographics": "i-edit", "times": "i-calendar", "dispositions": "i-key", "clinical": "i-heart", "billing": "i-doc", "worksheets": "i-edit", "posting": "i-download", "troubleshooting": "i-wrench"};
var ASSET_DIR = 'imagetrend-assets/';

function $(id){ return document.getElementById(id); }
function escHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function highlight(text, q){
  if(!q) return escHtml(text);
  var esc = escHtml(text);
  var toks = q.trim().split(/\s+/).filter(function(t){ return t.length >= 2; }).map(function(t){
    return escHtml(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  });
  if(!toks.length) return esc;
  return esc.replace(new RegExp('('+toks.join('|')+')', 'ig'), '<mark>$1</mark>');
}

var allEntries = [];
KB.topics.forEach(function(t){
  t.entries.forEach(function(e){ allEntries.push({ topic: t, entry: e }); });
});

// Inline links in KB text: [[entry:id|label]] jumps to another entry,
// [[url:href|label]] renders a normal link. Applied AFTER escaping.
function linkify(html){
  return html.replace(/\[\[(entry|url):([^\]|]+)\|([^\]]*)\]\]/g, function(_, kind, target, label){
    target = target.replace(/<\/?mark>/g, ''); // search highlighting must not break the target
    if(kind === 'entry') return '<span class="e-link" data-jump="'+target+'">'+label+'</span>';
    var ext = /^https?:/i.test(target);
    return '<a class="e-link" href="'+target+'"'+(ext?' target="_blank" rel="noopener"':'')+'>'+label+'</a>';
  });
}

function entryHtml(e, q, openIt){
  var h = '<div class="entry'+(openIt?' open':'')+'" data-entry="'+e.id+'">';
  h += '<div class="entry-hdr" data-toggle-entry="'+e.id+'">';
  h += '<div class="entry-q">'+highlight(e.question, q)+'</div>';
  h += '<div class="entry-chevron">&#x203A;</div></div>';
  h += '<div class="entry-body">';
  h += '<div class="entry-answer">'+linkify(highlight(e.answer, q))+'</div>';
  if(e.steps && e.steps.length){
    h += '<div class="entry-steps">';
    e.steps.forEach(function(s, i){
      h += '<div class="e-step"><div class="e-step-num">'+(i+1)+'</div><div class="e-step-text">'+linkify(escHtml(s))+'</div></div>';
    });
    h += '</div>';
  }
  if(e.warnings && e.warnings.length){
    e.warnings.forEach(function(w){
      h += '<div class="e-warn">&#9888; '+escHtml(w)+'</div>';
    });
  }
  if(e.images && e.images.length){
    h += '<div class="e-imgs">';
    e.images.forEach(function(img){
      h += '<img class="e-img" src="'+ASSET_DIR+img+'" data-lb="'+ASSET_DIR+img+'" loading="lazy" alt="'+escHtml(e.question)+'">';
    });
    h += '</div>';
  }
  if(e.source_slides && e.source_slides.length){
    h += '<div class="e-src">Training deck slide'+(e.source_slides.length>1?'s':'')+' '+e.source_slides.join(', ')+'</div>';
  }
  if(e.verified){
    h += '<div class="e-src">&#10003; '+escHtml(e.verified)+'</div>';
  }
  h += '</div></div>';
  return h;
}

function renderTopics(){
  var h = '';
  KB.topics.forEach(function(t){
    var ico = TOPIC_ICONS[t.id] || 'i-doc';
    h += '<div class="topic" data-topic="'+t.id+'">';
    h += '<div class="topic-hdr" data-toggle-topic="'+t.id+'">';
    h += '<div class="topic-ico"><svg class="icon" style="width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><use href="#'+ico+'"></use></svg></div>';
    h += '<div class="topic-title">'+escHtml(t.title)+'</div>';
    h += '<div class="topic-count">'+t.entries.length+'</div>';
    h += '<div class="topic-chevron">&#x203A;</div></div>';
    h += '<div class="topic-body">';
    t.entries.forEach(function(e){ h += entryHtml(e, '', false); });
    h += '</div></div>';
  });
  $('qaContent').innerHTML = h;
}

function scoreEntry(e, q){
  // every word in the query must match somewhere; words can be in
  // different fields ("standby number" still finds the standby entry)
  var tokens = q.toLowerCase().split(/\s+/).filter(function(t){ return t.length >= 2; });
  if(!tokens.length) return 0;
  var body = (e.answer + ' ' + (e.steps||[]).join(' ') + ' ' + (e.warnings||[]).join(' ')).toLowerCase();
  var total = 0;
  for(var i=0;i<tokens.length;i++){
    var t = tokens[i], s = 0;
    if(e.question.toLowerCase().indexOf(t) !== -1) s += 10;
    (e.aliases||[]).forEach(function(a){ if(a.toLowerCase().indexOf(t) !== -1) s += 6; });
    (e.keywords||[]).forEach(function(k){ if(k.toLowerCase().indexOf(t) !== -1) s += 5; });
    if(body.indexOf(t) !== -1) s += 2;
    if(!s) return 0;
    total += s;
  }
  return total;
}

function renderSearch(q){
  var results = allEntries.map(function(x){
    return { entry: x.entry, topic: x.topic, score: scoreEntry(x.entry, q) };
  }).filter(function(r){ return r.score > 0; })
    .sort(function(a,b){ return b.score - a.score; });

  if(!results.length){
    $('qaContent').innerHTML = '<div class="empty-state">No matches for &ldquo;'+escHtml(q)+'&rdquo;.<br>Try different words, or browse topics below.</div>';
    return;
  }
  var h = '<div class="sec-lbl">'+results.length+' match'+(results.length===1?'':'es')+'</div><div style="padding:0 8px">';
  results.forEach(function(r){
    h += entryHtml(r.entry, q, true);
  });
  h += '</div>';
  $('qaContent').innerHTML = h;
}

function findEntry(id){
  for(var i=0;i<allEntries.length;i++){ if(allEntries[i].entry.id===id) return allEntries[i]; }
  return null;
}

function jumpToEntry(id){
  $('srch').value = '';
  $('sc').style.display = 'none';
  $('qaTop').style.display = '';
  renderTopics();
  var found = findEntry(id);
  if(!found) return;
  var topicEl = document.querySelector('.topic[data-topic="'+found.topic.id+'"]');
  if(topicEl) topicEl.classList.add('open');
  var entryEl = document.querySelector('.entry[data-entry="'+id+'"]');
  if(entryEl){
    entryEl.classList.add('open');
    setTimeout(function(){ entryEl.scrollIntoView({ behavior:'smooth', block:'start' }); }, 60);
  }
}

function renderQuickActions(){
  var h = '';
  (KB.quick_actions||[]).forEach(function(qa){
    h += '<div class="qa-chip" data-jump="'+qa.entry+'">'+escHtml(qa.label)+'</div>';
  });
  $('qaRow').innerHTML = h;
}

function renderRefTables(){
  var rt = KB.reference_tables || {};
  var h = '';

  if(rt.disposition_field_options){
    var fo = rt.disposition_field_options;
    h += '<div class="ref-block"><div class="ref-block-title">Disposition Field Options</div>';
    if(fo.note) h += '<div class="ref-block-note">'+escHtml(fo.note)+'</div>';
    [['unit_disposition','Unit Disposition'],['patient_evaluation_care','Patient Evaluation / Care'],
     ['crew_disposition','Crew Disposition'],['transport_disposition','Transport Disposition']].forEach(function(pair){
      if(!fo[pair[0]]) return;
      h += '<div class="optlist"><div class="optlist-h">'+pair[1]+'</div><ul>';
      fo[pair[0]].forEach(function(opt){ h += '<li>'+escHtml(opt)+'</li>'; });
      h += '</ul></div>';
    });
    h += '</div>';
  }

  if(rt.disposition_scenario_matrix){
    var sm = rt.disposition_scenario_matrix;
    h += '<div class="ref-block"><div class="ref-block-title">Disposition Scenario Matrix</div>';
    if(sm.note) h += '<div class="ref-block-note">'+escHtml(sm.note)+'</div>';
    (sm.scenarios||[]).forEach(function(s){
      h += '<div class="scen-card"><div class="scen-title">'+escHtml(s.scenario)+'</div>';
      [['unit_disposition','Unit Disposition'],['patient_evaluation_care','Patient Eval/Care'],
       ['crew_disposition','Crew Disposition'],['transport_disposition','Transport Disposition']].forEach(function(pair){
        if(!s[pair[0]]) return;
        h += '<div class="scen-row"><div class="scen-lbl">'+pair[1]+'</div><div class="scen-val">'+escHtml(s[pair[0]])+'</div></div>';
      });
      if(s.notes) h += '<div class="scen-note">'+escHtml(s.notes)+'</div>';
      if(s.image) h += '<img class="scen-img" src="'+ASSET_DIR+s.image+'" data-lb="'+ASSET_DIR+s.image+'" loading="lazy" alt="'+escHtml(s.scenario)+'">';
      h += '</div>';
    });
    h += '</div>';
  }

  if(rt.crew_disposition_definitions){
    var cd = rt.crew_disposition_definitions;
    h += '<div class="ref-block"><div class="ref-block-title">Crew Disposition Definitions</div>';
    if(cd.note) h += '<div class="ref-block-note">'+escHtml(cd.note)+'</div>';
    (cd.definitions||[]).forEach(function(d){
      h += '<div class="def-item"><div class="def-val">'+escHtml(d.value)+'</div><div class="def-text">'+escHtml(d.definition)+'</div></div>';
    });
    h += '</div>';
  }

  $('refContent').innerHTML = h;
}

document.addEventListener('click', function(ev){
  var chip = ev.target.closest('[data-jump]');
  if(chip){ jumpToEntry(chip.getAttribute('data-jump')); return; }

  var topicToggle = ev.target.closest('[data-toggle-topic]');
  if(topicToggle){
    topicToggle.closest('.topic').classList.toggle('open');
    return;
  }
  var entryToggle = ev.target.closest('[data-toggle-entry]');
  if(entryToggle){
    entryToggle.closest('.entry').classList.toggle('open');
    return;
  }
  var img = ev.target.closest('[data-lb]');
  if(img){
    $('lb-img').src = img.getAttribute('data-lb');
    $('lb').classList.add('on');
    return;
  }
  if(ev.target === $('lb') || ev.target === $('lb-close')){
    $('lb').classList.remove('on');
    $('lb-img').src = '';
    return;
  }
  var tabBtn = ev.target.closest('.tab-btn');
  if(tabBtn){
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('on'); });
    document.querySelectorAll('.pane').forEach(function(p){ p.classList.remove('on'); });
    tabBtn.classList.add('on');
    $('pane-'+tabBtn.getAttribute('data-tab')).classList.add('on');
    return;
  }
});

$('srch').addEventListener('input', function(){
  var q = this.value.trim();
  $('sc').style.display = q ? 'block' : 'none';
  $('qaTop').style.display = q.length >= 2 ? 'none' : '';
  if(q.length >= 2){ renderSearch(q); } else { renderTopics(); }
});
$('sc').addEventListener('click', function(){
  $('srch').value = '';
  $('sc').style.display = 'none';
  $('qaTop').style.display = '';
  renderTopics();
  $('srch').focus();
});

function init(){
  var meta = KB.meta || {};
  $('jaTitle').textContent = meta.title || 'ImageTrend Job Aid';
  $('jaSub').textContent = (meta.audience ? meta.audience + ' · ' : '') + (meta.source || '');
  renderQuickActions();
  renderTopics();
  renderRefTables();
  var support = (meta.support && meta.support.portal) ? meta.support.portal : null;
  var foot = escHtml(meta.disclaimer || '') ;
  if(support){
    foot += ' Support: <a href="https://'+escHtml(support)+'" target="_blank" rel="noopener">'+escHtml(support)+'</a>';
    if(meta.support.note) foot += ' &mdash; '+escHtml(meta.support.note);
  }
  $('footNote').innerHTML = foot;
}
init();
</script>
