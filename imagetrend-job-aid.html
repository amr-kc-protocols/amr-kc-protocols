<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AMR KC ITJA">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-193.png">
<title>ImageTrend Job Aid &mdash; AMR KC</title>
<meta name="description" content="ePCR charting quick reference for ImageTrend Elite &mdash; workflow, dispositions, worksheets, validation, and troubleshooting.">
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap');
:root{
  --bg:#ffffff;--surface:#ffffff;--surface2:#f4f6f9;--border:#e2e6ec;
  --teal:#173a68;--teal2:#1b63c4;--white:#152238;--gray:#66707c;--dim:#f1f4f8;
  --danger:#dc2626;--danger-bg:#fdecec;--warn:#a1590b;--warn-bg:#fef3e2;--info-bg:#eaf4fc;
  --emt:#15803d;--emt-bg:#eafbf1;
  --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{font-family:var(--sans);color:var(--white);min-height:100vh;line-height:1.5;padding-bottom:40px}

.backlink{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;
letter-spacing:0.08em;text-transform:uppercase;color:var(--teal2);text-decoration:none;padding:14px 16px 0}
.backlink:active{opacity:0.6}

#hdr{background:var(--bg);border-bottom:1px solid var(--border);padding:2px 16px 12px;
position:sticky;top:0;z-index:50}
.hdr-title{font-size:20px;font-weight:700;margin-top:6px}
.hdr-sub{font-size:12px;color:var(--gray);margin-top:3px;line-height:1.5}
.sw{margin-top:12px;position:relative}
#srch{width:100%;height:42px;background:var(--dim);border:1.5px solid var(--border);border-radius:8px;
color:var(--white);font-family:var(--sans);font-size:15px;padding:0 38px 0 36px;
outline:none;-webkit-appearance:none;transition:border-color 0.15s}
#srch:focus{border-color:var(--teal)}
#srch::placeholder{color:var(--gray)}
.si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--gray);font-size:15px;pointer-events:none}
#sc{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;
color:var(--gray);font-size:16px;cursor:pointer;display:none;line-height:1;padding:6px}

.tabs{display:flex;gap:6px;padding:10px 16px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);
background:var(--dim);color:var(--gray);font-size:12px;font-weight:600;cursor:pointer;
font-family:var(--sans)}
.tab-btn.on{border-color:var(--teal);color:#fff;background:var(--teal)}

#main{padding:14px 0 20px}
.pane{display:none}
.pane.on{display:block}

/* Quick actions — "common problems" grid, everything visible, big tap targets */
.qa-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 16px}
.qa-chip{display:flex;align-items:center;min-height:52px;padding:10px 12px;background:var(--info-bg);
border:1px solid var(--teal2);border-radius:10px;color:var(--teal2);font-size:12.5px;
font-weight:600;line-height:1.35;cursor:pointer;font-family:var(--sans)}
.qa-chip:active{opacity:0.7}

.sec-lbl{padding:4px 16px 8px;font-family:var(--mono);font-size:10px;font-weight:600;
letter-spacing:0.12em;color:var(--teal);text-transform:uppercase}

/* Topic accordion */
.topic{margin:0 12px 8px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface2);
scroll-margin-top:150px}
.topic-hdr{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
.topic-ico{width:30px;height:30px;border-radius:8px;background:var(--dim);flex-shrink:0;
display:flex;align-items:center;justify-content:center;color:var(--teal2)}
.topic-title{flex:1;font-size:14px;font-weight:600}
.topic-count{font-family:var(--mono);font-size:10px;color:var(--gray);flex-shrink:0}
.topic-chevron{color:var(--gray);font-size:12px;flex-shrink:0;transition:transform 0.2s}
.topic.open .topic-chevron{transform:rotate(90deg)}
.topic-body{display:none;padding:0 8px 8px}
.topic.open .topic-body{display:block}

.entry{background:var(--surface);border:1px solid var(--border);border-radius:8px;
margin:6px 4px;overflow:hidden;scroll-margin-top:150px}
.entry-hdr{display:flex;align-items:flex-start;gap:8px;padding:11px 12px;cursor:pointer}
.entry-q{flex:1;font-size:13.5px;font-weight:600;line-height:1.4}
.entry-chevron{color:var(--gray);font-size:11px;flex-shrink:0;margin-top:2px;transition:transform 0.2s}
.entry.open .entry-chevron{transform:rotate(90deg)}
.entry-body{display:none;padding:0 12px 14px}
.entry.open .entry-body{display:block}
.entry-answer{font-size:13.5px;line-height:1.65;color:var(--white)}
.e-link{color:var(--teal2);font-weight:600;text-decoration:underline;cursor:pointer}
.entry-steps{margin-top:10px}
.e-step{display:flex;gap:8px;margin-bottom:7px;align-items:flex-start}
.e-step-num{flex-shrink:0;width:20px;height:20px;border-radius:50%;background:var(--teal);color:#fff;
font-weight:700;font-size:10px;display:flex;align-items:center;justify-content:center;font-family:var(--mono)}
.e-step-text{font-size:13px;line-height:1.5;color:var(--white)}
.e-warn{background:var(--warn-bg);border-left:3px solid var(--warn);border-radius:0 7px 7px 0;
padding:9px 12px;font-size:12.5px;color:var(--warn);line-height:1.55;margin-top:10px}
.e-imgs{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.e-imgs::-webkit-scrollbar{display:none}
.e-img{flex-shrink:0;width:110px;height:82px;object-fit:cover;border-radius:6px;
border:1px solid var(--border);cursor:zoom-in}
.e-src{font-family:var(--mono);font-size:9.5px;color:var(--gray);margin-top:10px}
mark{background:#fde68a;color:inherit;border-radius:2px}

.empty-state{text-align:center;padding:40px 20px;color:var(--gray);font-size:13px}

/* Reference tables */
.ref-block{margin:0 16px 20px}
.ref-block-title{font-size:14px;font-weight:700;margin-bottom:4px}
.ref-block-note{font-size:11.5px;color:var(--gray);line-height:1.5;margin-bottom:10px}
.optlist{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.optlist-h{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:0.06em;
color:var(--teal2);text-transform:uppercase;margin-bottom:6px}
.optlist li{list-style:none;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--border);color:var(--white)}
.optlist li:last-child{border-bottom:none}

.scen-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;
padding:12px 14px;margin-bottom:10px}
.scen-title{font-size:13.5px;font-weight:700;margin-bottom:8px}
.scen-row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px}
.scen-row:last-of-type{border-bottom:none}
.scen-lbl{color:var(--gray);flex-shrink:0}
.scen-val{color:var(--white);text-align:right;font-weight:600}
.scen-note{font-size:11.5px;color:var(--gray);line-height:1.5;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}
.scen-img{margin-top:10px;width:100%;max-width:220px;border-radius:6px;border:1px solid var(--border);cursor:zoom-in;display:block}

.def-item{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:11px 13px;margin-bottom:8px}
.def-val{font-size:12.5px;font-weight:700;color:var(--teal2);margin-bottom:4px}
.def-text{font-size:12.5px;color:var(--white);line-height:1.55}

/* Lightbox */
#lb{display:none;position:fixed;inset:0;background:rgba(10,14,20,0.92);z-index:900;
align-items:center;justify-content:center;padding:20px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;border-radius:8px}
#lb-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,0.15);border:none;
color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}

.footer-note{margin:24px 16px 0;padding:14px 16px;background:var(--surface2);border:1px solid var(--border);
border-radius:10px;font-size:11px;color:var(--gray);line-height:1.7;text-align:center}
.footer-note a{color:var(--teal2);text-decoration:none;font-weight:600}

/* Ask the Educator */
.edu-box{display:flex;align-items:center;gap:13px;margin:24px 16px 0;padding:14px 15px;
background:var(--info-bg);border:1px solid var(--teal2);border-radius:12px;text-decoration:none}
.edu-box:active{opacity:0.75}
.edu-avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--teal);flex-shrink:0}
.edu-info{flex:1;min-width:0}
.edu-title{font-size:14px;font-weight:700;color:var(--white);margin-bottom:2px}
.edu-sub{font-size:11.5px;color:var(--gray);line-height:1.5}
.edu-arr{color:var(--teal2);font-size:20px;flex-shrink:0}
</style>
</head>

<script>
var KB = {"meta":{"title":"ImageTrend Elite Field Job Aid","audience":"AMR/GMR field providers (EMT/Paramedic)","source":"GMR ImageTrend Elite End User Training v1.19 (3.4.2025), with field checks in Elite (Sept 2026)","maintainer":"AMR Kansas City Clinical Education","disclaimer":"Operational job aid derived from GMR training material. Where this conflicts with current GMR Clinical Informatics guidance or announcements, the current guidance controls.","support":{"portal":"support-clinical.gmr.net","note":"Open the 'GMR - Clinical Support' tile in Okta. (Replaces the former Kayako portal.)"}},"quick_actions":[{"label":"CAD data isn’t coming in","entry":"cad-download"},{"label":"CAD is down","entry":"cad-down"},{"label":"How to chart a standby","entry":"standby-response-number"},{"label":"Fix a “missing report”","entry":"missing-report"},{"label":"Facility isn’t listed","entry":"missing-facility"},{"label":"I can’t post my chart","entry":"trouble-cant-post"},{"label":"I can’t find my chart","entry":"trouble-missing-chart"},{"label":"My chart is locked","entry":"kayako-unlock"},{"label":"The app is throwing errors","entry":"sync-first-step"},{"label":"How do I add an addendum?","entry":"addendum-how"},{"label":"Partner’s signature missing","entry":"missing-signature"},{"label":"Which disposition combo?","entry":"dispo-scenarios"},{"label":"Patient can’t sign the ABA","entry":"aba-scenarios"},{"label":"Patient is refusing","entry":"refusal-worksheet"},{"label":"12-lead documentation (new 9/30)","entry":"twelve-lead-standard"},{"label":"Primary Role of the Unit missing","entry":"start-report"},{"label":"ZIP / city still red","entry":"zip-lookup"},{"label":"Specialty team on board","entry":"specialty-team"},{"label":"Organ or tissue run","entry":"organ-transport"},{"label":"Documenting a running drip","entry":"drip-documentation"},{"label":"Patient seen during a standby","entry":"standby-patient"}],"reference_tables":{"disposition_field_options":{"note":"Options as shown in Elite Field (Sept 2026). Crew and Transport options appear only after Unit Disposition and Patient Evaluation/Care are set, and the list depends on those choices (visibility rules).","unit_disposition":["Patient Contact Made","Cancelled on Scene","Cancelled Prior to Arrival at Scene","No Patient Contact","No Patient Found","Non-Patient Incident (Not Otherwise Listed)"],"patient_evaluation_care":["Patient Evaluated and Care Provided","Patient Evaluated and Refused Care","Patient Evaluated, No Care Required","Patient Refused Evaluation/Care","Patient Support Services Provided"],"crew_disposition":["Initiated and Continued Primary Care","Initiated Primary Care and Transferred to Another EMS Crew","Initiated Primary Care and Transferred to Remote Health Professional","Assumed Primary Care from Another EMS Crew","Provided Care Supporting Primary EMS Crew","Incident Support Services Provided (Including Standby)","Back in Service, No Care/Support Services Required","Back in Service, Care/Support Services Refused"],"transport_disposition":["Transport by This EMS Unit (This Crew Only)","Transport by This EMS Unit, with a Member of Another Crew","Transport by Another EMS Unit/Agency","Transport by Another EMS Unit/Agency, with a Member of This Crew","Patient Refused Transport","Non-Patient Transport (Not Otherwise Listed)","No Transport"],"source_slides":[50,51,52,53]},"disposition_scenario_matrix":{"note":"Rows marked PRESET show what the Field disposition presets set (checked in Elite Field, Sept 2026). Other rows are transcribed from screenshot slides 54-60 of the v1.19 training deck. 'Not Applicable' means the field is grayed out / auto-set by visibility rules. Where a preset and a slide disagree, the preset reflects the current configuration; confirm with Clinical Informatics if unsure.","scenarios":[{"scenario":"Cancellation - No Patient Found (PRESET: No Patient Found)","unit_disposition":"No Patient Found","patient_evaluation_care":"Not Applicable","crew_disposition":"Back in Service, No Care/Support Services Required","transport_disposition":"Not Applicable","notes":"Preset matches the v1.19 slide.","image":"dispo_no_patient_found.jpg","source_slide":54},{"scenario":"Cancelled Prior to Arrival / Enroute (PRESET: Cancelled En Route)","unit_disposition":"Cancelled Prior to Arrival at Scene","patient_evaluation_care":"Not Applicable","crew_disposition":"Not Applicable","transport_disposition":"Not Applicable","notes":"The v1.19 slide showed Crew Disposition 'Back in Service, No Care/Support Services Required'. The Cancelled En Route preset and the Crew Disposition definitions both use Not Applicable. Also enter Unit Canceled Date/Time.","image":"dispo_cancelled_prior.jpg","source_slide":55},{"scenario":"Cancelled on Scene (PRESET: Cancelled On Scene)","unit_disposition":"Cancelled on Scene","patient_evaluation_care":"Not Applicable","crew_disposition":"Back in Service, No Care/Support Services Required","transport_disposition":"Not Applicable","notes":"The v1.19 slide showed Transport Disposition 'No Transport'; the preset sets Not Applicable (and Additional Transport Mode Descriptors = Not Applicable).","image":"dispo_cancelled_on_scene.jpg","source_slide":56},{"scenario":"Patient Refused Medical Aid - WITH patient assessment/vitals","unit_disposition":"Patient Contact Made","patient_evaluation_care":"Patient Evaluated and Refused Care","crew_disposition":"Back in Service, Care/Support Services Refused","transport_disposition":"Patient Refused Transport","image":"dispo_refusal.jpg","source_slide":57},{"scenario":"Patient Refused Medical Aid - WITHOUT patient assessment/vitals","unit_disposition":"Patient Contact Made","patient_evaluation_care":"Patient Refused Evaluation/Care","crew_disposition":"Back in Service, Care/Support Services Refused","transport_disposition":"Patient Refused Transport","image":"dispo_refusal.jpg","source_slide":57},{"scenario":"No Transport / Other Ambulance","unit_disposition":"Patient Contact Made","patient_evaluation_care":"Patient Evaluated and Care Provided","crew_disposition":"Initiated Primary Care and Transferred to Another EMS Crew","transport_disposition":"No Transport","image":"dispo_no_transport_other_ambulance.jpg","source_slide":58},{"scenario":"Standby (PRESET: Standby - No Patient Generated)","unit_disposition":"Non-Patient Incident (Not Otherwise Listed)","patient_evaluation_care":"Not Applicable","crew_disposition":"Incident Support Services Provided (Including Standby)","transport_disposition":"Not Applicable","notes":"Type of Encounter = Standby / Event Coverage, then Show More Preset Disposition Options > Standby / Support / Other > Preset - Other / Support Services page. Also sets Type of Service = Standby. Then set Standby Purpose (Dispositions page) and Dispatch Reason = Standby. The v1.19 slide 59 showed Patient Evaluation/Care = Patient Support Services Provided; Field only offers Not Applicable with a Non-Patient Incident.","source_slide":59},{"scenario":"Specialty Team Transport, crew gave care (PRESET)","unit_disposition":"Patient Contact Made","patient_evaluation_care":"Patient Evaluated and Care Provided","crew_disposition":"Initiated and Continued Primary Care","transport_disposition":"Transport by This EMS Unit, with a Member of Another Crew","notes":"Preset: Specialty/Flight TEAM Transport - (Care Given by this crew)."},{"scenario":"Specialty Team Transport, team gave all care (PRESET)","unit_disposition":"Patient Contact Made","patient_evaluation_care":"Patient Support Services Provided","crew_disposition":"Incident Support Services Provided (Including Standby)","transport_disposition":"Transport by This EMS Unit, with a Member of Another Crew","notes":"Preset: Specialty/Flight TEAM Transport - (NO Care by This Crew). The v1.19 slide 60 showed Crew Disposition 'Provided Care Supporting Primary EMS Crew', which matches neither preset."},{"scenario":"Specialty Team, no patient on board (PRESET)","unit_disposition":"Non-Patient Incident (Not Otherwise Listed)","patient_evaluation_care":"Not Applicable","crew_disposition":"Incident Support Services Provided (Including Standby)","transport_disposition":"Non-Patient Transport (Not Otherwise Listed)","notes":"Preset: Specialty/Flight TEAM Transport - (NO Patient on Board). Sets Type of Service = Support Services."},{"scenario":"Organ / Body Part Transport (PRESET)","unit_disposition":"Non-Patient Incident (Not Otherwise Listed)","patient_evaluation_care":"Not Applicable","crew_disposition":"Incident Support Services Provided (Including Standby)","transport_disposition":"Non-Patient Transport (Not Otherwise Listed)","notes":"Preset: Organ & Body Part Transports. Encounter: Public Assist / Support. Also sets Unit capability to Non-Transport Administrative."},{"scenario":"Evaluated, care given, refused transport (PRESET: Evaluated / Refused Transport)","unit_disposition":"Patient Contact Made","patient_evaluation_care":"Patient Evaluated and Care Provided","crew_disposition":"Initiated and Continued Primary Care","transport_disposition":"Patient Refused Transport","notes":"For a patient who accepted care but refused transport. A patient who refuses care altogether uses the refusal rows above (no preset)."},{"scenario":"Nurse Navigation / No Transport (PRESET)","unit_disposition":"Patient Contact Made","patient_evaluation_care":"Patient Evaluated and Care Provided","crew_disposition":"Initiated Primary Care and Transferred to Remote Health Professional","transport_disposition":"No Transport","notes":"Also sets Remote Health: Highest Level of Remote Health Professional Service Contacted = Nurse Navigation."},{"scenario":"ALS Intercept - Ride-In / Transport (PRESET)","unit_disposition":"Patient Contact Made","patient_evaluation_care":"Patient Evaluated and Care Provided","crew_disposition":"Assumed Primary Care from Another EMS Crew","transport_disposition":"Transport by Another EMS Unit/Agency, with a Member of This Crew","notes":"Also sets Type of Service Requested = Emergency Response (Intercept)."},{"scenario":"Deceased, no transport, care given (PRESET)","unit_disposition":"Patient Contact Made","patient_evaluation_care":"Patient Evaluated and Care Provided","crew_disposition":"Initiated and Continued Primary Care","transport_disposition":"No Transport","notes":"Preset: Deceased No Transport - Care Given. Also sets Initial Patient Acuity = Critical (Red)."},{"scenario":"Deceased on arrival, no care given (PRESET)","unit_disposition":"Patient Contact Made","patient_evaluation_care":"Patient Evaluated, No Care Required","crew_disposition":"Back in Service, No Care/Support Services Required","transport_disposition":"No Transport","notes":"Preset: Deceased on Arrival - NO Care Given. Also sets Cardiac Arrest = Yes, Prior to Crew Arrival; Resuscitation = Not Attempted-Meets Local Field Pronouncement Criteria; ROSC = No; Acuity = Dead without Resuscitation Efforts (Black); Primary Symptom and Impressions = Obvious Death; Barriers = None Noted."},{"scenario":"911 response, no patient contact, support only (PRESET)","unit_disposition":"No Patient Contact","patient_evaluation_care":"Not Applicable","crew_disposition":"Incident Support Services Provided (Including Standby)","transport_disposition":"Not Applicable","notes":"Scene / 911 > Show More > Cancelled - No Patient Contact > On Scene – No Patient Contact / Support Only. Sets Type of Service = Emergency Response (Primary Response Area). The sibling preset “/ No Support Needed” sets Crew Disposition = Back in Service, No Care/Support Services Required."},{"scenario":"Admin / Supervisor response, no patient contact (PRESET)","unit_disposition":"Non-Patient Incident (Not Otherwise Listed)","patient_evaluation_care":"Not Applicable","crew_disposition":"Incident Support Services Provided (Including Standby)","transport_disposition":"Not Applicable","notes":"Show More > Standby / Support / Other > Admin / Supervisor Response - No Patient Contact. Sets Type of Service = Administrative Operations."},{"scenario":"Legal Blood Draw (PRESET)","unit_disposition":"Non-Patient Incident (Not Otherwise Listed)","patient_evaluation_care":"Not Applicable","crew_disposition":"Incident Support Services Provided (Including Standby)","transport_disposition":"Not Applicable","notes":"Also sets Dispatch Reason = Assist Police with a Citizen, EMD Performed = Not Applicable, Type of Service = Administrative Operations."}]},"crew_disposition_definitions":{"note":"Definitions as printed on source slide 52.","definitions":[{"value":"Initiated and Continued Primary Care","definition":"This crew began primary care for this patient with no previous care provided on-scene and did not transfer the care to another unit. Generally a one-unit response where no other crew or unit was present. If multiple units from the same agency respond as an organized response and local rules do not require each unit to do a separate report, this value applies to the agency response of multiple units under one report. For transfers, 'Primary Care' begins once the crew receives responsibility for the patient; care provided by the sending facility does not qualify as previous care."},{"value":"Initiated Primary Care and Transferred to Another EMS Crew","definition":"This crew began primary care for this patient with no previous care provided on scene, and then transferred the care to another unit."},{"value":"Provided Care Supporting Primary EMS Crew","definition":"Another crew started and continued primary care, and this unit provided patient care supporting the primary crew's care. For example, first responders arrived at the same time or later than the transport crew and helped provide care but were not the primary crew in charge of patient care."},{"value":"Assumed Primary Care from Another EMS Crew","definition":"This crew assumed primary care of a patient that was initiated by another EMS crew. Commonly used by an ALS intercept unit arriving and taking over primary care from a BLS unit."},{"value":"Incident Support Services Provided (Including Standby)","definition":"This crew/unit provided non-patient-care support services to an incident in general or to another unit/crew that is providing patient care. Support services could include extrication, carrying bags or equipment, helping move a patient, standby for police, or fire/fire-rehab services where no one rose to the level of a patient."},{"value":"Back in Service, No Care/Support Services Required","definition":"This crew/unit is immediately back in service as there was no patient care or support services required at the incident. Primarily applies if no patient was found or the unit was cancelled on scene."},{"value":"Back in Service, Care/Support Services Refused","definition":"This crew/unit is back in service after patient care or support services were refused despite being offered. No care or support services should be provided; however, an evaluation may have occurred prior to refusal of any care."},{"value":"Not Applicable","definition":"The unit was cancelled prior to arrival on scene per the Unit Disposition, therefore the Crew Incident Disposition is Not Applicable."}],"source_slides":[52]}},"topics":[{"id":"basics","title":"Basics & Workflow","entries":[{"id":"what-is-imagetrend","question":"What is ImageTrend Elite?","aliases":["what is elite","what program do we chart in","what is the epcr"],"keywords":["imagetrend","elite","epcr","nemsis"],"answer":"ImageTrend Elite is GMR's electronic Prehospital Care Report (ePCR) system, used across GMR Air and Ground. It is NEMSIS 3.5 compliant. ePCRs improve documentation quality and legibility, support data collection for research and regulators, enhance QI, expedite reimbursement, allow cardiac monitor data import, and meet federal standards.","source_slides":[3,4]},{"id":"call-workflow","question":"What is the basic charting workflow for a shift?","aliases":["how do I chart a call","steps to document a call","workflow"],"keywords":["workflow","steps","overview","shift"],"answer":"Standard flow for every shift:","steps":["Log in to Elite Field at the start of shift (blue background = Field).","On the dashboard, set your crew, unit, call sign, level of care and Primary Role of the Unit (and cardiac monitor if applicable). Primary Role can only be set here; see [[entry:start-report|starting a chart]].","Start each new incident from CAD, from an empty dashboard. Downloading CAD while a chart is open writes into that chart.","Complete the chart to a validation score of 100.","Post the chart and mark it as finished.","Repeat steps 3–5 for each call. Post early, post often."],"source_slides":[5,12],"verified":"Steps 2–3: Checked in Elite Field (KS-KANSAS CITY-Ground), Sept 2026"},{"id":"first-login","question":"How do I log in for the first time? What is my username?","aliases":["initial login","first password","what is my username","new hire login"],"keywords":["login","username","password","employee number","first time"],"answer":"Your username is your employee number (e.g., 12345678) and is permanent. Your temporary password comes with your onboarding login instructions, and you will be prompted to change it immediately on first login. Never share your password or write it on the tablet.","source_slides":[6]},{"id":"green-check-red-x","question":"What do the green check mark and red X next to my username mean?","aliases":["red x on login","green checkmark login"],"keywords":["green check","red x","username","login","cache"],"answer":"After you enter your username and move to the password field, a green check mark appears for all active accounts. A red X means the username has never logged in, is typed incorrectly, or the account is no longer active. After a browser cache clear, the red X may reappear on a valid account — attempt to log in normally. If it persists after your first successful login, file a Clinical Support ticket.","source_slides":[13]},{"id":"field-vs-web","question":"What's the difference between Elite Field and Elite Web?","aliases":["field or web","which one do I use","web vs field"],"keywords":["elite field","elite web","difference","comparison"],"answer":"Elite Field (BLUE background) is where field personnel START all documentation. It works offline, requires syncing, and requires an internet connection only to Post. It stores non-posted incidents locally for a limited window (roughly 1–4 days depending on agency call volume). Elite Web is for working on posted charts: finishing incomplete posted charts and adding addendums or attachments. Web requires an internet connection, needs no syncing, has no Post button, and provides module access (permission-dependent). Charts can be edited and finished in Web but not created there.","source_slides":[9,12,25,101,105,106]},{"id":"demo-account","question":"Is there a demo/practice account?","aliases":["practice account","training login","demo chart"],"keywords":["demo","practice","training"],"answer":"Yes. GMR has a Ground demo account for practice at https://gmr.imagetrendelite.com/Elite/Organizationgmr/. Get the login from Clinical Education or the GMR training material. Use it for practice charts only, never for real patient documentation.","source_slides":[8,111]}]},{"id":"devices","title":"Devices, Browsers & Setup","entries":[{"id":"browser-requirements","question":"Which browsers and devices can I use?","aliases":["can I use my phone","personal device","which browser","internet explorer"],"keywords":["browser","chrome","edge","device","personal","authorized"],"answer":"Use Google Chrome or Microsoft Edge only — Internet Explorer is NOT supported. Elite Field stores data in the browser cache; if prompted to increase local storage, allow it. Spellcheck is a browser function, not part of the program. Only GMR-authorized company devices may access the system — no personal computers or devices, ever. Charting can occur offline, but posting requires an internet connection.","warnings":["Device authorization is approved by GMR. Personal devices are prohibited."],"source_slides":[10,11]},{"id":"operation-select","question":"Why am I being asked to pick an agency when I log in?","aliases":["agency selector","operation select","wrong base"],"keywords":["agency","operation","selector","base"],"answer":"If your account has access to more than one operation, an Agency Selector box appears after login. Choose the correct agency (base) location for your shift.","source_slides":[15]},{"id":"shift-start","question":"What should I do in ImageTrend at the start of my shift?","aliases":["beginning of shift","shift setup"],"keywords":["shift","start","sync","crew","setup"],"answer":"Log in to Elite Field at the beginning of the shift, confirm you have access, build your crew, and sync resources. The system auto-syncs on every login — this is normal and required. Syncing ensures you're on the current program version with current users, vehicles, and validation rules.","source_slides":[12,14]}]},{"id":"crew","title":"Crew, Unit & Roles","entries":[{"id":"crew-menu","question":"How do I set up my crew?","aliases":["add crew member","remove crew member","crew menu"],"keywords":["crew","add","remove","level"],"answer":"In the Crew Menu, click +Add to add crew members from your agency and verify each member's level is correct. Previous crew members may still be listed from a prior login — click x Remove to clear them. Crew Menu selections auto-fill into charts you create and filter selection lists for you.","source_slides":[17,18]},{"id":"crew-roles","question":"What crew roles are required on a chart?","aliases":["minimum roles","driver role","primary caregiver role"],"keywords":["roles","driver","primary caregiver","transport","required"],"answer":"Every chart requires at minimum a 'Driver/Pilot-Response' and a 'Primary Patient Caregiver-At Scene.' Transport charts also need the transport versions of these roles. Role assignments are dynamic per chart: assign roles inside each individual chart (Incident > Unit & Crew), not in the Crew Menu.","warnings":["Elite stops two people from both being Driver, but it does not stop one person from being both Driver and Primary Caregiver on the same leg. QA will catch it."],"source_slides":[18],"verified":"Role behavior Checked in Elite Field (KS-KANSAS CITY-Ground), Sept 2026"},{"id":"outside-providers","question":"How do I document providers who aren't in our system, or students?","aliases":["fire department on scene","outside medic","student rider","observer"],"keywords":["other ems","public safety","healthcare professional","student","intern","observer"],"answer":"Use 'Other EMS or Public Safety, Agency at Scene' or 'Other Healthcare, Professional' to indicate providers not in our system. Use the 'Student' level for students, interns, or observers. The Level list is comprehensive but limited by state validation criteria.","source_slides":[19]},{"id":"other-agencies","question":"How do I document another agency or team on scene (fire, a hospital transport team)?","aliases":["other agencies on scene","fire on scene","transport team","childrens mercy team"],"keywords":["other agencies","agency","fire","team","response"],"answer":"Go to Incident > Response > Other Agencies On Scene > Add. Pick the agency from the list (it is long; type part of the name, e.g., “Mercy”), then fill in its ID number if known, Type of Other Service at Scene, whether it was the first agency to provide patient care, and whether care was transferred to or from it.","verified":"Checked in Elite Field (KS-KANSAS CITY-Ground), Sept 2026"},{"id":"unit-monitor","question":"How do I set my unit, call sign, Primary Role and cardiac monitor?","aliases":["select vehicle","select monitor","call sign","primary role of the unit","unit and shift"],"keywords":["unit","vehicle","call sign","monitor","ambulance icon","primary role"],"answer":"On the dashboard, tap the ambulance icon under Unit & Shift. Set Unit, Call Sign and Primary Role of this Unit (e.g., Ground Transport (ALS Equipped), Ground Transport (BLS Equipped), Ground Transport (Critical Care Equipped)), then tap OK. These carry into every chart you start, and Primary Role has no field inside the chart. Tap the monitor icon under Medical Device to select the cardiac monitor you'll be working with; this smooths monitor data flow into your charts.","source_slides":[20],"verified":"Unit panel Checked in Elite Field (KS-KANSAS CITY-Ground), 9/29/2026"}]},{"id":"toolbar","title":"Toolbar, Sync & Error Handling","entries":[{"id":"toolbar-overview","question":"What's on the Elite Field toolbar?","aliases":["inbox","settings menu","about menu","announcements"],"keywords":["toolbar","inbox","settings","about","logout","announcements"],"answer":"Inbox — CQI, Documentation, Billing and Patient Outcomes messages. Settings — manual syncing and external keyboard settings. About — shows your Elite Field version and lets you submit errors/diagnostics. Logout — always log out before closing the browser. Announcements — messages from GMR Clinical Informatics about functionality and updates.","source_slides":[21,22,108]},{"id":"sync-first-step","question":"The program is giving me an error. What do I do first?","aliases":["app error","program glitch","elite not working","how to sync"],"keywords":["error","sync","sync all resources","troubleshoot","glitch"],"answer":"Sync first — it's the first step for any program error.","steps":["If you're in an active incident, close it and return to the Elite Field home page.","Click Settings on the toolbar.","Click 'Sync All Resources' and follow the prompts.","If the error persists: open About, click 'Upload Diagnostic Data', follow the prompts, then file a Clinical Support ticket."],"source_slides":[23,24]}]},{"id":"incidents","title":"Incidents, CAD & Chart Anatomy","entries":[{"id":"incident-views","question":"Where did my older incidents go on the home screen?","aliases":["incident list views","old incidents missing"],"keywords":["incident views","list","tile","panel","old incidents"],"answer":"Three home-screen views are available: List (default), Tile, and Panel. Incidents remain visible in Field for only about 1–2 days depending on your agency's call volume (the Web/Field comparison lists non-posted storage up to 4 days). For older, posted, or completed incidents, log in to Elite Web.","source_slides":[25,26,105]},{"id":"chart-anatomy","question":"What are the parts of a chart screen?","aliases":["chart layout","screen layout"],"keywords":["navigation menu","power tools","worksheets","action bar","situations","validation score","menu panel","timeline","field search"],"answer":"A chart contains: Navigation Menu, Power Tools, Worksheets, Action Bar, Situations, Validation Rule Score, Menu Panel, Timeline, Times, and Field Search. Elite Field and Web use the same chart layout; the only difference is the Action Bar (Web has no Post button).","source_slides":[28,29]},{"id":"action-bar","question":"What do the Action Bar buttons do?","aliases":["post button","print chart","pdf view","transfers button"],"keywords":["action bar","post","print","pdf","cad","ekg","transfers","save"],"answer":"Post (Field only) sends the chart to the ImageTrend cloud so it's accessible in Web. Print prints a PDF view. PDF displays a PDF view. CAD downloads or refreshes the CAD record INTO THE OPEN CHART (it overwrites the incident number, response number, address and response mode). EKG imports monitor cases from Zoll, Physio-Control, or Philips. Transfers (if enabled) shares chart data internally between units. The chart auto-saves each time you click Next or change navigation menus; a manual Save button is also available.","source_slides":[29],"verified":"CAD overwrite behavior Checked in Elite Field (KS-KANSAS CITY-Ground), Sept 2026"},{"id":"start-report","question":"How do I start a chart? Why does it say Primary Role of the Unit is missing?","aliases":["new incident","start a report","other forms","primary role missing","current user confirmation","no cad call yet"],"keywords":["start","new incident","other forms","primary role","confirmation","dashboard","588"],"answer":"Start every chart from the dashboard, after your crew and unit are set. The start-up box shows what will copy into the chart, including Primary Role of the Unit, which has NO field inside the chart.","steps":["Real call: tap New CAD Incident, set the date range and filters, and pick your CAD record.","No CAD record yet (or practice): tap the arrow beside New CAD Incident (Other Forms) and pick Master GMR Run Form 3.5.","A “Current user confirmation” box lists crew member completing, crew, unit, Primary Role of the Unit, level of care, shift and medical device. Check it, then tap Yes.","In the Download CAD Incident window, pick your record, or tap + New Incident if there is none."],"warnings":["If the box shows Primary Role of the Unit: Nothing Entered, cancel, set it on the dashboard (Unit & Shift > ambulance icon > Primary Role of this Unit), then start again. Otherwise the chart carries a 20-point rule (588) you cannot fix from inside."],"verified":"Checked in Elite Field (KS-KANSAS CITY-Ground), Sept 2026"},{"id":"cad-download","question":"CAD data isn't coming in (or looks wrong). How do I add, refresh, or fix it?","aliases":["cad not coming in","no cad data","cad data missing","cad wrong","cad won't download","missing cad","download cad","refresh cad","link cad to chart"],"keywords":["cad","download","refresh","call sign","unit number","missing","not coming in","overwrite"],"answer":"Most “CAD isn’t coming in” problems are fixed by pulling the record manually and double-checking that the CAD record actually matches your unit.","steps":["Inside the chart, tap the CAD icon on the Action Bar.","Verify the record is YOURS: match Call Sign, Unit Number, and Date. Filters: Downloaded = No hides records already pulled; Both shows everything.","Tap the download button on the right side of the screen. The same process refreshes a CAD record you already downloaded.","Still not coming in? Confirm your unit and call sign are set correctly (see “How do I set my unit, call sign, and cardiac monitor?”), sync, and try the download again.","If CAD itself is down, use the CAD Down panel instead: see “CAD is down”."],"warnings":["CAD writes into whatever chart is open: it replaces the incident number, response number, address and response mode. Only download the record that matches the open chart. For a new call, start from an empty dashboard with New CAD Incident."],"source_slides":[30],"verified":"Overwrite behavior and filters Checked in Elite Field (KS-KANSAS CITY-Ground), Sept 2026"},{"id":"cad-down","question":"CAD is down. How do I chart without a CAD record?","aliases":["no cad","cad outage","logis down","cad down panel"],"keywords":["cad down","outage","incident number","response number","unknown"],"answer":"Elite Field has built-in CAD Down functionality. When your incident and response numbers are blank AND you've entered a 'Unit Back in Service Date/Time,' the CAD Down panel becomes visible. It first asks you to attempt a CAD download. If you answer 'No,' complete the CAD Down incident and response number fields with what you believe the numbers should be, or the word 'Unknown.' Your chart can still reach a validation score of 100.","warnings":["If Clinical Support later adds response/incident numbers for you (CAD outage or Logis issues), the numbers must also be in your narrative."],"source_slides":[31,32,110]},{"id":"standby-response-number","question":"How do I chart a standby? (fire standby, event, police/tactical)","aliases":["standby response number","response number for standby","standby pcr","do i chart a standby","standby paperwork","no response number standby","standby chart","logis standby","fire standby","event standby","rehab standby","standby preset","standby purpose","how do i chart a standby"],"keywords":["standby","response number","logis","cad","request","pcr","event","fire","rehab","standby purpose","preset","event coverage"],"answer":"Every standby gets its own chart, with no patient on it. The two things that trip people up: the response number doesn't come to you through LOGIS/CAD (you request it), and the standby preset is one tap deeper than the others. A finished standby chart needs about 25 items and no patient data. Saw a patient during the standby? That patient gets a separate chart: see [[entry:standby-patient|patient during a standby]].","steps":["Start a new chart. Don't wait for CAD: LOGIS/CAD will not push a standby response number to your unit. Request the number yourself and enter it on Incident > Dispatch (CAD) > EMS Response Number.","Incident > Type of Call: set Response to Scene as dispatched, then Type of Encounter = Standby / Event Coverage and Type of Service Requested = Standby.","Scroll to the bottom of Type of Call. Under “Show More Preset Disposition Options Based On”, tap Standby / Support / Other.","In the left menu, a new page “Preset - Other / Support Services” appears under Type of Call. Open it and tap Standby - No Patient Generated, check the Apply New Values window, then tap Apply Changes. It sets Unit Disposition = Non-Patient Incident (Not Otherwise Listed), Patient Evaluation/Care = Not Applicable, Crew Disposition = Incident Support Services Provided (Including Standby), Transport Disposition = Not Applicable.","Incident > Dispositions, bottom of the page: pick a Standby Purpose (Fire Support-Standby, Fire Support-Rehab, Public Safety Support, Mass Gathering (Sporting / Concert / Fair or Community Event), Disaster Event (Drill or Live Staging), Education, Other). It's required whenever Type of Service is Standby.","Incident > Dispatch (CAD): Dispatch Reason = Standby.","Response details: response mode, Additional Response Mode Descriptors, Type of Response Delay (None if none) and First EMS Unit on Scene. If you can't find a field, tap its rule's arrow in Validation to jump to it.","Incident > Unit & Crew: call sign, both crew members, one as Driver/Pilot-Response, and Crew Member Completing this Report. (Primary Role of the Unit comes from the dashboard: see [[entry:unit-monitor|unit and Primary Role]].)","Incident Address: where you stood by. Street, city, county, state, ZIP (use ZIP Code Lookup) and Location Type. See [[entry:zip-lookup|ZIP / city still red]].","Times: PSAP, Unit Notified, En Route, On Scene (arrived at the standby), Left Scene (released), Back in Service. Also Type of Scene Delay (None if none).","Narrative: who requested you, where you staged, the purpose, start and end times, any patient contact (and that it has its own chart), and who released you. Example: “Medic 12 requested by KCFD Battalion 3 for fire standby at [address]. Arrived 14:05, staged on Main St per IC. Rehab and standby for structure fire. No patient contact during standby. Released by Battalion 3 at 16:40.”","Crew signatures, then post. There are no patient, vitals, destination or mileage rules on a standby."],"warnings":["Dispatched on a 911 call and only stood by for fire or police, with no patient contact? That isn't a standby request. Keep Scene / 911 and use Show More > Cancelled - No Patient Contact > On Scene – No Patient Contact / Support Only.","The v1.19 training slide shows Patient Evaluation/Care = Patient Support Services Provided for a standby. Field no longer offers it: once Unit Disposition is Non-Patient Incident, Patient Evaluation/Care can only be Not Applicable.","Requesting the response number yourself is AMR KC Clinical Education guidance. It wasn't in the ImageTrend training PowerPoint."],"verified":"Preset, Standby Purpose options and required items Checked in Elite Field (KS-KANSAS CITY-Ground), 9/29/2026"},{"id":"standby-patient","question":"We saw a patient during a standby. How do I chart that?","aliases":["patient during standby","standby turned into a call","standby patient contact","treated someone at event","standby transport","standby refusal","patient at fire scene standby"],"keywords":["standby","patient","event","second chart","separate pcr","transport","refusal","rehab"],"answer":"Chart the patient on a new chart of their own. The standby chart stays a non-patient chart (its preset is literally “Standby - No Patient Generated”), and the two charts point to each other in their narratives.","steps":["Keep the standby chart as it is: Standby / Event Coverage, Standby - No Patient Generated. Don't add the patient to it.","Start a new chart for each person you evaluate or treat, with its own response number. Request it the same way as the standby's; don't reuse the standby number.","Chart the patient like any other call: Type of Encounter = Scene / 911 and the preset that matches what happened (Treated / Transported by This Unit, Evaluated / Refused Transport, etc.). See [[entry:preset-values|disposition presets]].","Patient chart narrative: say you were on standby at the event or fire, when and how the patient came to you, then the usual assessment, care and disposition.","Standby chart narrative: note the patient contact time and that it is documented on a separate chart. If you left the standby to transport and did not return, the time you left is the standby chart's Left Scene time."],"warnings":["Fire rehab checks (vitals on firefighters) are a local decision: follow your supervisor's direction on whether each firefighter needs a chart."],"verified":"Standby preset name and Scene / 911 presets Checked in Elite Field (KS-KANSAS CITY-Ground), 9/29/2026"},{"id":"ekg-import","question":"How do I import my cardiac monitor data?","aliases":["import ekg","lifepak import","monitor data"],"keywords":["ekg","monitor","physio-control","zoll","philips","import","12 lead"],"answer":"Click the EKG button on the Action Bar, select the source (e.g., Physio-Control Cloud), select the correct case by Monitor Number, and click the download button on the right side. From September 30, 2026, importing is not enough for a 12-lead: you must also document your own interpretation. See [[entry:twelve-lead-standard|12-lead documentation]].","source_slides":[29,33]},{"id":"menu-panel-delete","question":"Can I delete a chart? Where are attachments and addendums?","aliases":["delete chart","add attachment","add addendum"],"keywords":["delete","attachments","addendums","lock","menu panel"],"answer":"The Menu Panel (Menu button in the footer, next to the score) holds Attachments, Addendums, Lock and Delete. Crews can delete a chart at any time BEFORE it is Posted. Deleted charts are gone forever, so make certain you're deleting the right chart for the right reason. After posting, attachments and addendums can still be added in Elite Web.","warnings":["Deleted charts are unrecoverable."],"source_slides":[34,101],"verified":"Menu contents Checked in Elite Field (KS-KANSAS CITY-Ground), Sept 2026"}]},{"id":"validation","title":"Validation & Pertinent Negatives","entries":[{"id":"validation-score","question":"How does the validation score work?","aliases":["what is validation 100","red vs gold errors","validation rules","why is my score negative","minus 250"],"keywords":["validation","score","100","red","gold","errors","warnings","negative"],"answer":"The validation score sits next to the Menu button at the bottom of the screen. Every open rule subtracts its point weight from 100, so a finished chart reads 100. A blank chart starts around −250, and the score drops further when you set the dispositions, because they switch on the rules for that call type (on a 911 transport, 16 rules became 96). The crew-signature rule alone is worth 100 points, so a chart that is complete except for crew signatures reads about 0. Click the score to see the open rules, and click a rule's arrow to jump to its field. RED items are errors and generally must be completed before the chart can be marked finished. GOLD items are warnings: consider them before finishing. If a single rule seems stuck or broken, include its error code in your Clinical Support ticket.","source_slides":[36],"verified":"Score arithmetic Checked in Elite Field (KS-KANSAS CITY-Ground), Sept 2026"},{"id":"pertinent-negatives","question":"What are Pertinent Negatives and when do I use them?","aliases":["pn fields","pn icon","unknown information","minus button","not values"],"keywords":["pertinent negative","pn","unknown","refused","not obtained","not applicable","not recorded"],"answer":"Pertinent Negatives (PN) let you complete documentation without entering FALSE or INCORRECT information, and they resolve validation rules. Tap the grey minus button beside a field. The list has two groups: above the line are Not Values (Not Applicable, Not Recorded), which you should avoid for required items; below the line are the Pertinent Negatives (None Reported, Unable to Complete, Refused, No Known Drug Allergy, and others), which count as answers. When set, the field greys out and shows the value. Not every field has a PN option, and the choices change by field.","source_slides":[37,38],"verified":"Checked in Elite Field (KS-KANSAS CITY-Ground), Sept 2026"},{"id":"pn-names","question":"The patient won't give a name / I don't know the name. What do I enter?","aliases":["unknown patient name","trauma alias","john doe"],"keywords":["name","unknown","trauma alias","john doe","jane doe","pn"],"answer":"If the name is unknown or the patient refuses to provide it, use the PN fields for first and last name. If a trauma alias was assigned, use the alias as the patient name and put the suspected real name in the narrative. Note: PN use for names is state-dependent — some states require John/Jane Doe instead. For a field delivery of a newborn (or immediate transport of one) with no name available, document it as such.","source_slides":[39,40]},{"id":"pn-age","question":"I can't get the patient's age or DOB. Can I use a PN?","aliases":["unknown age","unknown dob","estimate age"],"keywords":["age","dob","date of birth","estimate","110"],"answer":"Usually no — numerous state NEMSIS 3.5 rules do not allow PN use for patient age. If you cannot obtain a definitive age or DOB, ESTIMATE the age. Certain NEMSIS 3.5 rules also prevent ages over 110.","source_slides":[41]}]},{"id":"demographics","title":"Demographics, ALS Assessment & Patient Engagement","entries":[{"id":"demo-requirements","question":"What demographics are required on every chart?","aliases":["required patient info","demographics checklist"],"keywords":["demographics","required","ssn","address","mrn","guardian"],"answer":"Collect: first name, middle initial (when applicable), last name; date of birth and gender; Social Security Number when able; street address including apartment/space number, city, state, ZIP; mobile phone, e-mail address, home phone; hospital MRN if at all possible (operation dependent); and if the patient is a minor, contact information for the parent/guardian. A complete record with accurate demographics is key to patient advocacy throughout the patient's GMR experience.","source_slides":[42,89]},{"id":"license-scan","question":"How does the driver's license scan work?","aliases":["scan id","dl scan","license barcode"],"keywords":["driver's license","scan","barcode","demographics"],"answer":"Open Patient > Demographics and tap Scan Driver's License Barcode at the top of the page (above Driver's License Number and State Issuing Driver's License). A camera preview opens; scan the barcode on the back of the license and the data imports into the chart. This prevents typos and helps link the chart to hospital records for outcomes and follow-up.","source_slides":[43],"verified":"Button location Checked in Elite Field (KS-KANSAS CITY-Ground), 9/29/2026"},{"id":"als-assessment","question":"How do I answer the ALS assessment question?","aliases":["was there an als provider on scene","als question"],"keywords":["als assessment","paramedic","advanced provider","patient contact"],"answer":"When Unit Disposition equals 'Patient Contact Made,' crews must answer: 'Was there an ALS (paramedic or advanced) provider on scene that made patient contact?' Make ONE selection. The question is about the ENTIRE crew, not just the chart author. Read the options in order, left to right — if your crew fits a 'Yes' criterion, select it.","source_slides":[44]},{"id":"digital-engagement","question":"Why do I need to collect phone numbers, email, and insurance?","aliases":["digital patient engagement","why collect email","billing info collection"],"keywords":["digital patient engagement","phone","email","insurance","guarantor","billing"],"answer":"Collect mailing address, phone number, e-mail, guarantor, and insurance information (health, auto, workers' comp) on every chart — this drives the Digital Patient Engagement Initiative. It replaces paper statements and phone-tag with text/e-mail engagement: easier account and payment navigation, mobile payments, interest-free payment plan options, real-time GMR support, fewer collections referrals, and less paper. When patients don't engage, accounts end up with third-party collections — bad for patients and for GMR. Collect phone numbers and e-mail addresses!","source_slides":[45,46]}]},{"id":"times","title":"Times & Mileage","entries":[{"id":"times-mileage","question":"Which times and mileage come from CAD, and what do I enter manually?","aliases":["enter mileage","patient contact time","times page","out of order times","unit canceled time"],"keywords":["times","mileage","cad","tenth of a mile","patient contact","logical","canceled","odometer"],"answer":"Most times, and mileage, flow from the CAD when it's linked. Patient times (arrived at patient, patient movement, transfer of care) are entered manually on the Times panel in the right rail, which has a keypad and ±1 / ±5 minute buttons. In a power tool, the clock button next to Date/Time opens a picker with one-tap Current, On Scene, Patient Arrival and Destination Arrival, plus ±5 / ±15 minute buttons. Mileage must be tracked from Scene to Hospital to the TENTH of a mile; destination mileage is calculated from the odometer readings (there is no separate mileage box).","warnings":["Every time must be later than the one before, and every vital, medication and procedure must fall inside patient contact. One bad time can set off several LOGICAL rules at once: open the Timeline, where out-of-order items show red.","Cancelled calls: enter “Unit Canceled Date/Time” (just above Unit Back in Service). It is its own validation rule.","Repeat Last in the Vitals tool copies the values but not the time. Set the time."],"source_slides":[48],"verified":"Checked in Elite Field (KS-KANSAS CITY-Ground), Sept 2026"}]},{"id":"dispositions","title":"Dispositions","entries":[{"id":"dispo-overview","question":"What are the four disposition fields?","aliases":["disposition fields","nemsis dispositions"],"keywords":["disposition","unit disposition","patient evaluation","crew disposition","transport disposition"],"answer":"NEMSIS 3.5 requires four disposition fields on every chart: Unit Disposition, Patient Evaluation/Care, Crew Disposition, and Transport Disposition. Your selections here determine the rest of the required elements in the chart, and earlier selections hide or gray out later options. Patient Evaluation/Care includes two refusal-type selections, plus 'Patient Support Services Provided' for a patient your crew supported but didn't treat (e.g., a specialty team gave all care). A standby has no patient: Unit Disposition = Non-Patient Incident and Patient Evaluation/Care = Not Applicable (see [[entry:standby-response-number|charting a standby]]). The fastest way to set all four is a preset: see [[entry:preset-values|disposition presets]].","source_slides":[49,50,51,52,53],"verified":"Standby combination Checked in Elite Field (KS-KANSAS CITY-Ground), 9/29/2026"},{"id":"dispo-scenarios","question":"Which disposition combination do I use for my call type?","aliases":["cancelled call dispositions","refusal dispositions","standby disposition","no patient found disposition","specialty team disposition","nurse navigation","als intercept","deceased","legal blood draw"],"keywords":["disposition","combination","cancelled","refusal","standby","no patient found","specialty team","other ambulance","preset"],"answer":"Start with the presets on Incident > Type of Call (see [[entry:preset-values|disposition presets]]): 14 buttons on the page, and more behind “Show More Preset Disposition Options Based On” at the bottom of the page. They set the four disposition fields, and some set more. The Reference Tables tab (Disposition Scenario Matrix) lists what each preset sets. Standby is one of the deeper ones: see [[entry:standby-response-number|charting a standby]]. Reminders: only one Transport Disposition exists for refusals (Patient Refused Transport); “Evaluated / Refused Transport” is for a patient who accepted care but refused transport; after selecting the Patient Evaluation/Care value, verify the Crew and Transport Dispositions so the Refusal Worksheet populates correctly.","images":["dispo_no_patient_found.jpg","dispo_cancelled_prior.jpg","dispo_cancelled_on_scene.jpg","dispo_refusal.jpg","dispo_no_transport_other_ambulance.jpg"],"source_slides":[53,54,55,56,57,58,59,60,93],"verified":"Presets Checked in Elite Field (KS-KANSAS CITY-Ground), 9/29/2026"},{"id":"specialty-team","question":"How do I chart a Specialty Team transport (NICU, PICU, critical care team)?","aliases":["nicu transport chart","picu team","team transport documentation","childrens mercy team","flight team"],"keywords":["specialty team","nicu","picu","lifenet","critical care","required data","preset","team"],"answer":"An actual patient must be on board (organ runs are a different preset: see [[entry:organ-transport|organ transports]]). First decide who gave the care, then use the matching preset on Incident > Type of Call:","steps":["Your crew gave care alongside the team: “Specialty/Flight TEAM Transport - (Care Given by this crew)”. It sets Crew Disposition = Initiated and Continued Primary Care and Transport Disposition = Transport by This EMS Unit, with a Member of Another Crew. Chart it as a normal IFT.","The team gave all care and you drove and lifted: “Specialty/Flight TEAM Transport - (NO Care by This Crew)”. It sets Patient Evaluation/Care = Patient Support Services Provided and Crew Disposition = Incident Support Services Provided (Including Standby).","The team rode with no patient on board: “(NO Patient on Board)”. It records a non-patient transport.","Record the team under Incident > Response > Other Agencies On Scene (see [[entry:other-agencies|other agencies]]).","GMR training (v1.19) lists the minimum data for team transports: patient demographics, weight, race, medical history (meds & allergies), complaint, primary symptom, primary impression, exam (may be ‘not done’), a full set of vitals including GCS, exposure/PPE, billing info, CMS Level = Critical Care, and a brief narrative naming the team members."],"warnings":["With the NO-Care preset, validation does not ask for vitals or an assessment, but it still asks for a Caregiver-Transport crew role (rule 1129). Follow the GMR minimum data list above unless Clinical Informatics tells you otherwise."],"source_slides":[60,61],"verified":"Presets and Other Agencies list Checked in Elite Field (KS-KANSAS CITY-Ground), Sept 2026"},{"id":"organ-transport","question":"How do I chart an organ or tissue run with no patient?","aliases":["organ transport","tissue transport","body part transport","organ cooler","non patient transport"],"keywords":["organ","tissue","body part","non-patient","public assist","support"],"answer":"Use the non-patient workflow. Do not create a patient to clear red marks.","steps":["Incident > Type of Call: set Response to Scene, then Type of Encounter = Public Assist / Support (its help text lists organ/body part transport).","Tap the preset “Organ & Body Part Transports” and Apply Changes. It sets Type of Service = Transport of Organs or Body Parts, Unit Disposition = Non-Patient Incident, Patient Evaluation/Care = Not Applicable, Crew Disposition = Incident Support Services Provided, and Transport Disposition = Non-Patient Transport.","Complete dispatch, crew (with a driver), the incident address (the pickup facility, then ZIP Code Lookup), times and the narrative. No patient, vitals or destination rules appear.","Narrative: what you carried, who handed it to you and who received it, with times."],"warnings":["The preset also changes Unit Transport and Equipment Capability to ‘Non-Transport Administrative’. That is how GMR built the preset."],"verified":"Checked in Elite Field (KS-KANSAS CITY-Ground), Sept 2026"},{"id":"preset-values","question":"Is there a fast way to set the dispositions (cancelled calls, refusals, team transports)?","aliases":["preset values","quick cancelled chart","disposition presets","apply new values","show more presets","more preset options","standby preset","hidden presets"],"keywords":["preset","cancelled enroute","cancelled on scene","type of call","apply new values","disposition","show more","standby","support only"],"answer":"Yes. Disposition presets are on Incident > Type of Call, below Type of Service. Tap one and an “Apply New Values?” window lists every field it will set, with the current and new value. Read it, then tap Apply Changes. You can still change any value afterward. There are two layers of presets:","steps":["On the page (14 buttons): Treated / Transported by This Unit · Evaluated / Refused Transport · No Patient Found · Cancelled On Scene · Cancelled En Route · Nurse Navigation / No Transport · ALS Intercept - Ride-In / Transport · Deceased No Transport - Care Given · Deceased on Arrival - NO Care Given · Specialty/Flight TEAM Transport (Care Given by this crew / NO Care by This Crew / NO Patient on Board) · Organ & Body Part Transports · Legal Blood Draw.","More presets, one tap deeper: at the bottom of Type of Call, under “Show More Preset Disposition Options Based On”, tap a category. A new page named “Preset - …” appears in the left menu right under Type of Call. Open it to see that category's presets.","The categories depend on Type of Encounter. Scene / 911, IFT and Routine Medical offer Patient Transport, Patient Contact - No Transport, Cancelled - No Patient Contact and Standby / Support / Other. Standby / Event Coverage and Public Assist / Support offer only Standby / Support / Other.","Standby / Support / Other holds: Standby - No Patient Generated · Admin / Supervisor Response - No Patient Contact · Flight Crew / Specialty Team Transport - No Patient Onboard · Legal Blood Draw · Organ & Body Part Transports. See [[entry:standby-response-number|charting a standby]].","Scene / 911 extras include: On Scene – No Patient Contact / Support Only · On Scene – No Patient Contact / No Support Needed · Patient Evaluated – No Care/No Transport · Refused Evaluation/Care & Transport · Treat-in-Place - Refused Transport · Initiated Care / Other Unit Transported · Assisted Primary Crew / Other Unit Transported.","IFT and Routine extras include: Hospital-to-Hospital, Facility-to-Hospital and Facility-to-Facility transfers · Hospital Discharge - Return Home · refused and cancelled versions of each."],"warnings":["If the Validation panel is open, it can hide the Apply New Values window. Close the panel first.","The preset decides which validation rules appear. Pick the one that matches what actually happened.","Tapping the highlighted Show More category again hides its Preset page.","Changing Type of Encounter does not clear Type of Service. If you switch encounter, check Type of Service before you pick a preset, and always read the Apply New Values window."],"source_slides":[62,63],"verified":"Preset lists Checked in Elite Field (KS-KANSAS CITY-Ground), 9/29/2026"}]},{"id":"clinical","title":"Timeline, Power Tools & Clinical Documentation","entries":[{"id":"timeline","question":"What is the Timeline and why does it matter?","aliases":["edit power tool","timeline red entries"],"keywords":["timeline","chronological","edit","red","gold"],"answer":"The Timeline is a chronological view of everything on the call: times, Power Tools, signatures, and Worksheets. Edit a medication or procedure from its Timeline entry (tap the arrow on the right); the Interventions page shows those read-only. Each Power Tool use or completed Worksheet creates a new entry. Entries with validation errors show RED; warnings show GOLD. Review the Timeline before posting to confirm all times are in order.","source_slides":[64,65],"verified":"Edit paths Checked in Elite Field (KS-KANSAS CITY-Ground), 9/29/2026"},{"id":"power-tools","question":"How do Power Tools work? Can I document two IV attempts in one?","aliases":["iv attempts","one attempt per tool"],"keywords":["power tools","iv access","attempt","procedure"],"answer":"Power Tools are the focused entry point for clinical documentation — NEMSIS, state reporting, and Clinical QA data all come from them. Only ONE attempt per Power Tool: two IV attempts must be documented with two separate IV-Access Power Tools.","source_slides":[66]},{"id":"assessments","question":"How do I document assessments and reassessments?","aliases":["tag normals","tag not done","np tag","reassessment"],"keywords":["assessment","reassessment","tag normals","tag not done","np tag","exam"],"answer":"Use the Assessment Power Tool for physical exam findings, and complete a NEW Assessment Power Tool every time you reassess due to a change in condition. 'Tag Normals' or 'Tag Not Done' selects multiple anatomic sites/systems at once. NP Tag mode documents things you looked for but did not find (e.g., digits, extremities, heart sounds). A free-text box is available for extra detail.","source_slides":[67,68,69]},{"id":"twelve-lead-standard","question":"How do I document a 12-lead? (New standard from Sept 30, 2026)","aliases":["12 lead documentation","12-lead interpretation","ecg interpretation","twelve lead"],"keywords":["12 lead","ecg","ekg","interpretation","vitals","manual interpretation"],"answer":"GMR is standardizing 12-lead documentation across Air & Ground effective September 30, 2026:","steps":["Import the monitor data as usual (EKG button on the Action Bar).","Document YOUR clinical interpretation. In Elite Field this is in the Vitals power tool: Cardiac Rhythm / Electrocardiography (ECG), Method of ECG Interpretation = Manual Interpretation, ECG Type = 12 Lead.","Verify the procedure time and the interpretation time.","Education resources went to regional and local leaders; ask your Clinical Educator."],"warnings":["The announcement also names a 12-Lead ECG Power Tool. As of Sept 23, 2026 it was not in Field's power tools; if it appears, either place meets the standard."],"verified":"GMR announcement posted 9/9/2026; Vitals fields Checked in Elite Field (KS-KANSAS CITY-Ground), Sept 2026"},{"id":"drip-documentation","question":"How do I document an infusion that's already running on an IFT?","aliases":["running drip","infusion","maintain drip","pump rate","infusion fields"],"keywords":["infusion","drip","pump","mg/min","ml/hr","medication","concentration","drip rate"],"answer":"Use the Medication power tool and set Show Infusion Fields = Yes. The tool then keeps the drug dose and the pump rate in separate fields, so each number goes where its units say.","steps":["Medication (Favorites, letter tabs or search), then Dose and Units: the drug dose (e.g., 1 with Units = mg/min).","Show Infusion Fields = Yes opens: Concentration + Concentration Units + Concentration Volume (e.g., 360 mg in 200 mL), Drip Rate + Drip Rate Units (the pump rate, default ml/hr), and End Date/Time.","Route (IV becomes a favorite once infusion fields are on), Response, Complications, Authorization, Role of the person administering.","If the sending facility started it, answer Prior to Arrival and Administered by Another Provider to match what happened, per GMR guidance.","Make the narrative match the structured entry exactly: same drug, dose, units and rate."],"warnings":["The pump's mL/hr goes in Drip Rate, never in Dose. A pump rate typed into a mg/min dose turns a routine drip into an apparent overdose on the chart."],"verified":"Medication tool infusion fields Checked in Elite Field (KS-KANSAS CITY-Ground), 9/29/2026"},{"id":"blood-products-2026","question":"What's changing for blood product documentation? (Sept 30, 2026)","aliases":["blood products","uncrossmatched blood","blood transfusion documentation","prbc","whole blood"],"keywords":["blood","blood products","uncrossmatched","abo","rh","unit number","transfusion"],"answer":"GMR is updating blood product documentation across Air & Ground effective September 30, 2026:","steps":["Keep documenting blood products in the Blood Products power tool (Blood Prod in the right rail).","The Uncrossmatched Blood Acknowledgement moves from the worksheet to Signatures.","New validation reminders flag a missing Unit Number, ABO Type and Rh Factor when they apply."],"verified":"GMR announcement posted 9/28/2026; Blood Prod power tool Checked in Elite Field (KS-KANSAS CITY-Ground), Sept 2026"},{"id":"situations","question":"What are Situations?","aliases":["situation tools"],"keywords":["situations","combined power tools"],"answer":"Situations combine multiple Power Tools so you can logically document through a routine procedure or situation in one flow. GMR's long-term direction is to primarily use Situations rather than individual Power Tools.","source_slides":[70]},{"id":"clinical-review","question":"What is the Clinical Review section?","aliases":["blood glucose questions","supplemental questions"],"keywords":["clinical review","supplemental","blood glucose","quality"],"answer":"The Clinical Review section holds supplemental questions used for clinical quality or data projects (e.g., blood glucose). Some run nationwide; many are restricted by geography, patient type, or other criteria — so you may not always see the same questions.","source_slides":[71]},{"id":"read-only","question":"Why can't I edit a medication or procedure from the Interventions page?","aliases":["read only tab","can't edit medication","can't edit procedure","fix a vital sign","edit power tool"],"keywords":["read only","medications","procedures","vital signs","edit","timeline"],"answer":"Tapping a row on Interventions > Medications or Interventions > Procedures opens it READ-ONLY (the fields are greyed out). To change it, open the Timeline in the right rail and tap the arrow on that entry: it reopens the power tool with editable fields. Vital Signs is different: tapping a row on Interventions > Vital Signs opens it for editing. Never use a right-rail power-tool button to fix an old entry; it always creates a NEW record.","source_slides":[72],"verified":"Checked in Elite Field (KS-KANSAS CITY-Ground), 9/29/2026"},{"id":"clinical-doc-requirements","question":"What clinical documentation is required on every chart?","aliases":["narrative requirements","documentation standards"],"keywords":["clinical documentation","narrative","gcs","vitals","procedures","hospital to hospital"],"answer":"Every chart needs: a physical exam including mental status (GCS, LOC, etc.) and vital signs; whether an ALS assessment was performed and by whom; thorough documentation of procedures, medications, and supplies used on scene AND during transport; and a complete narrative capturing information not held in discrete fields (events leading up to the incident, bystander information, etc.). On a hospital-to-hospital transport, document what specific service was NOT available at the first hospital.","source_slides":[97]}]},{"id":"billing","title":"Billing, IFT & CMS","entries":[{"id":"ift-justification","question":"What goes in the interfacility transport justification box?","aliases":["ift text box","transfer justification"],"keywords":["interfacility","ift","justification","transfer","payer"],"answer":"The dropdowns for reason-for-transport and receiving-facility capabilities are typically NOT enough for payers to determine the patient went to the most appropriate facility. Use the free-text box in the transfer/transport tab to add specific justification — including, for hospital-to-hospital transports, exactly what service was unavailable at the sending facility.","source_slides":[73,97]},{"id":"cms-level","question":"How do I pick the CMS Level of Service?","aliases":["cms level","level of service"],"keywords":["cms","level of service","reasonable","necessary","billing status"],"answer":"CMS bases level of service on the care actually provided to the patient, and only if that care was reasonable and necessary. Select the level based on the definitions provided in the field. This field is NOT used to determine the patient's billing status.","source_slides":[74]},{"id":"insurance-info","question":"What insurance details should I capture?","aliases":["mva insurance","workers comp documentation"],"keywords":["insurance","policy","subscriber","mva","auto","workers comp","employer"],"answer":"When possible, add the insurance company name and policy or subscriber number. If the call is related to an MVA, document the auto insurance information. If it's related to Workers' Compensation, document the employer name and phone number.","source_slides":[75]},{"id":"payer-medicare","question":"Where do I enter Medicare, Medicaid or other insurance?","aliases":["medicare","medicaid","primary method of payment","billing insurance","medicare advantage"],"keywords":["medicare","medicaid","payment","insurance","billing insurances"],"answer":"Primary Method of Payment offers only Insurance, Auto Insurance, No Insurance Identified (Unknown) and Workers Compensation. Medicare, Medicaid and commercial plans are all “Insurance.” Then add a row under Billing Insurances and pick the company from the list by typing part of the name (Medicare, Railroad Medicare, Medicaid, commercial carriers). Medicare Advantage plans appear under the carrier's name, not “Medicare.”","verified":"Checked in Elite Field (KS-KANSAS CITY-Ground), Sept 2026"},{"id":"zip-lookup","question":"The address filled in, but ZIP / City / County rules are still red.","aliases":["zip code lookup","city still red","county missing","facility address rules"],"keywords":["zip","city","county","lookup","3002","3166","3167","facility"],"answer":"Facility and address auto-fill does not satisfy the ZIP Code Lookup rules (15 points each). Press ZIP Code Lookup on the incident address, the patient's home address and the destination. The lookup writes the official city name (e.g., “City of Olathe”). If a ZIP covers more than one city, a picker opens; it can sit below the fold, so scroll and choose.","verified":"Checked in Elite Field (KS-KANSAS CITY-Ground), Sept 2026"},{"id":"destination-type","question":"I picked the destination facility and Type of Destination changed.","aliases":["type of destination other","destination type wrong","snf shows other"],"keywords":["destination","type of destination","facility","other","skilled nursing"],"answer":"Picking a facility can overwrite Type of Destination with the type stored on that facility's record (a skilled nursing facility came in as “Other”). Pick the facility first, then check and correct Type of Destination. It feeds billing.","verified":"Checked in Elite Field (KS-KANSAS CITY-Ground), Sept 2026"},{"id":"ift-home-address","question":"On an IFT, should I tap “Mailing Address Same as Incident Address”?","aliases":["same as incident address","home address ift","mailing address"],"keywords":["mailing address","incident address","ift","home address"],"answer":"No. On an IFT the incident address is the sending facility, so that button records the hospital as the patient's home. Enter the home address from the face sheet and press ZIP Code Lookup.","verified":"Checked in Elite Field (KS-KANSAS CITY-Ground), Sept 2026"}]},{"id":"worksheets","title":"Worksheets & Signatures","entries":[{"id":"worksheets-overview","question":"What are Worksheets for?","aliases":["signature worksheets","paper forms"],"keywords":["worksheets","signatures","aba","refusal","paper","electronic"],"answer":"Worksheets guide crews to the PROPER signature inside a chart, populating intuitively from your answers throughout the template. The most-used worksheets are the Ambulance Billing Authorization (ABA) and Patient Refusal. ImageTrend is designed to capture electronic signatures — paper forms should only be used during downtime or tablet failure.","source_slides":[76]},{"id":"aba-worksheet","question":"When does the ABA appear and who signs?","aliases":["ambulance billing authorization","aba required","aba navigation"],"keywords":["aba","signatures","transport","signature","capable","willing"],"answer":"The ABA (Ambulance Billing Authorization) is required for ALL transports and only appears when the patient was TREATED AND TRANSPORTED. Go to Signatures > ABA Navigation and answer “Capable of signing?” (“Willing to sign?” appears after it). Your answers pick the correct signature type and open the ABA form, which will not close until its signature pads are signed. (The v1.19 training placed this under a Billing tab; the current form has it under Signatures.)","source_slides":[80,81],"verified":"Checked in Elite Field (KS-KANSAS CITY-Ground), Sept 2026"},{"id":"aba-scenarios","question":"The patient can't sign the ABA. What are my options?","aliases":["patient unable to sign","no signature","who signs for patient","co-sign"],"keywords":["aba","unable to sign","authorized representative","co-sign","attestation","face sheet"],"answer":"Four scenarios, in order of preference: (1) Patient unable to sign but an AUTHORIZED REPRESENTATIVE is present — the representative signs. (2) Patient unable to sign an
