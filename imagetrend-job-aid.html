<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AMR KC ITJA">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-193.png">
<title>ImageTrend Job Aid &mdash; AMR KC</title>
<meta name="description" content="ePCR charting quick reference for ImageTrend Elite &mdash; workflow, dispositions, worksheets, validation, and troubleshooting.">
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap');
:root{
  --bg:#ffffff;--surface:#ffffff;--surface2:#f4f6f9;--border:#e2e6ec;
  --teal:#173a68;--teal2:#1b63c4;--white:#152238;--gray:#66707c;--dim:#f1f4f8;
  --danger:#dc2626;--danger-bg:#fdecec;--warn:#a1590b;--warn-bg:#fef3e2;--info-bg:#eaf4fc;
  --emt:#15803d;--emt-bg:#eafbf1;
  --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{font-family:var(--sans);color:var(--white);min-height:100vh;line-height:1.5;padding-bottom:40px}

.backlink{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;
letter-spacing:0.08em;text-transform:uppercase;color:var(--teal2);text-decoration:none;padding:14px 16px 0}
.backlink:active{opacity:0.6}

#hdr{background:var(--bg);border-bottom:1px solid var(--border);padding:2px 16px 12px;
position:sticky;top:0;z-index:50}
.hdr-title{font-size:20px;font-weight:700;margin-top:6px}
.hdr-sub{font-size:12px;color:var(--gray);margin-top:3px;line-height:1.5}
.sw{margin-top:12px;position:relative}
#srch{width:100%;height:42px;background:var(--dim);border:1.5px solid var(--border);border-radius:8px;
color:var(--white);font-family:var(--sans);font-size:15px;padding:0 38px 0 36px;
outline:none;-webkit-appearance:none;transition:border-color 0.15s}
#srch:focus{border-color:var(--teal)}
#srch::placeholder{color:var(--gray)}
.si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--gray);font-size:15px;pointer-events:none}
#sc{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;
color:var(--gray);font-size:16px;cursor:pointer;display:none;line-height:1;padding:6px}

.tabs{display:flex;gap:6px;padding:10px 16px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);
background:var(--dim);color:var(--gray);font-size:12px;font-weight:600;cursor:pointer;
font-family:var(--sans)}
.tab-btn.on{border-color:var(--teal);color:#fff;background:var(--teal)}

#main{padding:14px 0 20px}
.pane{display:none}
.pane.on{display:block}

/* Quick actions — "common problems" grid, everything visible, big tap targets */
.qa-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 16px}
.qa-chip{display:flex;align-items:center;min-height:52px;padding:10px 12px;background:var(--info-bg);
border:1px solid var(--teal2);border-radius:10px;color:var(--teal2);font-size:12.5px;
font-weight:600;line-height:1.35;cursor:pointer;font-family:var(--sans)}
.qa-chip:active{opacity:0.7}

.sec-lbl{padding:4px 16px 8px;font-family:var(--mono);font-size:10px;font-weight:600;
letter-spacing:0.12em;color:var(--teal);text-transform:uppercase}

/* Topic accordion */
.topic{margin:0 12px 8px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface2);
scroll-margin-top:150px}
.topic-hdr{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
.topic-ico{width:30px;height:30px;border-radius:8px;background:var(--dim);flex-shrink:0;
display:flex;align-items:center;justify-content:center;color:var(--teal2)}
.topic-title{flex:1;font-size:14px;font-weight:600}
.topic-count{font-family:var(--mono);font-size:10px;color:var(--gray);flex-shrink:0}
.topic-chevron{color:var(--gray);font-size:12px;flex-shrink:0;transition:transform 0.2s}
.topic.open .topic-chevron{transform:rotate(90deg)}
.topic-body{display:none;padding:0 8px 8px}
.topic.open .topic-body{display:block}

.entry{background:var(--surface);border:1px solid var(--border);border-radius:8px;
margin:6px 4px;overflow:hidden;scroll-margin-top:150px}
.entry-hdr{display:flex;align-items:flex-start;gap:8px;padding:11px 12px;cursor:pointer}
.entry-q{flex:1;font-size:13.5px;font-weight:600;line-height:1.4}
.entry-chevron{color:var(--gray);font-size:11px;flex-shrink:0;margin-top:2px;transition:transform 0.2s}
.entry.open .entry-chevron{transform:rotate(90deg)}
.entry-body{display:none;padding:0 12px 14px}
.entry.open .entry-body{display:block}
.entry-answer{font-size:13.5px;line-height:1.65;color:var(--white)}
.e-link{color:var(--teal2);font-weight:600;text-decoration:underline;cursor:pointer}
.entry-steps{margin-top:10px}
.e-step{display:flex;gap:8px;margin-bottom:7px;align-items:flex-start}
.e-step-num{flex-shrink:0;width:20px;height:20px;border-radius:50%;background:var(--teal);color:#fff;
font-weight:700;font-size:10px;display:flex;align-items:center;justify-content:center;font-family:var(--mono)}
.e-step-text{font-size:13px;line-height:1.5;color:var(--white)}
.e-warn{background:var(--warn-bg);border-left:3px solid var(--warn);border-radius:0 7px 7px 0;
padding:9px 12px;font-size:12.5px;color:var(--warn);line-height:1.55;margin-top:10px}
.e-imgs{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.e-imgs::-webkit-scrollbar{display:none}
.e-img{flex-shrink:0;width:110px;height:82px;object-fit:cover;border-radius:6px;
border:1px solid var(--border);cursor:zoom-in}
.e-src{font-family:var(--mono);font-size:9.5px;color:var(--gray);margin-top:10px}
mark{background:#fde68a;color:inherit;border-radius:2px}

.empty-state{text-align:center;padding:40px 20px;color:var(--gray);font-size:13px}

/* Reference tables */
.ref-block{margin:0 16px 20px}
.ref-block-title{font-size:14px;font-weight:700;margin-bottom:4px}
.ref-block-note{font-size:11.5px;color:var(--gray);line-height:1.5;margin-bottom:10px}
.optlist{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.optlist-h{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:0.06em;
color:var(--teal2);text-transform:uppercase;margin-bottom:6px}
.optlist li{list-style:none;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--border);color:var(--white)}
.optlist li:last-child{border-bottom:none}

.scen-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;
padding:12px 14px;margin-bottom:10px}
.scen-title{font-size:13.5px;font-weight:700;margin-bottom:8px}
.scen-row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px}
.scen-row:last-of-type{border-bottom:none}
.scen-lbl{color:var(--gray);flex-shrink:0}
.scen-val{color:var(--white);text-align:right;font-weight:600}
.scen-note{font-size:11.5px;color:var(--gray);line-height:1.5;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}
.scen-img{margin-top:10px;width:100%;max-width:220px;border-radius:6px;border:1px solid var(--border);cursor:zoom-in;display:block}

.def-item{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:11px 13px;margin-bottom:8px}
.def-val{font-size:12.5px;font-weight:700;color:var(--teal2);margin-bottom:4px}
.def-text{font-size:12.5px;color:var(--white);line-height:1.55}

/* Lightbox */
#lb{display:none;position:fixed;inset:0;background:rgba(10,14,20,0.92);z-index:900;
align-items:center;justify-content:center;padding:20px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;border-radius:8px}
#lb-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,0.15);border:none;
color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}

.footer-note{margin:24px 16px 0;padding:14px 16px;background:var(--surface2);border:1px solid var(--border);
border-radius:10px;font-size:11px;color:var(--gray);line-height:1.7;text-align:center}
.footer-note a{color:var(--teal2);text-decoration:none;font-weight:600}

/* Ask the Educator */
.edu-box{display:flex;align-items:center;gap:13px;margin:24px 16px 0;padding:14px 15px;
background:var(--info-bg);border:1px solid var(--teal2);border-radius:12px;text-decoration:none}
.edu-box:active{opacity:0.75}
.edu-avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--teal);flex-shrink:0}
.edu-info{flex:1;min-width:0}
.edu-title{font-size:14px;font-weight:700;color:var(--white);margin-bottom:2px}
.edu-sub{font-size:11.5px;color:var(--gray);line-height:1.5}
.edu-arr{color:var(--teal2);font-size:20px;flex-shrink:0}
</style>
</head>
<body>

<a class="backlink" href="index.html">&#x2190; Field Guide</a>

  <div class="hdr-title" id="jaTitle">ImageTrend Job Aid</div>

</div>

<script>
var KB = {"meta":{"title":"ImageTrend Elite Field Job Aid","audience":"AMR/GMR field providers (EMT/Paramedic)","source":"GMR ImageTrend Elite End User Training v1.19 (3.4.2025)","maintainer":"AMR Kansas City Clinical Education","disclaimer":"Operational job aid derived from GMR training material. Where this conflicts with current GMR Clinical Informatics guidance or announcements, the current guidance controls.","support":{"portal":"support-clinical.gmr.net","note":"Open the 'GMR - Clinical Support' tile in Okta. (Replaces the former Kayako portal.)"}},"quick_actions":[{"label":"CAD data isn\u2019t coming in","entry":"cad-download"},{"label":"CAD is down","entry":"cad-down"},{"label":"Standby \u2014 response number?","entry":"standby-response-number"},{"label":"Fix a \u201cmissing report\u201d","entry":"missing-report"},{"label":"Facility isn\u2019t listed","entry":"missing-facility"},{"label":"I can\u2019t post my chart","entry":"trouble-cant-post"},{"label":"I can\u2019t find my chart","entry":"trouble-missing-chart"},{"label":"My chart is locked","entry":"kayako-unlock"},{"label":"The app is throwing errors","entry":"sync-first-step"},{"label":"How do I add an addendum?","entry":"addendum-how"},{"label":"Partner\u2019s signature missing","entry":"missing-signature"},{"label":"Which disposition combo?","entry":"dispo-scenarios"},{"label":"Patient can\u2019t sign the ABA","entry":"aba-scenarios"},{"label":"Patient is refusing","entry":"refusal-worksheet"}],"reference_tables":{"disposition_field_options":{"note":"Full option sets shown on source slides 50-53. Availability of later options depends on earlier selections (visibility rules).","unit_disposition":["Patient Contact Made","Cancelled on Scene","Cancelled Prior to Arrival at Scene","No Patient Contact","No Patient Found","Non-Patient Incident (Not Otherwise Listed)"],"patient_evaluation_care":["Patient Evaluated and Care Provided","Patient Evaluated and Refused Care","Patient Evaluated, No Care Required","Patient Refused Evaluation/Care","Patient Support Services Provided"],"crew_disposition":["Initiated and Continued Primary Care","Initiated Primary Care and Transferred to Another EMS Crew","Provided Care Supporting Primary EMS Crew","Assumed Primary Care from Another EMS Crew","Incident Support Services Provided (Including Standby)","Back in Service, No Care/Support Services Required","Back in Service, Care/Support Services Refused"],"transport_disposition":["Transport by This EMS Unit (This Crew Only)","Transport by This EMS Unit, with a Member of Another Crew","Transport by Another EMS Unit","Transport by Another EMS Unit, with a Member of This Crew","Patient Refused Transport","Non-Patient Transport (Not Otherwise Listed)","No Transport"],"source_slides":[50,51,52,53]},"disposition_scenario_matrix":{"note":"Transcribed from screenshot slides 54-60 of the v1.19 training deck. 'Not Applicable' means the field is grayed out / auto-set by visibility rules for that scenario. Matching slide images are shown with each scenario below for visual confirmation.","scenarios":[{"scenario":"Cancellation - No Patient Found","unit_disposition":"No Patient Found","patient_evaluation_care":"Not Applicable","crew_disposition":"Back in Service, No Care/Support Services Required","transport_disposition":"Not Applicable","image":"dispo_no_patient_found.jpg","source_slide":54},{"scenario":"Cancelled Prior to Arrival / Enroute","unit_disposition":"Cancelled Prior to Arrival at Scene","patient_evaluation_care":"Not Applicable","crew_disposition":"Back in Service, No Care/Support Services Required","transport_disposition":"Not Applicable","image":"dispo_cancelled_prior.jpg","source_slide":55},{"scenario":"Cancelled on Scene","unit_disposition":"Cancelled on Scene","patient_evaluation_care":"Not Applicable","crew_disposition":"Back in Service, No Care/Support Services Required","transport_disposition":"No Transport","image":"dispo_cancelled_on_scene.jpg","source_slide":56},{"scenario":"Patient Refused Medical Aid - WITH patient assessment/vitals","unit_disposition":"Patient Contact Made","patient_evaluation_care":"Patient Evaluated and Refused Care","crew_disposition":"Back in Service, Care/Support Services Refused","transport_disposition":"Patient Refused Transport","image":"dispo_refusal.jpg","source_slide":57},{"scenario":"Patient Refused Medical Aid - WITHOUT patient assessment/vitals","unit_disposition":"Patient Contact Made","patient_evaluation_care":"Patient Refused Evaluation/Care","crew_disposition":"Back in Service, Care/Support Services Refused","transport_disposition":"Patient Refused Transport","image":"dispo_refusal.jpg","source_slide":57},{"scenario":"No Transport / Other Ambulance","unit_disposition":"Patient Contact Made","patient_evaluation_care":"Patient Evaluated and Care Provided","crew_disposition":"Initiated Primary Care and Transferred to Another EMS Crew","transport_disposition":"No Transport","image":"dispo_no_transport_other_ambulance.jpg","source_slide":58},{"scenario":"Standby","unit_disposition":"Non-Patient Incident (Not Otherwise Listed)","patient_evaluation_care":"Patient Support Services Provided","crew_disposition":"Incident Support Services Provided (Including Standby)","transport_disposition":"Not Applicable","notes":"Slide 59 also shows 'Back in Service, No Care/Support Services Required' and 'Back in Service, Care/Support Services Refused' as available Crew Disposition alternates for standby-type incidents.","image":"dispo_standby.jpg","source_slide":59},{"scenario":"Specialty Team Transport","unit_disposition":"Patient Contact Made","patient_evaluation_care":"Patient Evaluated and Care Provided","crew_disposition":"Provided Care Supporting Primary EMS Crew","transport_disposition":"Transport by This EMS Unit, with a Member of Another Crew","image":"dispo_specialty_team.jpg","source_slide":60}]},"crew_disposition_definitions":{"note":"Definitions as printed on source slide 52.","definitions":[{"value":"Initiated and Continued Primary Care","definition":"This crew began primary care for this patient with no previous care provided on-scene and did not transfer the care to another unit. Generally a one-unit response where no other crew or unit was present. If multiple units from the same agency respond as an organized response and local rules do not require each unit to do a separate report, this value applies to the agency response of multiple units under one report. For transfers, 'Primary Care' begins once the crew receives responsibility for the patient; care provided by the sending facility does not qualify as previous care."},{"value":"Initiated Primary Care and Transferred to Another EMS Crew","definition":"This crew began primary care for this patient with no previous care provided on scene, and then transferred the care to another unit."},{"value":"Provided Care Supporting Primary EMS Crew","definition":"Another crew started and continued primary care, and this unit provided patient care supporting the primary crew's care. For example, first responders arrived at the same time or later than the transport crew and helped provide care but were not the primary crew in charge of patient care."},{"value":"Assumed Primary Care from Another EMS Crew","definition":"This crew assumed primary care of a patient that was initiated by another EMS crew. Commonly used by an ALS intercept unit arriving and taking over primary care from a BLS unit."},{"value":"Incident Support Services Provided (Including Standby)","definition":"This crew/unit provided non-patient-care support services to an incident in general or to another unit/crew that is providing patient care. Support services could include extrication, carrying bags or equipment, helping move a patient, standby for police, or fire/fire-rehab services where no one rose to the level of a patient."},{"value":"Back in Service, No Care/Support Services Required","definition":"This crew/unit is immediately back in service as there was no patient care or support services required at the incident. Primarily applies if no patient was found or the unit was cancelled on scene."},{"value":"Back in Service, Care/Support Services Refused","definition":"This crew/unit is back in service after patient care or support services were refused despite being offered. No care or support services should be provided; however, an evaluation may have occurred prior to refusal of any care."},{"value":"Not Applicable","definition":"The unit was cancelled prior to arrival on scene per the Unit Disposition, therefore the Crew Incident Disposition is Not Applicable."}],"source_slides":[52]}},"topics":[{"id":"basics","title":"Basics & Workflow","entries":[{"id":"what-is-imagetrend","question":"What is ImageTrend Elite?","aliases":["what is elite","what program do we chart in","what is the epcr"],"keywords":["imagetrend","elite","epcr","nemsis"],"answer":"ImageTrend Elite is GMR's electronic Prehospital Care Report (ePCR) system, used across GMR Air and Ground. It is NEMSIS 3.5 compliant. ePCRs improve documentation quality and legibility, support data collection for research and regulators, enhance QI, expedite reimbursement, allow cardiac monitor data import, and meet federal standards.","source_slides":[3,4]},{"id":"call-workflow","question":"What is the basic charting workflow for a shift?","aliases":["how do I chart a call","steps to document a call","workflow"],"keywords":["workflow","steps","overview","shift"],"answer":"Standard flow for every shift:","steps":["Log in to Elite Field at the start of shift (blue background = Field).","Set your crew, unit, and call sign (and cardiac monitor if applicable).","Start each new incident from CAD with the correct data.","Complete the chart to a validation score of 100.","Post the chart and mark it as finished.","Repeat steps 3\u20135 for each call. Post early, post often."],"source_slides":[5,12]},{"id":"first-login","question":"How do I log in for the first time? What is my username and temporary password?","aliases":["initial login","first password","what is my username","new hire login"],"keywords":["login","username","password","employee number","first time"],"answer":"Your username is your employee number (e.g., 12345678) and is permanent. Your temporary password is your month of birth + year of birth + exclamation point (e.g., July1990!). You will be prompted to change it immediately on first login.","source_slides":[6]},{"id":"green-check-red-x","question":"What do the green check mark and red X next to my username mean?","aliases":["red x on login","green checkmark login"],"keywords":["green check","red x","username","login","cache"],"answer":"After you enter your username and move to the password field, a green check mark appears for all active accounts. A red X means the username has never logged in, is typed incorrectly, or the account is no longer active. After a browser cache clear, the red X may reappear on a valid account \u2014 attempt to log in normally. If it persists after your first successful login, file a Clinical Support ticket.","source_slides":[13]},{"id":"field-vs-web","question":"What's the difference between Elite Field and Elite Web?","aliases":["field or web","which one do I use","web vs field"],"keywords":["elite field","elite web","difference","comparison"],"answer":"Elite Field (BLUE background) is where field personnel START all documentation. It works offline, requires syncing, and requires an internet connection only to Post. It stores non-posted incidents locally for a limited window (roughly 1\u20134 days depending on agency call volume). Elite Web is for working on posted charts: finishing incomplete posted charts and adding addendums or attachments. Web requires an internet connection, needs no syncing, has no Post button, and provides module access (permission-dependent). Charts can be edited and finished in Web but not created there.","source_slides":[9,12,25,101,105,106]},{"id":"demo-account","question":"Is there a demo/practice account?","aliases":["practice account","training login","demo chart"],"keywords":["demo","gmrdemo","practice","training"],"answer":"Yes \u2014 Ground demo account: username gmrdemo, password GMR1234!, at https://gmr.imagetrendelite.com/Elite/Organizationgmr/. Use it for practice chart creation only, never for real patient documentation.","source_slides":[8,111]}]},{"id":"devices","title":"Devices, Browsers & Setup","entries":[{"id":"browser-requirements","question":"Which browsers and devices can I use?","aliases":["can I use my phone","personal device","which browser","internet explorer"],"keywords":["browser","chrome","edge","device","personal","authorized"],"answer":"Use Google Chrome or Microsoft Edge only \u2014 Internet Explorer is NOT supported. Elite Field stores data in the browser cache; if prompted to increase local storage, allow it. Spellcheck is a browser function, not part of the program. Only GMR-authorized company devices may access the system \u2014 no personal computers or devices, ever. Charting can occur offline, but posting requires an internet connection.","warnings":["Device authorization is approved by GMR. Personal devices are prohibited."],"source_slides":[10,11]},{"id":"operation-select","question":"Why am I being asked to pick an agency when I log in?","aliases":["agency selector","operation select","wrong base"],"keywords":["agency","operation","selector","base"],"answer":"If your account has access to more than one operation, an Agency Selector box appears after login. Choose the correct agency (base) location for your shift.","source_slides":[15]},{"id":"shift-start","question":"What should I do in ImageTrend at the start of my shift?","aliases":["beginning of shift","shift setup"],"keywords":["shift","start","sync","crew","setup"],"answer":"Log in to Elite Field at the beginning of the shift, confirm you have access, build your crew, and sync resources. The system auto-syncs on every login \u2014 this is normal and required. Syncing ensures you're on the current program version with current users, vehicles, and validation rules.","source_slides":[12,14]}]},{"id":"crew","title":"Crew, Unit & Roles","entries":[{"id":"crew-menu","question":"How do I set up my crew?","aliases":["add crew member","remove crew member","crew menu"],"keywords":["crew","add","remove","level"],"answer":"In the Crew Menu, click +Add to add crew members from your agency and verify each member's level is correct. Previous crew members may still be listed from a prior login \u2014 click x Remove to clear them. Crew Menu selections auto-fill into charts you create and filter selection lists for you.","source_slides":[17,18]},{"id":"crew-roles","question":"What crew roles are required on a chart?","aliases":["minimum roles","driver role","primary caregiver role"],"keywords":["roles","driver","primary caregiver","transport","required"],"answer":"Every chart requires at minimum a 'Driver/Pilot-Response' and a 'Primary Patient Caregiver-At Scene.' Transport charts also need the transport versions of these roles. Role assignments are dynamic per chart \u2014 assign roles inside each individual chart, not in the Crew Menu.","source_slides":[18]},{"id":"outside-providers","question":"How do I document providers who aren't in our system, or students?","aliases":["fire department on scene","outside medic","student rider","observer"],"keywords":["other ems","public safety","healthcare professional","student","intern","observer"],"answer":"Use 'Other EMS or Public Safety, Agency at Scene' or 'Other Healthcare, Professional' to indicate providers not in our system. Use the 'Student' level for students, interns, or observers. The Level list is comprehensive but limited by state validation criteria.","source_slides":[19]},{"id":"unit-monitor","question":"How do I set my unit, call sign, and cardiac monitor?","aliases":["select vehicle","select monitor","call sign"],"keywords":["unit","vehicle","call sign","monitor","ambulance icon"],"answer":"Click the ambulance icon to select your vehicle and call sign. Click the monitor icon to select the cardiac monitor you'll be working with \u2014 this smooths monitor data flow into your charts.","source_slides":[20]}]},{"id":"toolbar","title":"Toolbar, Sync & Error Handling","entries":[{"id":"toolbar-overview","question":"What's on the Elite Field toolbar?","aliases":["inbox","settings menu","about menu","announcements"],"keywords":["toolbar","inbox","settings","about","logout","announcements"],"answer":"Inbox \u2014 CQI, Documentation, Billing and Patient Outcomes messages. Settings \u2014 manual syncing and external keyboard settings. About \u2014 shows your Elite Field version and lets you submit errors/diagnostics. Logout \u2014 always log out before closing the browser. Announcements \u2014 messages from GMR Clinical Informatics about functionality and updates.","source_slides":[21,22,108]},{"id":"sync-first-step","question":"The program is giving me an error. What do I do first?","aliases":["app error","program glitch","elite not working","how to sync"],"keywords":["error","sync","sync all resources","troubleshoot","glitch"],"answer":"Sync first \u2014 it's the first step for any program error.","steps":["If you're in an active incident, close it and return to the Elite Field home page.","Click Settings on the toolbar.","Click 'Sync All Resources' and follow the prompts.","If the error persists: open About, click 'Upload Diagnostic Data', follow the prompts, then file a Clinical Support ticket."],"source_slides":[23,24]}]},{"id":"incidents","title":"Incidents, CAD & Chart Anatomy","entries":[{"id":"incident-views","question":"Where did my older incidents go on the home screen?","aliases":["incident list views","old incidents missing"],"keywords":["incident views","list","tile","panel","old incidents"],"answer":"Three home-screen views are available: List (default), Tile, and Panel. Incidents remain visible in Field for only about 1\u20132 days depending on your agency's call volume (the Web/Field comparison lists non-posted storage up to 4 days). For older, posted, or completed incidents, log in to Elite Web.","source_slides":[25,26,105]},{"id":"chart-anatomy","question":"What are the parts of a chart screen?","aliases":["chart layout","screen layout"],"keywords":["navigation menu","power tools","worksheets","action bar","situations","validation score","menu panel","timeline","field search"],"answer":"A chart contains: Navigation Menu, Power Tools, Worksheets, Action Bar, Situations, Validation Rule Score, Menu Panel, Timeline, Times, and Field Search. Elite Field and Web use the same chart layout; the only difference is the Action Bar (Web has no Post button).","source_slides":[28,29]},{"id":"action-bar","question":"What do the Action Bar buttons do?","aliases":["post button","print chart","pdf view","transfers button"],"keywords":["action bar","post","print","pdf","cad","ekg","transfers","save"],"answer":"Post (Field only) \u2014 sends the chart to the ImageTrend cloud so it's accessible in Web. Print \u2014 prints a PDF view. PDF \u2014 displays a PDF view. CAD \u2014 downloads or refreshes the CAD record. EKG \u2014 imports monitor cases from Zoll, Physio-Control, or Philips. Transfers (if enabled) \u2014 shares chart data internally between units. The chart auto-saves each time you click Next or change navigation menus; a manual Save button is also available.","source_slides":[29]},{"id":"cad-download","question":"CAD data isn't coming in (or looks wrong). How do I add, refresh, or fix it?","aliases":["cad not coming in","no cad data","cad data missing","cad wrong","cad won't download","missing cad","download cad","refresh cad","link cad to chart"],"keywords":["cad","download","refresh","call sign","unit number","missing","not coming in"],"answer":"Most \u201cCAD isn\u2019t coming in\u201d problems are fixed by pulling the record manually and double-checking that the CAD record actually matches your unit.","source_slides":[30],"steps":["Inside the chart, tap the CAD icon on the Action Bar.","Verify the record is YOURS \u2014 match Call Sign, Unit Number, and Date.","Tap the download button on the right side of the screen. The same process refreshes a CAD record you already downloaded.","Still not coming in? Confirm your unit and call sign are set correctly (see \u201cHow do I set my unit, call sign, and cardiac monitor?\u201d), sync, and try the download again.","If CAD itself is down, use the CAD Down panel instead \u2014 see \u201cCAD is down\u201d."]},{"id":"cad-down","question":"CAD is down. How do I chart without a CAD record?","aliases":["no cad","cad outage","logis down","cad down panel"],"keywords":["cad down","outage","incident number","response number","unknown"],"answer":"Elite Field has built-in CAD Down functionality. When your incident and response numbers are blank AND you've entered a 'Unit Back in Service Date/Time,' the CAD Down panel becomes visible. It first asks you to attempt a CAD download. If you answer 'No,' complete the CAD Down incident and response number fields with what you believe the numbers should be, or the word 'Unknown.' Your chart can still reach a validation score of 100.","warnings":["If Clinical Support later adds response/incident numbers for you (CAD outage or Logis issues), the numbers must also be in your narrative."],"source_slides":[31,32,110]},{"id":"standby-response-number","question":"Do I chart standbys? How do I get a response number for one?","aliases":["standby response number","response number for standby","standby pcr","do i chart a standby","standby paperwork","no response number standby","standby chart","logis standby"],"keywords":["standby","response number","logis","cad","request","pcr"],"answer":"Yes \u2014 complete a patient care report for EVERY standby. The part that trips people up: a standby response number is NOT automatically assigned to your unit through LOGIS or the CAD, so don\u2019t sit waiting for one to appear. You have to request it yourself.","steps":["Create a PCR for every standby \u2014 no exceptions.","Don\u2019t wait for CAD \u2014 LOGIS/CAD will not push a standby response number to your unit automatically.","Request the response number yourself.","Enter the number on your chart, then use the Standby disposition combination (Reference Tables tab)."],"warnings":["This wasn\u2019t covered in the ImageTrend training PowerPoint \u2014 guidance from AMR KC Clinical Education."],"images":["dispo_standby.jpg"]},{"id":"ekg-import","question":"How do I import my cardiac monitor data?","aliases":["import ekg","lifepak import","monitor data"],"keywords":["ekg","monitor","physio-control","zoll","philips","import"],"answer":"Click the EKG button on the Action Bar, select the source (e.g., Physio-Control Cloud), select the correct case by Monitor Number, and click the download button on the right side.","source_slides":[29,33]},{"id":"menu-panel-delete","question":"Can I delete a chart? Where are attachments and addendums?","aliases":["delete chart","add attachment","add addendum"],"keywords":["delete","attachments","addendums","lock","menu panel"],"answer":"The Menu Panel holds Attachments, Addendums, Delete, and (in Web) Lock. Crews can delete a chart at any time BEFORE it is Posted \u2014 deleted charts are gone forever, so make certain you're deleting the right chart for the right reason. After posting, attachments and addendums can still be added in Elite Web.","warnings":["Deleted charts are unrecoverable."],"source_slides":[34,101]}]},{"id":"validation","title":"Validation & Pertinent Negatives","entries":[{"id":"validation-score","question":"How does the validation score work?","aliases":["what is validation 100","red vs gold errors","validation rules"],"keywords":["validation","score","100","red","gold","errors","warnings"],"answer":"The validation score sits next to the menu button at the bottom of the screen. Points are assigned to specific chart elements; charts should reach 100 before completion. Click the score to see unresolved rules, and click a rule's arrow to jump straight to the field. RED items are errors and generally must be completed before the chart can be marked finished. GOLD items are warnings \u2014 consider them before finishing. If a single validation rule seems stuck or broken, include its error code in your Clinical Support ticket.","source_slides":[36]},{"id":"pertinent-negatives","question":"What are Pertinent Negatives and when do I use them?","aliases":["pn fields","pn icon","unknown information"],"keywords":["pertinent negative","pn","unknown","refused","not obtained"],"answer":"Pertinent Negatives (PN) let you complete documentation without entering FALSE or INCORRECT information, and they resolve validation rule items. Look for the PN icon next to a field; click it to see that field's PN options. Not every field has a PN option.","source_slides":[37,38]},{"id":"pn-names","question":"The patient won't give a name / I don't know the name. What do I enter?","aliases":["unknown patient name","trauma alias","john doe"],"keywords":["name","unknown","trauma alias","john doe","jane doe","pn"],"answer":"If the name is unknown or the patient refuses to provide it, use the PN fields for first and last name. If a trauma alias was assigned, use the alias as the patient name and put the suspected real name in the narrative. Note: PN use for names is state-dependent \u2014 some states require John/Jane Doe instead. For a field delivery of a newborn (or immediate transport of one) with no name available, document it as such.","source_slides":[39,40]},{"id":"pn-age","question":"I can't get the patient's age or DOB. Can I use a PN?","aliases":["unknown age","unknown dob","estimate age"],"keywords":["age","dob","date of birth","estimate","110"],"answer":"Usually no \u2014 numerous state NEMSIS 3.5 rules do not allow PN use for patient age. If you cannot obtain a definitive age or DOB, ESTIMATE the age. Certain NEMSIS 3.5 rules also prevent ages over 110.","source_slides":[41]}]},{"id":"demographics","title":"Demographics, ALS Assessment & Patient Engagement","entries":[{"id":"demo-requirements","question":"What demographics are required on every chart?","aliases":["required patient info","demographics checklist"],"keywords":["demographics","required","ssn","address","mrn","guardian"],"answer":"Collect: first name, middle initial (when applicable), last name; date of birth and gender; Social Security Number when able; street address including apartment/space number, city, state, ZIP; mobile phone, e-mail address, home phone; hospital MRN if at all possible (operation dependent); and if the patient is a minor, contact information for the parent/guardian. A complete record with accurate demographics is key to patient advocacy throughout the patient's GMR experience.","source_slides":[42,89]},{"id":"license-scan","question":"How does the driver's license scan work?","aliases":["scan id","dl scan","license barcode"],"keywords":["driver's license","scan","barcode","general info"],"answer":"The scan button is in the General Info panel of the Patient Demographics section. Click it, a camera preview window opens, and you scan the barcode on the license \u2014 the license data imports directly into the chart. This prevents typos and helps link the chart to hospital records for outcomes and follow-up.","source_slides":[43]},{"id":"als-assessment","question":"How do I answer the ALS assessment question?","aliases":["was there an als provider on scene","als question"],"keywords":["als assessment","paramedic","advanced provider","patient contact"],"answer":"When Unit Disposition equals 'Patient Contact Made,' crews must answer: 'Was there an ALS (paramedic or advanced) provider on scene that made patient contact?' Make ONE selection. The question is about the ENTIRE crew, not just the chart author. Read the options in order, left to right \u2014 if your crew fits a 'Yes' criterion, select it.","source_slides":[44]},{"id":"digital-engagement","question":"Why do I need to collect phone numbers, email, and insurance?","aliases":["digital patient engagement","why collect email","billing info collection"],"keywords":["digital patient engagement","phone","email","insurance","guarantor","billing"],"answer":"Collect mailing address, phone number, e-mail, guarantor, and insurance information (health, auto, workers' comp) on every chart \u2014 this drives the Digital Patient Engagement Initiative. It replaces paper statements and phone-tag with text/e-mail engagement: easier account and payment navigation, mobile payments, interest-free payment plan options, real-time GMR support, fewer collections referrals, and less paper. When patients don't engage, accounts end up with third-party collections \u2014 bad for patients and for GMR. Collect phone numbers and e-mail addresses!","source_slides":[45,46]}]},{"id":"times","title":"Times & Mileage","entries":[{"id":"times-mileage","question":"Which times and mileage come from CAD, and what do I enter manually?","aliases":["enter mileage","patient contact time","times page"],"keywords":["times","mileage","cad","tenth of a mile","patient contact"],"answer":"Most times \u2014 and mileage \u2014 flow from the CAD when it's linked. Mileage must be tracked from Scene to Hospital to the TENTH of a mile. Patient times (time of patient contact and patient movement) must be entered manually.","source_slides":[48]}]},{"id":"dispositions","title":"Dispositions","entries":[{"id":"dispo-overview","question":"What are the four disposition fields?","aliases":["disposition fields","nemsis dispositions"],"keywords":["disposition","unit disposition","patient evaluation","crew disposition","transport disposition"],"answer":"NEMSIS 3.5 requires four disposition fields on every chart: Unit Disposition, Patient Evaluation/Care, Crew Disposition, and Transport Disposition. Your selections here determine the rest of the required elements in the chart, and earlier selections may hide or gray out later options. Patient Evaluation/Care includes two different refusal-type selections, plus 'Patient Support Services Provided' for standby use.","source_slides":[49,50,51,52,53]},{"id":"dispo-scenarios","question":"Which disposition combination do I use for my call type?","aliases":["cancelled call dispositions","refusal dispositions","standby disposition","no patient found disposition","specialty team disposition"],"keywords":["disposition","combination","cancelled","refusal","standby","no patient found","specialty team","other ambulance"],"answer":"Standard four-field combinations are defined for: Cancellation \u2013 No Patient Found; Cancelled Prior to Arrival/Enroute; Cancelled on Scene; Patient Refused Medical Aid (two variants \u2014 WITH patient assessment/vitals and WITHOUT); No Transport/Other Ambulance; Standby; and Specialty Team Transport. The exact value for each of the four fields per scenario is in the Reference Tables tab (Disposition Scenario Matrix), with matching slide images. Reminders: only one Transport Disposition option exists for patient refusals ('Patient Refused Transport'), and after selecting the proper Patient Evaluation/Care value, verify the matching Crew and Transport Dispositions so the Refusal Worksheet populates correctly.","images":["dispo_no_patient_found.jpg","dispo_cancelled_prior.jpg","dispo_cancelled_on_scene.jpg","dispo_refusal.jpg","dispo_no_transport_other_ambulance.jpg","dispo_standby.jpg","dispo_specialty_team.jpg"],"source_slides":[53,54,55,56,57,58,59,60,93]},{"id":"specialty-team","question":"What's required on a Specialty Team Transport chart?","aliases":["nicu transport chart","picu team","team transport documentation"],"keywords":["specialty team","nicu","picu","lifenet","critical care","required data"],"answer":"Specialty Team Transports (e.g., NICU, PICU, LifeNet airport transfers \u2014 NOT organ teams; an actual patient must exist) require: patient demographics; patient weight; patient race; medical history (meds & allergies); patient complaint; primary symptom; primary impression; exam (may document 'not done'); a full set of vitals including GCS; exposure/PPE data; billing info; CMS Level = Critical Care; and a brief narrative including the names of the specialty team members. The chart can be started either from your dispatch info or by the responding crew workflow shown on slide 61.","source_slides":[60,61]},{"id":"preset-values","question":"Is there a fast way to chart cancelled calls?","aliases":["preset values","quick cancelled chart"],"keywords":["preset","cancelled enroute","cancelled on scene","dispatch info"],"answer":"Yes. Preset Values speed documentation of Cancelled Enroute and Cancelled On Scene calls. They're on the Dispatch Info page in the Dispatch/Response menu. Select an option and the system displays the values it will add for you to confirm.","source_slides":[62,63]}]},{"id":"clinical","title":"Timeline, Power Tools & Clinical Documentation","entries":[{"id":"timeline","question":"What is the Timeline and why does it matter?","aliases":["edit power tool","timeline red entries"],"keywords":["timeline","chronological","edit","red","gold"],"answer":"The Timeline is a chronological view of everything on the call \u2014 times, Power Tools, signatures, and Worksheets. Any edit to a Power Tool or Situation MUST be made in the Timeline (click the right arrow on an entry to edit it). Each Power Tool use or completed Worksheet creates a new entry. Entries with validation errors show RED; warnings show GOLD. Review the Timeline before posting to confirm all times are correct.","source_slides":[64,65]},{"id":"power-tools","question":"How do Power Tools work? Can I document two IV attempts in one?","aliases":["iv attempts","one attempt per tool"],"keywords":["power tools","iv access","attempt","procedure"],"answer":"Power Tools are the focused entry point for clinical documentation \u2014 NEMSIS, state reporting, and Clinical QA data all come from them. Only ONE attempt per Power Tool: two IV attempts must be documented with two separate IV-Access Power Tools.","source_slides":[66]},{"id":"assessments","question":"How do I document assessments and reassessments?","aliases":["tag normals","tag not done","np tag","reassessment"],"keywords":["assessment","reassessment","tag normals","tag not done","np tag","exam"],"answer":"Use the Assessment Power Tool for physical exam findings, and complete a NEW Assessment Power Tool every time you reassess due to a change in condition. 'Tag Normals' or 'Tag Not Done' selects multiple anatomic sites/systems at once. NP Tag mode documents things you looked for but did not find (e.g., digits, extremities, heart sounds). A free-text box is available for extra detail.","source_slides":[67,68,69]},{"id":"situations","question":"What are Situations?","aliases":["situation tools"],"keywords":["situations","combined power tools"],"answer":"Situations combine multiple Power Tools so you can logically document through a routine procedure or situation in one flow. GMR's long-term direction is to primarily use Situations rather than individual Power Tools.","source_slides":[70]},{"id":"clinical-review","question":"What is the Clinical Review section?","aliases":["blood glucose questions","supplemental questions"],"keywords":["clinical review","supplemental","blood glucose","quality"],"answer":"The Clinical Review section holds supplemental questions used for clinical quality or data projects (e.g., blood glucose). Some run nationwide; many are restricted by geography, patient type, or other criteria \u2014 so you may not always see the same questions.","source_slides":[71]},{"id":"read-only","question":"Why can't I edit the Medications or Procedures tab?","aliases":["read only tab","can't edit medication"],"keywords":["read only","medications","procedures","edit","timeline"],"answer":"The Medications and Procedures tabs are read-only. Validation errors may redirect you there, but you must make the actual edit in the Timeline entry for that Power Tool.","source_slides":[72]},{"id":"clinical-doc-requirements","question":"What clinical documentation is required on every chart?","aliases":["narrative requirements","documentation standards"],"keywords":["clinical documentation","narrative","gcs","vitals","procedures","hospital to hospital"],"answer":"Every chart needs: a physical exam including mental status (GCS, LOC, etc.) and vital signs; whether an ALS assessment was performed and by whom; thorough documentation of procedures, medications, and supplies used on scene AND during transport; and a complete narrative capturing information not held in discrete fields (events leading up to the incident, bystander information, etc.). On a hospital-to-hospital transport, document what specific service was NOT available at the first hospital.","source_slides":[97]}]},{"id":"billing","title":"Billing, IFT & CMS","entries":[{"id":"ift-justification","question":"What goes in the interfacility transport justification box?","aliases":["ift text box","transfer justification"],"keywords":["interfacility","ift","justification","transfer","payer"],"answer":"The dropdowns for reason-for-transport and receiving-facility capabilities are typically NOT enough for payers to determine the patient went to the most appropriate facility. Use the free-text box in the transfer/transport tab to add specific justification \u2014 including, for hospital-to-hospital transports, exactly what service was unavailable at the sending facility.","source_slides":[73,97]},{"id":"cms-level","question":"How do I pick the CMS Level of Service?","aliases":["cms level","level of service"],"keywords":["cms","level of service","reasonable","necessary","billing status"],"answer":"CMS bases level of service on the care actually provided to the patient, and only if that care was reasonable and necessary. Select the level based on the definitions provided in the field. This field is NOT used to determine the patient's billing status.","source_slides":[74]},{"id":"insurance-info","question":"What insurance details should I capture?","aliases":["mva insurance","workers comp documentation"],"keywords":["insurance","policy","subscriber","mva","auto","workers comp","employer"],"answer":"When possible, add the insurance company name and policy or subscriber number. If the call is related to an MVA, document the auto insurance information. If it's related to Workers' Compensation, document the employer name and phone number.","source_slides":[75]}]},{"id":"worksheets","title":"Worksheets & Signatures","entries":[{"id":"worksheets-overview","question":"What are Worksheets for?","aliases":["signature worksheets","paper forms"],"keywords":["worksheets","signatures","aba","refusal","paper","electronic"],"answer":"Worksheets guide crews to the PROPER signature inside a chart, populating intuitively from your answers throughout the template. The most-used worksheets are the Ambulance Billing Authorization (ABA) and Patient Refusal. ImageTrend is designed to capture electronic signatures \u2014 paper forms should only be used during downtime or tablet failure.","source_slides":[76]},{"id":"aba-worksheet","question":"When does the ABA worksheet appear and who signs?","aliases":["ambulance billing authorization","aba required"],"keywords":["aba","billing tab","transport","signature"],"answer":"The ABA worksheet is under the Billing tab and only populates if the patient was TREATED AND TRANSPORTED. It is required for ALL transports. The correct signature type populates automatically based on the crew's answers, and the worksheet pops up on the right side of the screen.","source_slides":[80,81]},{"id":"aba-scenarios","question":"The patient can't sign the ABA. What are my options?","aliases":["patient unable to sign","no signature","who signs for patient","co-sign"],"keywords":["aba","unable to sign","authorized representative","co-sign","attestation","face sheet"],"answer":"Four scenarios, in order of preference: (1) Patient unable to sign but an AUTHORIZED REPRESENTATIVE is present \u2014 the representative signs. (2) Patient unable to sign and NO representative present \u2014 the ambulance crew and the receiving facility CO-SIGN. (3) Paper ABA used due to downtime or tablet failure \u2014 requires crew attestation. (4) No signature at all \u2014 requires a facility face sheet plus crew attestation; this should be VERY rare.","images":["aba_rep_present.jpg","aba_facility_cosign.jpg","aba_paper_attestation.jpg","aba_no_signature.jpg"],"source_slides":[82,83,84,85]},{"id":"refusal-worksheet","question":"How do I document a patient refusal?","aliases":["refusal signatures","ama documentation","witness signatures"],"keywords":["refusal","worksheet","witness","proxy","guardian","signature"],"answer":"When a refusal disposition is selected, the Refusal Worksheet populates. Complete ALL fields on the refusal form, capture the patient/proxy/guardian signature, and have BOTH crew members sign as witnesses. After selecting the proper Patient Evaluation/Care value, make sure the matching Crew and Transport Dispositions are selected. Remember the deck distinguishes refusals WITH assessment/vitals from refusals WITHOUT \u2014 chart the one that actually happened.","source_slides":[57,92,93,94,95,96]},{"id":"als-to-bls","question":"How does the ALS to BLS worksheet work?","aliases":["hand down transfer","als downgrade worksheet"],"keywords":["als to bls","hand down","transfer of care","worksheet"],"answer":"Activated in some systems to document a hand-down transfer of care from an ALS provider to a BLS provider. It is completed BY THE ALS PROVIDER inside the BLS crew's chart, and includes multiple yes/no checklist questions, a narrative section, and a name and signature portion.","source_slides":[90,91]},{"id":"pcs-mnc","question":"What about PCS and MNC forms?","aliases":["physician certification statement","medical necessity"],"keywords":["pcs","mnc","physician certification","medical necessity","trailing documents"],"answer":"PCS (Physician Certification Statement) and MNC (Medical Necessity) capture, along with Trailing Documents, are covered on source slides 86\u201388, which are screenshot-based. Follow your operation's current PCS/medical necessity process (42 CFR \u00a7410.40 applies to non-emergency transports).","source_slides":[86,87,88],"images":["pcs_mnc_1.jpg","pcs_mnc_2.jpg","trailing_documents.jpg"]},{"id":"missing-signature","question":"A crew member signed in their partner's place (or a signature is missing). What do I do?","aliases":["signed for my partner","wrong signature","missing signature","partner signature","signed in place of partner","crew signature","signature in wrong spot"],"keywords":["signature","missing","partner","crew","caregiver","addendum","form"],"answer":"Each crew member must sign for themselves \u2014 signing in your partner's place is one of the most common documentation errors, and Clinical Education will request an addendum for these \u201cmissing signatures.\u201d The Field Guide app has a built-in Caregiver Signature Form to capture the correct signatures.","steps":["Complete an addendum on the chart acknowledging the signature issue \u2014 see [[entry:addendum-how|how to complete an addendum]].","Open the [[url:index.html#forms|Caregiver Signature Form]] in the Field Guide app (Home \u2192 More \u2192 Caregiver Signature Form).","Enter the date of service and the case number, then have EACH crew member complete their own section: full name, certification level, and signature.","Tap \u201cSave as PDF.\u201d The signed form downloads to your device \u2014 attach it to the chart in Elite Web (Menu Panel \u2192 Attachments) or send it as directed by Clinical Education."]}]},{"id":"posting","title":"Posting & Finishing","entries":[{"id":"posting","question":"How does posting work?","aliases":["post chart","mark as finished","post early post often"],"keywords":["post","posting","finished","cloud","override","internet"],"answer":"Charts LIVE on the device they were written on until Posted to the ImageTrend cloud. You can post as many times as you want \u2014 you'll be prompted to override the existing data with your newer data. Once posted, the chart appears in Elite Web, where it can be edited and finished (but charts can't be created in Web). Posting requires an internet connection. When done, mark the incident as finished while posting. POST EARLY, POST OFTEN \u2014 post before closing the chart, after a signature is obtained, and after the CAD updates. This ensures the chart is visible in Web and a copy is retained.","source_slides":[98,107]},{"id":"verify-posted","question":"How do I confirm my chart actually posted and is finished?","aliases":["is my chart posted","cloud icon","green checkmark"],"keywords":["posted","verify","cloud icon","green circle","checkmark"],"answer":"On the tablet home page, look for the Cloud icon and the green circle with a checkmark. Not sure? Log in to Elite Web and search for the chart. A reminder also pops up when you return to the home screen with unposted charts on the device.","source_slides":[99,100]},{"id":"elite-web-use","question":"How do I find my posted charts in Elite Web?","aliases":["view existing ems","locked chart padlock","web inbox"],"keywords":["elite web","incidents tab","view existing ems","locked","padlock","inbox"],"answer":"In Elite Web, click the Incidents tab, then 'View Existing EMS.' Locked charts display a padlock and generally cannot be unlocked (contact Clinical Support for the narrow exception). Respond to CQI/documentation/billing messages via the Inbox.","source_slides":[102,103,104]},{"id":"addendum-how","question":"How do I complete an addendum on a posted chart?","aliases":["complete an addendum","addendum","add addendum","amend my chart","correct a posted chart","late entry","fix a posted chart"],"keywords":["addendum","posted","elite web","menu panel","amend","correction"],"answer":"Once a chart is posted, the original documentation is not rewritten \u2014 changes and late additions are made by addendum in Elite Web. The addendum becomes a permanent part of the record alongside the original.","steps":["Log in to Elite Web and click the Incidents tab, then \u201cView Existing EMS.\u201d","Search for the incident by response number, crew member, or unit, and open the chart.","Open the Menu Panel and select Addendums, then create a new addendum.","Document what is being added or corrected \u2014 and why \u2014 then save. The original entry remains; the addendum is appended to the record."]}]},{"id":"troubleshooting","title":"Troubleshooting & Support","entries":[{"id":"trouble-cant-post","question":"I can't post my chart. Why?","aliases":["post button not working","closed call rules"],"keywords":["can't post","closed call rules","validation","read only"],"answer":"You can't post because closed-call validation rules aren't satisfied. Click the validation score and complete the listed rules \u2014 clicking a rule generally takes you where you need to go. If a rule sends you to a read-only section (Medications/Procedures), make the edit in the Timeline instead. Once the closed-call rules are satisfied, post and keep working.","source_slides":[107]},{"id":"trouble-visibility","question":"A required field is hidden or has a value I can't see to fix. What do I do?","aliases":["hidden field","visibility rules","cancelled time stuck"],"keywords":["visibility rules","hidden","disposition","cancelled time"],"answer":"Visibility rules can hide fields that are either required-and-blank or completed inappropriately. Temporarily change the disposition to make the field visible, fix it, then change the disposition back. Example: a cancelled time hidden by visibility rules \u2014 change the disposition to cancelled, delete the time, then restore the correct disposition.","source_slides":[107]},{"id":"trouble-missing-chart","question":"I can't find my chart. Where is it?","aliases":["chart disappeared","lost chart","chart not in web"],"keywords":["can't find","missing chart","field incident cloud","wrong cad","search"],"answer":"Work through these in order: (1) Did you post it? If not, check the Field Incident Cloud. (2) Did you download an INCORRECT CAD? In Elite Web, search by the crew member who completed the chart, then replace the CAD with the correct data set. (3) Did you post WITHOUT any CAD? In Elite Web, search by unit number or crew member and REMOVE the date/time from the search criteria. (4) If the chart was never started, it won't exist in Field or Web, and the CAD data will show it was never downloaded.","source_slides":[107]},{"id":"missing-report","question":"Clinical Education says I have a missing report. How do I fix it?","aliases":["hunter asked me to fix a missing report","hunter","missing report","fix a missing report","response number has no pcr","missing pcr","no report for response number"],"keywords":["missing","report","pcr","response number","duplicate","wait and return","posted","final","finalized"],"answer":"A missing-report notice means the system shows a response number that should have a PCR, but no PCR has been received for it. It is almost always one of three things \u2014 work through them in order.","steps":["Wrong or duplicate run number: the report may have been completed under a different response number \u2014 frequently a duplicate chart, especially on wait-and-return calls. In Elite Web, search by crew member or unit to find the chart and confirm which response number it was completed under. If the report was written under the wrong response number, an addendum is required indicating what the correct run number should be \u2014 see [[entry:addendum-how|how to complete an addendum]].","Never posted: an unposted chart still lives on the computer that created it. Log in to Elite Field on the originating device, open the chart, and Post it.","Posted but not finalized: in Elite Web, search for the response number, open the incident, and check the box marking the report as final."]},{"id":"missing-facility","question":"The facility I need isn't in the facility list. What do I do?","aliases":["missing facility","facility not listed","add a facility","facility not in list","can't find facility","hospital not listed","destination not listed"],"keywords":["facility","list","clinical support","ticket","destination","add"],"answer":"Missing facilities are added through a Clinical Support ticket. The instructions are simple, but the ticket has to be exact.","steps":["Open a ticket with [[url:https://support-clinical.gmr.net|Clinical Support]] \u2014 the \u201cGMR - Clinical Support\u201d tile in Okta.","Request that the facility be added to the facility list.","Include the EXACT correct facility name and the full address."]},{"id":"kayako-support","question":"How do I get ImageTrend support or file a ticket?","aliases":["file a ticket","contact support","clinical informatics","clinical support portal","kayako"],"keywords":["clinical support","okta","ticket","support","clinical informatics","kayako"],"answer":"Support is provided internally by GMR Clinical Informatics. File a ticket through the Clinical Support portal (support-clinical.gmr.net) \u2014 open the 'GMR - Clinical Support' tile in Okta and click 'Submit a New Request'. The portal also has a searchable Knowledge Base/FAQ and shows your open and recently resolved tickets. (This portal replaces the former Kayako site.) Tickets are triaged like patients \u2014 the better the information you provide (unit, incident number, error codes, screenshots, what you already tried), the faster it resolves.","source_slides":[108,109]},{"id":"kayako-unlock","question":"My chart auto-locked. Can it be unlocked? What else can Clinical Support do?","aliases":["unlock chart","auto lock","336 hours","add facility","fix my name","kayako"],"keywords":["kayako","unlock","auto-lock","14 days","facility list","certification number","enhancement"],"answer":"Charts auto-lock after being left unfinished for 336 hours (14 days). Clinical Support can unlock an auto-locked chart ONLY if the validation score is at 100 and neither crew member has signed. Clinical Support can also: pull charts from the Field Incident Cloud; add response and incident numbers when none exist in CAD (CAD outage or Logis issues \u2014 you MUST also put those numbers in your narrative); correct name spelling or an incorrect certification number (in conjunction with GMR Connect, ImageTrend Licensure, or Ninth Brain); facilitate adding facilities to the facility lists; and facilitate product enhancement requests when possible.","source_slides":[110]}]}]};
var TOPIC_ICONS = {"basics": "i-doc", "devices": "i-lungs", "crew": "i-cap", "toolbar": "i-wrench", "incidents": "i-clipboard", "validation": "i-check-circle", "demographics": "i-edit", "times": "i-calendar", "dispositions": "i-key", "clinical": "i-heart", "billing": "i-doc", "worksheets": "i-edit", "posting": "i-download", "troubleshooting": "i-wrench"};
var ASSET_DIR = 'imagetrend-assets/';

function $(id){ return document.getElementById(id); }
function escHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function highlight(text, q){
  if(!q) return escHtml(text);
  var esc = escHtml(text);
  var toks = q.trim().split(/\s+/).filter(function(t){ return t.length >= 2; }).map(function(t){
    return escHtml(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  });
  if(!toks.length) return esc;
  return esc.replace(new RegExp('('+toks.join('|')+')', 'ig'), '<mark>$1</mark>');
}

var allEntries = [];
KB.topics.forEach(function(t){
  t.entries.forEach(function(e){ allEntries.push({ topic: t, entry: e }); });
});

// Inline links in KB text: [[entry:id|label]] jumps to another entry,
// [[url:href|label]] renders a normal link. Applied AFTER escaping.
function linkify(html){
  return html.replace(/\[\[(entry|url):([^\]|]+)\|([^\]]*)\]\]/g, function(_, kind, target, label){
    target = target.replace(/<\/?mark>/g, ''); // search highlighting must not break the target
    if(kind === 'entry') return '<span class="e-link" data-jump="'+target+'">'+label+'</span>';
    var ext = /^https?:/i.test(target);
    return '<a class="e-link" href="'+target+'"'+(ext?' target="_blank" rel="noopener"':'')+'>'+label+'</a>';
  });
}

function entryHtml(e, q, openIt){
  var h = '<div class="entry'+(openIt?' open':'')+'" data-entry="'+e.id+'">';
  h += '<div class="entry-hdr" data-toggle-entry="'+e.id+'">';
  h += '<div class="entry-q">'+highlight(e.question, q)+'</div>';
  h += '<div class="entry-chevron">&#x203A;</div></div>';
  h += '<div class="entry-body">';
  h += '<div class="entry-answer">'+linkify(highlight(e.answer, q))+'</div>';
  if(e.steps && e.steps.length){
    h += '<div class="entry-steps">';
    e.steps.forEach(function(s, i){
      h += '<div class="e-step"><div class="e-step-num">'+(i+1)+'</div><div class="e-step-text">'+linkify(escHtml(s))+'</div></div>';
    });
    h += '</div>';
  }
  if(e.warnings && e.warnings.length){
    e.warnings.forEach(function(w){
      h += '<div class="e-warn">&#9888; '+escHtml(w)+'</div>';
    });
  }
  if(e.images && e.images.length){
    h += '<div class="e-imgs">';
    e.images.forEach(function(img){
      h += '<img class="e-img" src="'+ASSET_DIR+img+'" data-lb="'+ASSET_DIR+img+'" loading="lazy" alt="'+escHtml(e.question)+'">';
    });
    h += '</div>';
  }
  if(e.source_slides && e.source_slides.length){
    h += '<div class="e-src">Training deck slide'+(e.source_slides.length>1?'s':'')+' '+e.source_slides.join(', ')+'</div>';
  }
  h += '</div></div>';
  return h;
}

function renderTopics(){
  var h = '';
  KB.topics.forEach(function(t){
    var ico = TOPIC_ICONS[t.id] || 'i-doc';
    h += '<div class="topic" data-topic="'+t.id+'">';
    h += '<div class="topic-hdr" data-toggle-topic="'+t.id+'">';
    h += '<div class="topic-ico"><svg class="icon" style="width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><use href="#'+ico+'"></use></svg></div>';
    h += '<div class="topic-title">'+escHtml(t.title)+'</div>';
    h += '<div class="topic-count">'+t.entries.length+'</div>';
    h += '<div class="topic-chevron">&#x203A;</div></div>';
    h += '<div class="topic-body">';
    t.entries.forEach(function(e){ h += entryHtml(e, '', false); });
    h += '</div></div>';
  });
  $('qaContent').innerHTML = h;
}

function scoreEntry(e, q){
  // every word in the query must match somewhere; words can be in
  // different fields ("standby number" still finds the standby entry)
  var tokens = q.toLowerCase().split(/\s+/).filter(function(t){ return t.length >= 2; });
  if(!tokens.length) return 0;
  var body = (e.answer + ' ' + (e.steps||[]).join(' ')).toLowerCase();
  var total = 0;
  for(var i=0;i<tokens.length;i++){
    var t = tokens[i], s = 0;
    if(e.question.toLowerCase().indexOf(t) !== -1) s += 10;
    (e.aliases||[]).forEach(function(a){ if(a.toLowerCase().indexOf(t) !== -1) s += 6; });
    (e.keywords||[]).forEach(function(k){ if(k.toLowerCase().indexOf(t) !== -1) s += 5; });
    if(body.indexOf(t) !== -1) s += 2;
    if(!s) return 0;
    total += s;
  }
  return total;
}

function renderSearch(q){
  var results = allEntries.map(function(x){
    return { entry: x.entry, topic: x.topic, score: scoreEntry(x.entry, q) };
  }).filter(function(r){ return r.score > 0; })
    .sort(function(a,b){ return b.score - a.score; });

  if(!results.length){
    $('qaContent').innerHTML = '<div class="empty-state">No matches for &ldquo;'+escHtml(q)+'&rdquo;.<br>Try different words, or browse topics below.</div>';
    return;
  }
  var h = '<div class="sec-lbl">'+results.length+' match'+(results.length===1?'':'es')+'</div><div style="padding:0 8px">';
  results.forEach(function(r){
    h += entryHtml(r.entry, q, true);
  });
  h += '</div>';
  $('qaContent').innerHTML = h;
}

function findEntry(id){
  for(var i=0;i<allEntries.length;i++){ if(allEntries[i].entry.id===id) return allEntries[i]; }
  return null;
}

function jumpToEntry(id){
  $('srch').value = '';
  $('sc').style.display = 'none';
  $('qaTop').style.display = '';
  renderTopics();
  var found = findEntry(id);
  if(!found) return;
  var topicEl = document.querySelector('.topic[data-topic="'+found.topic.id+'"]');
  if(topicEl) topicEl.classList.add('open');
  var entryEl = document.querySelector('.entry[data-entry="'+id+'"]');
  if(entryEl){
    entryEl.classList.add('open');
    setTimeout(function(){ entryEl.scrollIntoView({ behavior:'smooth', block:'start' }); }, 60);
  }
}

function renderQuickActions(){
  var h = '';
  (KB.quick_actions||[]).forEach(function(qa){
    h += '<div class="qa-chip" data-jump="'+qa.entry+'">'+escHtml(qa.label)+'</div>';
  });
  $('qaRow').innerHTML = h;
}

function renderRefTables(){
  var rt = KB.reference_tables || {};
  var h = '';

  if(rt.disposition_field_options){
    var fo = rt.disposition_field_options;
    h += '<div class="ref-block"><div class="ref-block-title">Disposition Field Options</div>';
    if(fo.note) h += '<div class="ref-block-note">'+escHtml(fo.note)+'</div>';
    [['unit_disposition','Unit Disposition'],['patient_evaluation_care','Patient Evaluation / Care'],
     ['crew_disposition','Crew Disposition'],['transport_disposition','Transport Disposition']].forEach(function(pair){
      if(!fo[pair[0]]) return;
      h += '<div class="optlist"><div class="optlist-h">'+pair[1]+'</div><ul>';
      fo[pair[0]].forEach(function(opt){ h += '<li>'+escHtml(opt)+'</li>'; });
      h += '</ul></div>';
    });
    h += '</div>';
  }

  if(rt.disposition_scenario_matrix){
    var sm = rt.disposition_scenario_matrix;
    h += '<div class="ref-block"><div class="ref-block-title">Disposition Scenario Matrix</div>';
    if(sm.note) h += '<div class="ref-block-note">'+escHtml(sm.note)+'</div>';
    (sm.scenarios||[]).forEach(function(s){
      h += '<div class="scen-card"><div class="scen-title">'+escHtml(s.scenario)+'</div>';
      [['unit_disposition','Unit Disposition'],['patient_evaluation_care','Patient Eval/Care'],
       ['crew_disposition','Crew Disposition'],['transport_disposition','Transport Disposition']].forEach(function(pair){
        if(!s[pair[0]]) return;
        h += '<div class="scen-row"><div class="scen-lbl">'+pair[1]+'</div><div class="scen-val">'+escHtml(s[pair[0]])+'</div></div>';
      });
      if(s.notes) h += '<div class="scen-note">'+escHtml(s.notes)+'</div>';
      if(s.image) h += '<img class="scen-img" src="'+ASSET_DIR+s.image+'" data-lb="'+ASSET_DIR+s.image+'" loading="lazy" alt="'+escHtml(s.scenario)+'">';
      h += '</div>';
    });
    h += '</div>';
  }

  if(rt.crew_disposition_definitions){
    var cd = rt.crew_disposition_definitions;
    h += '<div class="ref-block"><div class="ref-block-title">Crew Disposition Definitions</div>';
    if(cd.note) h += '<div class="ref-block-note">'+escHtml(cd.note)+'</div>';
    (cd.definitions||[]).forEach(function(d){
      h += '<div class="def-item"><div class="def-val">'+escHtml(d.value)+'</div><div class="def-text">'+escHtml(d.definition)+'</div></div>';
    });
    h += '</div>';
  }

  $('refContent').innerHTML = h;
}

document.addEventListener('click', function(ev){
  var chip = ev.target.closest('[data-jump]');
  if(chip){ jumpToEntry(chip.getAttribute('data-jump')); return; }

  var topicToggle = ev.target.closest('[data-toggle-topic]');
  if(topicToggle){
    topicToggle.closest('.topic').classList.toggle('open');
    return;
  }
  var entryToggle = ev.target.closest('[data-toggle-entry]');
  if(entryToggle){
    entryToggle.closest('.entry').classList.toggle('open');
    return;
  }
  var img = ev.target.closest('[data-lb]');
  if(img){
    $('lb-img').src = img.getAttribute('data-lb');
    $('lb').classList.add('on');
    return;
  }
  if(ev.target === $('lb') || ev.target === $('lb-close')){
    $('lb').classList.remove('on');
    $('lb-img').src = '';
    return;
  }
  var tabBtn = ev.target.closest('.tab-btn');
  if(tabBtn){
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('on'); });
    document.querySelectorAll('.pane').forEach(function(p){ p.classList.remove('on'); });
    tabBtn.classList.add('on');
    $('pane-'+tabBtn.getAttribute('data-tab')).classList.add('on');
    return;
  }
});

$('srch').addEventListener('input', function(){
  var q = this.value.trim();
  $('sc').style.display = q ? 'block' : 'none';
  $('qaTop').style.display = q.length >= 2 ? 'none' : '';
  if(q.length >= 2){ renderSearch(q); } else { renderTopics(); }
});
$('sc').addEventListener('click', function(){
  $('srch').value = '';
  $('sc').style.display = 'none';
  $('qaTop').style.display = '';
  renderTopics();
  $('srch').focus();
});

function init(){
  var meta = KB.meta || {};
  $('jaTitle').textContent = meta.title || 'ImageTrend Job Aid';
  $('jaSub').textContent = (meta.audience ? meta.audience + ' · ' : '') + (meta.source || '');
  renderQuickActions();
  renderTopics();
  renderRefTables();
  var support = (meta.support && meta.support.portal) ? meta.support.portal : null;
  var foot = escHtml(meta.disclaimer || '') ;
  if(support){
    foot += ' Support: <a href="https://'+escHtml(support)+'" target="_blank" rel="noopener">'+escHtml(support)+'</a>';
    if(meta.support.note) foot += ' &mdash; '+escHtml(meta.support.note);
  }
  $('footNote').innerHTML = foot;
}
init();
</script>
