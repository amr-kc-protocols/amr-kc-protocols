<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Kansas Class Builder · AMR KC Field Guide</title>
<!--
  Kansas Class Builder — AMR KC Field Guide (plain HTML/JS)
  ---------------------------------------------------------
  Self-contained tool. An instructor enters course details once; the values
  fan out across every page and the tool produces one print-ready PDF packet:
    1. Clinical Education Application Cover Sheet (your template, fields filled)
    2. Course Information Sheet (generated: objectives / agenda / credentials)
    3. Post Evaluation Form (your template, header filled)
    4. Attendance Roster (your template, header filled; student rows left blank)

  DROP-IN
  -------
  Put these next to this file in your repo:
    kansas-class-builder.html   (this file)
    pdf-lib.min.js              (vendored; loaded locally so it works offline)
    ce-templates/cover-sheet.pdf
    ce-templates/roster.pdf
    ce-templates/post-eval.pdf
  Then link to kansas-class-builder.html from your Tools section.
  If your folder layout differs, change TEMPLATE_BASE and the pdf-lib <script> src.
-->
<style>
:root{--amr-red:#E2231A;--amr-navy:#003595;--ink:#171b22;--muted:#5b6472;--line:#e4e8ef;--bg:#eaedf3;--card:#fff;--field:#f4f6fa;
  --radius:16px;--shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.06)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);
  background:linear-gradient(180deg,#eef1f6 0%,#e7ebf2 100%);background-attachment:fixed;min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
.ce-wrap{max-width:740px;margin:0 auto;padding:18px 16px 48px}
.ce-head{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:4px}
.ce-bar{width:6px;align-self:stretch;min-height:42px;border-radius:3px;background:linear-gradient(var(--amr-red),var(--amr-navy))}
.ce-head h1{font-size:22px;margin:0;letter-spacing:-.02em;font-weight:800}
.ce-head p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.ce-section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-top:16px;overflow:hidden;box-shadow:var(--shadow)}
.ce-sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fbfcfe,#f6f8fb)}
.ce-sectionhead h2{font-size:12.5px;margin:0;text-transform:uppercase;letter-spacing:.07em;color:var(--amr-navy);font-weight:800}
.ce-sectionbody{padding:16px;display:flex;flex-direction:column;gap:13px}
.ce-row{display:flex;gap:10px;flex-wrap:wrap}
.ce-row>*{flex:1 1 140px;min-width:0}
.ce-field{display:flex;flex-direction:column;gap:6px;min-width:0}
.ce-field>span{font-size:12px;color:#3f4754;font-weight:600}
.ce-field em{color:var(--amr-red);font-style:normal}
.ce-field input,.ce-agendarow input,.ce-listrow input,.ce-catcell input{
  width:100%;min-width:0;background:var(--field);border:1px solid var(--line);border-radius:11px;padding:12px 13px;font-size:15px;color:var(--ink);outline:none;font-family:inherit;
  transition:border-color .15s,box-shadow .15s,background .15s}
.ce-field input:focus,.ce-agendarow input:focus,.ce-listrow input:focus,.ce-catcell input:focus{background:#fff;border-color:var(--amr-navy);box-shadow:0 0 0 3px rgba(0,53,149,.13)}
input[type="date"],input[type="time"]{-webkit-appearance:none;appearance:none}
.ce-sub{margin:2px 0 -1px;font-size:12px;color:var(--muted);font-weight:600;line-height:1.45}
.ce-cat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ce-catcell{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--field);border:1px solid var(--line);border-radius:11px;padding:6px 8px 6px 12px}
.ce-catcell span{font-size:13px;color:#39414d;font-weight:500}
.ce-catcell input{width:60px;text-align:center;padding:8px;background:#fff}
.ce-warn{margin:0;font-size:12.5px;color:#8a5a00;background:#fff8ea;border:1px solid #ffe2a8;padding:9px 11px;border-radius:11px;line-height:1.45}
.ce-warn.hide{display:none}
.ce-chips{display:flex;flex-wrap:wrap;gap:6px}
.ce-chip{font-size:12px;background:#eef3fb;border:1px solid #d7e1f2;border-radius:999px;padding:5px 11px;color:var(--amr-navy);font-weight:600}
.ce-comp{display:flex;flex-direction:column;gap:14px}
.ce-comp.hide{display:none}
.ce-compgroup h4{margin:0 0 7px;font-size:11.5px;color:var(--amr-navy);text-transform:uppercase;letter-spacing:.05em;font-weight:800}
.ce-compgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:7px}
.ce-compitem{display:flex;align-items:center;gap:8px;background:var(--field);border:1px solid var(--line);border-radius:11px;padding:9px 11px;font-size:13px;cursor:pointer;transition:border-color .12s,background .12s}
.ce-compitem:hover{border-color:#c2cee2}
.ce-compitem.on{border-color:var(--amr-navy);background:#eaf1fc;font-weight:600}
.ce-compitem input{width:16px;height:16px;accent-color:var(--amr-navy);flex:0 0 auto}
.ce-listrow,.ce-agendarow{display:flex;align-items:center;gap:8px}
.ce-marker{flex:0 0 22px;text-align:center;font-size:13px;font-weight:700;color:var(--amr-navy)}
.ce-agendarow .ce-time{flex:0 0 104px}
.ce-agendarow .ce-topic{flex:1 1 auto}
.ce-x{flex:0 0 36px;height:36px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:18px;line-height:1;color:#8a92a0;cursor:pointer;transition:color .12s,border-color .12s}
.ce-x:hover{color:var(--amr-red);border-color:var(--amr-red)}
.ce-x-spacer{flex:0 0 36px}
.ce-ghost{background:#fff;border:1px solid var(--line);color:var(--amr-navy);font-weight:600;font-size:13px;border-radius:10px;padding:8px 13px;cursor:pointer;font-family:inherit;transition:border-color .12s,background .12s}
.ce-ghost:hover{border-color:var(--amr-navy);background:#f4f8ff}
.ce-error{margin:16px 2px 0;color:#b00020;font-size:13.5px;font-weight:600}
.ce-error:empty{display:none}
.ce-invalid{border-color:var(--amr-red)!important;box-shadow:0 0 0 3px rgba(226,35,26,.14)!important;background:#fff6f6!important}
.ce-reset{margin-left:auto;align-self:center;background:#fff;border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:12px;border-radius:10px;padding:7px 12px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:color .12s,border-color .12s}
.ce-reset:hover{border-color:var(--amr-red);color:var(--amr-red)}
.ce-paste{width:100%;min-height:88px;background:var(--field);border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:14px;font-family:inherit;color:var(--ink);outline:none;resize:vertical}
.ce-paste:focus{background:#fff;border-color:var(--amr-navy);box-shadow:0 0 0 3px rgba(0,53,149,.13)}
.ce-warn .ce-ghost{margin-left:4px}
.ce-saved{font-size:11px;color:#9aa2b1;font-weight:700;align-self:center;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.ce-presets{display:flex;flex-wrap:wrap;gap:8px}
.ce-preset{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff;transition:border-color .12s,box-shadow .12s}
.ce-preset:hover{border-color:#c2cee2;box-shadow:0 2px 8px rgba(16,24,40,.06)}
.ce-presetload{background:transparent;border:none;color:var(--amr-navy);font-weight:600;font-size:13px;padding:9px 12px;cursor:pointer;font-family:inherit;text-align:left}
.ce-presetload:hover{background:#eef3fb}
.ce-preset .ce-x{flex:0 0 32px;height:auto;border:none;border-left:1px solid var(--line);border-radius:0;font-size:16px;background:#fff}
.ce-compsearch{width:100%;background:var(--field);border:1px solid var(--line);border-radius:11px;padding:10px 13px;font-size:14px;font-family:inherit;color:var(--ink);outline:none;margin-bottom:2px}
.ce-compsearch:focus{background:#fff;border-color:var(--amr-navy);box-shadow:0 0 0 3px rgba(0,53,149,.13)}
.ce-stu{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:8px;display:flex;flex-direction:column;gap:7px}
.ce-sturow{display:flex;align-items:center;gap:8px}
.ce-sturow>input{flex:1 1 0;min-width:0}
.ce-stusub>input{background:#fff}
.ce-stunar{flex:0 0 86px!important}
.ce-evalchip{font-size:12.5px;background:#eaf1fc;border:1px solid #d2e0f4;border-radius:11px;padding:9px 11px;color:var(--amr-navy);font-weight:600;line-height:1.4}
.ce-previewhead{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--amr-navy);font-weight:800;margin:18px 2px 8px}
.ce-preview{width:100%;height:540px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow)}
.ce-actions{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;padding:16px 0 14px;background:linear-gradient(transparent,#e9ecf2 30%)}
.ce-primary{flex:1;min-width:170px;text-align:center;text-decoration:none;background:linear-gradient(180deg,#ed3127,var(--amr-red));color:#fff;font-weight:800;font-size:16px;border:none;border-radius:13px;padding:16px;cursor:pointer;font-family:inherit;box-shadow:0 6px 18px rgba(226,35,26,.30);transition:transform .08s,box-shadow .12s}
.ce-primary:hover{box-shadow:0 8px 22px rgba(226,35,26,.36)}
.ce-primary:active{transform:translateY(1px)}
.ce-primary:disabled{opacity:.6;cursor:wait;box-shadow:none}
.ce-secondary{background:var(--amr-navy);color:#fff;font-weight:800;font-size:15px;border:none;border-radius:13px;padding:16px;cursor:pointer;font-family:inherit;box-shadow:0 6px 18px rgba(0,53,149,.24)}
.ce-done{margin:10px 2px 0;font-size:12.5px;color:var(--muted)}
.ce-done:empty{display:none}
@media (max-width:560px){.ce-cat{grid-template-columns:1fr 1fr}.ce-head h1{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  function updateHoursWarn(){

    sum=Math.round(sum*100)/100;
    var ch=parseFloat(D.courseHours);
    if(D.courseHours && sum && Math.abs(sum-ch)>0.001){
      warn.innerHTML="Category hours total "+sum+" but course hours are "+esc(D.courseHours)+". "+
        '<button class="ce-ghost" data-action="use-cat-total" data-sum="'+sum+'">Set course hours to '+sum+'</button>';

      setPath(ds.key, v);
      if(ds.key==="courseHours") updateHoursWarn();
      // Start/end pickers: keep the derived range string and auto-fill course hours when still blank.
      if(ds.key==="startTime"||ds.key==="endTime"){

  function chainTime(prevTime){ if(!prevTime) return ""; var end=String(prevTime).split(/\s*-\s*/)[1]||""; return end?(end+"-"):""; }
  function filterComp(q){ q=(q||"").trim().toLowerCase();

      var shown=0; Array.prototype.forEach.call(g.querySelectorAll(".ce-compitem"),function(it){ var vis=(!q||(it.getAttribute("data-complabel")||"").indexOf(q)>-1); it.style.display=vis?"":"none"; if(vis)shown++; });
      g.style.display=shown?"":"none";
    });
  }
  function toggleComp(label,on,inputEl){

    if(!on && idx>-1) D.competencies.splice(idx,1);
    var item=inputEl.closest(".ce-compitem"); if(item) item.classList.toggle("on",on);
    var btn=document.querySelector('[data-action="toggle-comp"]'); if(btn) btn.textContent= showComp?"Hide":(D.competencies.length?D.competencies.length+" selected":"Select");
  }

  /* ---------------- persistence ---------------- */
  function saveDraft(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(D)); var s=document.getElementById("ce-saved"); if(s){ s.textContent="Saved"; clearTimeout(saveDraft._t); saveDraft._t=setTimeout(function(){ if(s) s.textContent="Auto-saved"; },1200); } }catch(e){} }
  function loadDraft(){ try{ var raw=localStorage.getItem(STORAGE_KEY); if(!raw) return; var o=JSON.parse(raw); if(!o||typeof o!=="object") return;
      for(var k in D){ if(Object.prototype.hasOwnProperty.call(o,k) && o[k]!=null) D[k]=o[k]; }
      // keep required list/object shapes valid after restore
      if(!Array.isArray(D.objectives)||!D.objectives.length) D.objectives=[""];
      if(!Array.isArray(D.agenda)||!D.agenda.length) D.agenda=[{time:"",topic:""}];
      if(!Array.isArray(D.credentials)||!D.credentials.length) D.credentials=[""];
      // migrate students: older drafts stored plain name strings
      if(!Array.isArray(D.students)||!D.students.length) D.students=[emptyStudent()];
      else D.students=D.students.map(function(s){ if(s&&typeof s==="object"){ var e=emptyStudent(); for(var k in e) if(s[k]!=null) e[k]=s[k]; return e; } return Object.assign(emptyStudent(),{name:String(s||"")}); });
      if(!Array.isArray(D.competencies)) D.competencies=[];
      if(!D.catHours||typeof D.catHours!=="object") D.catHours={Airway:"",Cardiovascular:"",Trauma:"",Medical:"",Operations:"",Pediatric:"",LocalFlex:""};
      if(!String(D.evalCount||"").length) D.evalCount="1";
    }catch(e){} }
  function resetForm(){
    if(!confirm("Start a new course? This clears the current entries but keeps your name, email, and location.")) return;
    var keep={ instructor:D.instructor, instructorEmail:D.instructorEmail, location:D.location, otherInstructors:D.otherInstructors };
    D.title="";D.date="";D.startTime="";D.endTime="";D.startEnd="";D.courseHours="";D.lectureHours="";D.labHours="";
    D.catHours={Airway:"",Cardiovascular:"",Trauma:"",Medical:"",Operations:"",Pediatric:"",LocalFlex:""};
    D.competencies=[];D.localComp="";D.objectives=[""];D.agenda=[{time:"",topic:""}];D.credentials=[""];
    D.students=[emptyStudent()];D.timeIn="";D.timeOut="";D.hoursAwarded="";D.evalCount="1";D.evalSummary=null;
    D.instructor=keep.instructor;D.instructorEmail=keep.instructorEmail;D.location=keep.location;D.otherInstructors=keep.otherInstructors;
    if(result){ URL.revokeObjectURL(result.url); result=null; }
    showComp=false; showPaste=false; showEvalPaste=false; setError(""); saveDraft(); render();
  }

  /* ---------------- smart hours ---------------- */
  function parseClock(str){
    str=String(str).trim().toLowerCase(); if(!str) return null;
    var ap=null, m=str.match(/([ap])\.?m?\.?$/); if(m){ ap=m[1]; str=str.replace(/([ap])\.?m?\.?$/,"").trim(); }
    var h,min=0;
    if(/^\d{3,4}$/.test(str)){ var n=str.length===3?"0"+str:str; h=parseInt(n.slice(0,2),10); min=parseInt(n.slice(2),10); }
    else if(/^\d{1,2}:\d{2}$/.test(str)){ var p=str.split(":"); h=parseInt(p[0],10); min=parseInt(p[1],10); }
    else if(/^\d{1,2}$/.test(str)){ h=parseInt(str,10); }
    else return null;
    if(ap==="p"&&h<12) h+=12; if(ap==="a"&&h===12) h=0;
    if(isNaN(h)||isNaN(min)||h>23||min>59) return null;
    return h*60+min;
  }
  function hoursFromRange(s){
    var parts=String(s||"").split(/\s*(?:-|–|—|to)\s*/i); if(parts.length<2) return null;
    var a=parseClock(parts[0]), b=parseClock(parts[1]); if(a==null||b==null) return null;
    var diff=b-a; if(diff<0) diff+=24*60; var hrs=diff/60;
    if(hrs<0.25||hrs>14) return null; return Math.round(hrs*100)/100;
  }

  /* ---------------- Excel / list paste ---------------- */
  function splitTable(text){ return String(text||"").replace(/\r/g,"").split("\n").filter(function(l){return l.trim().length;})
      .map(function(line){ return line.indexOf("\t")>-1 ? line.split("\t") : [line]; }); }
  var ROSTER_HEADER_MATCH=[
    ["email",/e-?mail/i],["phone",/phone|cell|mobile/i],
    ["dept",/op.?\/?\s*dept|operation|department|agency|service|station|\bunit\b/i],
    ["amr",/\bamr\b|employee/i],
    ["ksbems",/ksbems|kbems|attend[ae]nt|cert(ificate)?\s*#?|registry|nremt|licen[sc]e/i],
    ["name",/(student|print).*name|^name$|full ?name|last.*first|attendee/i]
  ];
  // When Forms has both an account column and the typed question, prefer the question column.
  var ROSTER_PREFER={ name:/(student|print).*name|attendee/i, email:/e-?mail\s*address/i };
  function looksLikeHeader(cells){ return cells.some(function(c){ return /[a-z]/i.test(c) && /name|e-?mail|phone|dept|operation|agency|amr|ksbems|kbems|attend|cert|registry/i.test(c); }); }
  // Build student objects from pasted text (Excel TSV with headers, or one name per line).
  function parseRoster(text){
    var rows=splitTable(text); if(!rows.length) return [];
    var header=rows[0], hasHeader=looksLikeHeader(header), map={};
    if(hasHeader){
      header.forEach(function(h,idx){ for(var k=0;k<ROSTER_HEADER_MATCH.length;k++){ if(map[ROSTER_HEADER_MATCH[k][0]]==null && ROSTER_HEADER_MATCH[k][1].test(h)){ map[ROSTER_HEADER_MATCH[k][0]]=idx; break; } } });
      header.forEach(function(h,idx){ for(var f in ROSTER_PREFER){ if(ROSTER_PREFER[f].test(h)) map[f]=idx; } }); // prefer explicit question columns
    }
    if(map.name==null) map.name=0; // fallback: first column is the name
    var data=hasHeader?rows.slice(1):rows;
    return data.map(function(cells){ var s=emptyStudent();
      ["name","email","phone","dept","amr","ksbems"].forEach(function(f){ if(map[f]!=null) s[f]=(cells[map[f]]||"").trim(); });
      return s; }).filter(function(s){ return s.name; });
  }
  function ingestRoster(text){
    var add=parseRoster(text); if(!add.length) return;
    var existing=D.students.filter(function(s){return stuName(s).trim();});
    D.students=existing.concat(add).slice(0,ROSTER_MAX_STUDENTS); if(!D.students.length) D.students=[emptyStudent()];
    var cnt=D.students.filter(function(s){return stuName(s).trim();}).length; if(cnt) D.evalCount=String(Math.min(50,cnt));
    showPaste=false; saveDraft(); render();
  }
  function applyPaste(){ var ta=document.getElementById("ce-paste"); if(ta) ingestRoster(ta.value); }

  // Parse Microsoft Forms results (Excel TSV) into a ratings/tallies/comments summary.
  var EVAL_META=/^(id|column\s*\d*|start ?time|completion ?time|e-?mail|name|class.*title|^title$|instructor|date|total ?points|points ?-|quiz ?feedback|feedback|last modified|submission ?(id|time)?)$/i;
  var EVAL_SCALE={ "poor":1,"very poor":1,"fair":2,"below average":2,"average":3,"satisfactory":3,"neutral":3,"good":4,"very good":4,"above average":4,"excellent":5,"outstanding":5 };
  var EVAL_YESNO=/^(yes|no|partially|partial|somewhat|maybe|n\/?a|not applicable)$/i;
  // Long Forms headers are "Group.Subitem" — show just the specific sub-item.
  function evalLabel(h){ var i=h.lastIndexOf("."); return (i>0 && i<h.length-1)? h.slice(i+1).trim() : h.trim(); }
  function parseEval(text){
    var rows=splitTable(text); if(rows.length<2) return null;
    var header=rows[0], data=rows.slice(1).filter(function(r){return r.join("").trim();}); if(!data.length) return null;
    var questions=[], tallies=[], comments=[];
    for(var c=0;c<header.length;c++){
      var raw=(header[c]||"").trim(); if(!raw || EVAL_META.test(raw)) continue;
      var label=evalLabel(raw), scores=[], yn={}, ynN=0, texts=[];
      for(var r=0;r<data.length;r++){ var v=(data[r][c]||"").trim(); if(!v) continue;
        var lo=v.toLowerCase();
        var m=v.match(/^([1-5])(?:\s|$|\.|-|:)/)||v.match(/^([1-5])$/);
        if(m){ scores.push(parseInt(m[1],10)); }
        else if(EVAL_SCALE[lo]!=null){ scores.push(EVAL_SCALE[lo]); }
        else if(EVAL_YESNO.test(lo)){ ynN++; yn[v]=(yn[v]||0)+1; }
        else { texts.push(v); }
      }
      var nonEmpty=scores.length+ynN+texts.length; if(!nonEmpty) continue;
      if(scores.length>=nonEmpty*0.6){ questions.push({label:label, avg:scores.reduce(function(a,b){return a+b;},0)/scores.length, n:scores.length}); }
      else if(ynN>=nonEmpty*0.6){ tallies.push({label:label, counts:yn, n:ynN}); }
      else if(texts.length){ comments.push({label:label, answers:texts}); }
    }
    if(!questions.length && !tallies.length && !comments.length) return null;
    return { count:data.length, questions:questions, tallies:tallies, comments:comments };
  }
  function ingestEval(text){ var sm=parseEval(text); if(!sm){ setError("Couldn’t read evaluation results — paste the Excel cells including the header row."); return; }
    D.evalSummary=sm; showEvalPaste=false; setError(""); saveDraft(); render(); }
  function applyEvalPaste(){ var ta=document.getElementById("ce-evalpaste"); if(ta) ingestEval(ta.value); }

  function setError(msg){ var el=document.getElementById("ce-error"); if(el) el.textContent=msg||""; }
  async function onGenerate(){
    setError("");
    Array.prototype.forEach.call(root.querySelectorAll(".ce-invalid"),function(el){ el.classList.remove("ce-invalid"); });
    var req=[["title","Course title"],["date","Date"],["startTime","Start time"],["endTime","End time"],["location","Location"],["instructor","Lead instructor"],["courseHours","Total course hours"]];
    var missing=req.filter(function(r){return !String(D[r[0]]).trim();});
    if(missing.length){
      var first=null;
      missing.forEach(function(r){ var el=root.querySelector('[data-key="'+r[0]+'"]'); if(el){ el.classList.add("ce-invalid"); if(!first) first=el; } });
      setError("Please fill the highlighted field"+(missing.length>1?"s":"")+": "+missing.map(function(r){return r[1];}).join(", ")+".");
      if(first){ first.scrollIntoView({behavior:"smooth",block:"center"}); try{ first.focus({preventScroll:true}); }catch(e){ first.focus(); } }
      return;
    }
    busy=true; renderActions();
    try{
      var packet=await generatePacket(D);
      var filename="CE_"+(D.date||"packet")+"_"+slug(D.title)+".pdf";
      result={ blob:packet.blob, url:URL.createObjectURL(packet.blob), filename:filename, pages:packet.pages };
    }catch(err){ setError(err.message||"Could not generate the packet."); }
    finally{ busy=false; renderActions(); }
  }
  async function onShare(){
    if(!result) return;
    var file=new File([result.blob],result.filename,{type:"application/pdf"});
    if(navigator.canShare && navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:D.title||"CE Packet"});}catch(e){} }
    else { var a=document.createElement("a"); a.href=result.url; a.download=result.filename; a.click(); }
  }

  if(!PDFLib){ root.innerHTML='<p style="padding:20px;color:#b00020">pdf-lib.min.js did not load. Make sure it sits next to this file.</p>'; return; }
  loadDraft();
  render();
})();
</script>
