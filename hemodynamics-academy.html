      { h:"2", t:"Timing and triggering", html:
        "<p>Because the benefit lives entirely in the timing, the pump needs to know exactly where it is in the cardiac cycle. It <strong>inflates at the dicrotic notch</strong> (aortic valve closure — the Module 2 landmark that marks the start of diastole) and <strong>deflates just before the systolic upstroke</strong>.</p>"+
        "<p>It finds those moments using a trigger: usually the ECG (inflating off the T wave region, deflating on the R wave) or the arterial pressure waveform itself. The balloon is filled with <strong>helium</strong> for a specific reason — helium is a very low-density gas, so it shuttles in and out fast enough to keep up with the heart, and if the balloon ever leaks, helium is absorbed quickly and harmlessly.</p>"
      },
      { h:"3", t:"Reading the augmented waveform", html:
        "<p>On the arterial trace, a correctly timed IABP rewrites the wave. You see a tall <em>augmentation</em> peak in diastole — often higher than the patient's own systolic — followed by a <em>lower</em> systolic peak on the next assisted beat and a <em>lower</em> end-diastolic pressure. Those three changes are the visual signature of the two benefits: the diastolic spike is augmentation; the reduced systolic and end-diastolic pressures are afterload reduction.</p>"+
        "<p>To evaluate timing, clinicians run the pump at 1:2 (assisting every other beat) so an assisted beat sits right next to an unassisted one for comparison.</p>"
      },
      { h:"4", t:"The four timing errors", html:
        "<p>Timing is like pushing a child on a swing: push at the right instant and you add energy; push at the wrong instant and you fight the motion. The four classic errors:</p>"+
        "<ul>"+
        "<li><strong>Early inflation</strong> — the balloon inflates before the aortic valve closes, driving against a still-ejecting ventricle and <em>increasing</em> afterload. Harmful.</li>"+
        "<li><strong>Late inflation</strong> — inflates well after the notch; you simply lose augmentation.</li>"+
        "<li><strong>Early deflation</strong> — deflates too soon; augmentation is lost and blood can flow backward into the deflating balloon.</li>"+
        "<li><strong>Late deflation</strong> — the balloon is still inflated when systole begins, so the ventricle ejects against a balloon and afterload <em>rises</em>. Harmful.</li>"+
        "</ul>"+
        "<p>The two that actively hurt (early inflation and late deflation) share a theme: the balloon is up when it should be down, fighting the ventricle instead of helping it.</p>"
      },
      { h:"5", t:"Indications and contraindications", html:
        "<p><strong>Indications</strong> include cardiogenic shock, the mechanical complications of MI (acute mitral regurgitation, ventricular septal rupture), refractory angina, and bridging to a definitive therapy.</p>"+
        "<p><strong>Contraindications</strong> flow directly from the physiology:</p>"+
        "<ul>"+
        "<li><strong>Aortic regurgitation</strong> — diastolic augmentation drives blood backward through the leaky valve, worsening the regurgitation. A hard contraindication.</li>"+
        "<li><strong>Aortic dissection or significant aneurysm</strong> — inflating a balloon in a compromised aorta risks rupture.</li>"+
        "<li><strong>Severe peripheral arterial disease</strong> — the large femoral sheath threatens the limb.</li>"+
        "</ul>"
      },
      { h:"6", t:"What the evidence actually shows", html:
        "<div class='evidence'><span class='etag'>Evidence check</span>"+
        "<p>The IABP-SHOCK II trial (2012) randomized patients with acute-MI cardiogenic shock to IABP or no IABP and found no reduction in 30-day mortality (about 40% in both arms), a result that held at long-term follow-up. On the strength of that trial, guidelines downgraded the routine use of IABP in infarct-related cardiogenic shock.</p>"+
        "<p>It has not vanished: the balloon pump still has a role in specific situations such as the mechanical complications of MI and as a bridge. But the era of reflexively placing one for cardiogenic shock is over.</p>"+
        "<div class='grade'>Quality: high (large RCT with long-term follow-up).</div></div>"
      },
      { h:"7", t:"Complications and transport", html:
        "<p>Respect these failure modes:</p>"+
        "<ul>"+
        "<li><strong>Limb ischemia</strong> — the most common complication, from the large femoral sheath. Check distal pulses and perfusion in that leg relentlessly.</li>"+
        "<li><strong>Balloon rupture</strong> — blood or brownish flecks in the helium line is an emergency: it means the balloon has failed, risking gas embolism and clot formation on the balloon. Stop the pump and get help immediately.</li>"+
        "<li><strong>Malposition</strong> — too high, it can occlude the left subclavian (check the left arm); too low, it can occlude the renal or mesenteric arteries (watch urine output).</li>"+
        "<li>Thrombocytopenia, aortic injury, and infection round out the list.</li>"+
        "</ul>"+
        "<div class='keybox'><span class='kt'>Transport</span> Keep the console powered and helium adequate, maintain the trigger and timing, watch the augmented waveform and the distal limb, and keep the head of the bed relatively low. Never let the balloon sit idle for more than about 30 minutes — a stationary balloon grows clot.</div>"
      }
    ],
    quiz: [
      { q:"The intra-aortic balloon pump inflates during ___ and deflates during ___.",
        opts:["Systole; diastole","Diastole; systole","Inspiration; expiration","The QRS; the T wave"], ans:1,
        expl:"Counterpulsation: inflate in diastole (augment coronary perfusion), deflate in systole (reduce afterload) — the opposite of the heart's own cycle." },
      { q:"The two hemodynamic benefits of the IABP are:",
        opts:["Diastolic augmentation and afterload reduction","Increased heart rate and contractility","Direct forward pumping and oxygenation","Preload increase and venoconstriction"], ans:0,
        expl:"Inflation augments diastolic/coronary perfusion; deflation unloads the ventricle by reducing afterload. It assists a beating heart rather than pumping itself." },
      { q:"Correct balloon inflation should be timed to occur at the:",
        opts:["Systolic upstroke","Dicrotic notch (aortic valve closure)","Peak of the R wave","End of diastole only"], ans:1,
        expl:"Inflation at the dicrotic notch marks the start of diastole — the right moment to augment. Deflation occurs just before the next systolic upstroke." },
      { q:"Late deflation of the balloon is harmful because it:",
        opts:["Has no effect","Leaves the balloon inflated into systole, increasing afterload","Reduces coronary perfusion only","Causes the balloon to rupture"], ans:1,
        expl:"If the balloon is still up when systole begins, the ventricle ejects against it and afterload rises — the opposite of the intended unloading." },
      { q:"The IABP is filled with helium primarily because helium:",
        opts:["Is heavier than air for stability","Is low-density, shuttles quickly, and is absorbed safely if it leaks","Improves oxygenation of the blood","Prevents balloon rupture"], ans:1,
        expl:"Helium's low density lets it move in and out fast enough to track the heart, and it is quickly absorbed if the balloon leaks." },
      { q:"Blood or brownish flecks appearing in the helium drive line indicate:",
        opts:["Normal operation","Balloon rupture — an emergency","A dead battery","Overdamping of the arterial line"], ans:1,
        expl:"That finding means the balloon has ruptured, risking gas embolism and clot. Stop the pump and get help immediately." },
      { q:"The most common complication of an IABP is:",
        opts:["Limb ischemia","Hyperkalemia","Pulmonary embolism","Cyanide toxicity"], ans:0,
        expl:"The large femoral sheath most often causes limb ischemia; distal pulses and perfusion must be checked frequently." },
      { q:"Which is a contraindication to IABP?",
        opts:["Cardiogenic shock","Significant aortic regurgitation","Refractory angina","Acute mitral regurgitation"], ans:1,
        expl:"Diastolic augmentation drives blood backward through an incompetent aortic valve, worsening regurgitation. Aortic dissection is also a contraindication." },
      { q:"IABP-SHOCK II showed that, in acute-MI cardiogenic shock, routine IABP:",
        opts:["Halved mortality","Did not reduce 30-day mortality","Increased survival only in women","Eliminated the need for revascularization"], ans:1,
        expl:"No mortality benefit was found (~40% in both arms), a result sustained long-term, leading guidelines to downgrade routine use in infarct-related cardiogenic shock." },
      { q:"A balloon positioned too LOW in the aorta risks occluding the:",
        opts:["Left subclavian artery","Renal/mesenteric arteries (watch urine output)","Carotid arteries","Pulmonary artery"], ans:1,
        expl:"Too low, the balloon can occlude the renal or mesenteric vessels — a drop in urine output is a warning. Too high, it can occlude the left subclavian." }

  {
    id: 6,
    available: true,
    title: "Impella",
    desc: "Axial-flow physiology, P-levels, the purge system, suction alarms, positioning, and transport considerations.",
    objective: "Explain how the Impella actively unloads the left ventricle, interpret P-levels and the placement signal, recognize suction and hemolysis, protect the purge system, and place the device in its current evidence context.",
    content: [
      { h:"1", t:"A screw pump across the valve", html:
        "<p>Where the balloon pump only assists, the Impella actively <em>pumps</em>. It is a tiny micro-axial flow pump — think of an Archimedes screw — mounted on a catheter that sits across the aortic valve. Its inlet sits inside the left ventricle and its outlet in the ascending aorta, so it continuously draws blood out of the ventricle and expels it into the aorta.</p>"+
        "<p>That does two things at once: it directly <strong>unloads the left ventricle</strong> (pulling volume and pressure out of a struggling chamber, reducing its work and oxygen demand) and it <strong>adds forward flow</strong> to the circulation. Unlike the IABP, its benefit does not depend on precise beat-to-beat timing — it simply runs.</p>"
      },
      { h:"2", t:"P-levels: the throttle", html:
        "<p>Pump output is set by the <strong>P-level</strong> — the throttle, running from P0 (off) up to the maximum (P8 or P9 depending on the device). Higher P-level, more flow. The console that runs it is the Automated Impella Controller, which continuously displays flow, the placement signal, and the motor current.</p>"+
        "<p>Weaning is done by stepping the P-level down and watching whether the patient's own heart can take back the load.</p>"
      },
      { h:"3", t:"Position is everything", html:
        "<p>The whole device depends on the inlet being in the right place — roughly 3.5 cm below the aortic valve, well inside the ventricle, with the outlet above the valve. Two console readouts confirm it:</p>"+
        "<ul>"+
        "<li>The <strong>placement signal</strong> — a pressure waveform that should look <em>aortic</em> (from the outlet). If it starts reading like a <em>ventricular</em> tracing, the device has migrated.</li>"+
        "<li>The <strong>motor current</strong> — normally pulsatile when the device spans the valve correctly; it flattens when position is wrong.</li>"+
        "</ul>"+
        "<p>Migration is the root of most Impella alarms: pulled too far into the aorta, output falls; pushed too deep into the ventricle, it causes suction.</p>"
      },
      { h:"4", t:"Suction events", html:
        "<p>A suction alarm is the device telling you it is trying to pull more blood than is available — like a straw hitting the bottom of an empty cup. The inlet is either against the ventricular wall or the ventricle is underfilled.</p>"+
        "<div class='keybox'><span class='kt'>Think RV and volume</span> The classic causes of suction are hypovolemia and right-ventricular failure — if the right heart cannot deliver blood to the left ventricle, the Impella starves. Respond by lowering the P-level, giving volume, and hunting for the reason the LV is empty (including an RV that cannot keep up now that the LV is unloaded).</div>"
      },
      { h:"5", t:"The purge system: the moat", html:
        "<p>Spinning at high speed, the motor needs to keep blood out of its bearings, so a continuous <strong>purge fluid</strong> (a dextrose solution, often with heparin) flows outward through the motor — a moat that holds blood back. The console monitors purge pressure; a change can signal thrombus forming or a system problem.</p>"+
        "<div class='keybox'><span class='kt'>Never</span> Never stop the purge. Losing it lets blood into the motor and destroys the pump.</div>"
      },
      { h:"6", t:"Complications", html:
        "<ul>"+
        "<li><strong>Hemolysis</strong> — the high-speed rotor can shear red cells (the blender effect), especially when malpositioned or suctioning. Watch for tea-colored urine and rising plasma-free hemoglobin and LDH.</li>"+
        "<li><strong>Limb ischemia and bleeding</strong> — from the large-bore femoral access. Check the distal limb.</li>"+
        "<li><strong>Migration</strong> and aortic valve injury.</li>"+
        "<li><strong>Unmasked right-ventricular failure</strong> — once the LV is unloaded, an inadequate RV becomes the new bottleneck.</li>"+
        "</ul>"
      },
      { h:"7", t:"What the evidence shows", html:
        "<div class='evidence'><span class='etag'>Evidence check</span>"+
        "<p>DanGer Shock (2024) is a landmark: it was the first randomized trial of any mechanical support device to show a survival benefit in acute-MI cardiogenic shock. In carefully selected STEMI shock patients, the Impella CP reduced 180-day mortality (45.8% vs 58.5%; hazard ratio 0.74; number needed to treat about 8), and long-term follow-up sustained the benefit — leading to a guideline upgrade to class 2a.</p>"+
        "<p>Two honest caveats. First, the benefit came at a real cost: significantly more bleeding, vascular complications, renal-replacement therapy, and sepsis. Second, the trial was highly selective — it excluded comatose cardiac-arrest survivors, mechanical complications, and right-ventricular failure — so the result does not automatically generalize to every shock patient. Earlier, smaller trials (IMPRESS, ISAR-SHOCK) were neutral.</p>"+
        "<div class='grade'>Quality: high for selected STEMI shock (RCT plus durable follow-up); benefit is real but bounded by strict selection and a higher complication rate.</div></div>"
      },
      { h:"8", t:"Transport", html:
        "<div class='keybox'><span class='kt'>Transport</span> Keep the purge running and the anticoagulation going, monitor the placement signal and motor current for migration, watch for hemolysis (urine color) and distal limb perfusion, secure the catheter against any movement, and keep the console powered. A suction alarm on the road means: drop the P-level, consider volume, and reassess the RV.</div>"
      }
    ],
    quiz: [
      { q:"How does the Impella support the circulation?",
        opts:["It inflates and deflates in time with the cardiac cycle","It is a micro-axial pump across the aortic valve that actively draws blood from the LV into the aorta","It oxygenates blood outside the body","It paces the ventricle electrically"], ans:1,
        expl:"The Impella is an axial-flow pump spanning the aortic valve; it continuously unloads the LV and adds forward flow — actively pumping, unlike the IABP which only augments." },
      { q:"The Impella P-level represents:",
        opts:["The purge pressure","The pump speed/output setting (the throttle)","The patient's own cardiac output","The anticoagulation target"], ans:1,
        expl:"P-levels (P0 off to P8/P9 max) set pump output. Weaning steps the P-level down while watching whether the native heart can resume the load." },
      { q:"A suction alarm on the Impella most suggests:",
        opts:["The left ventricle is overfilled","An underfilled LV — hypovolemia, RV failure, or malposition","The purge pressure is too high","The aortic valve is stenotic"], ans:1,
        expl:"Suction means the device is pulling more than is available — a straw hitting an empty cup. Think hypovolemia or RV failure; lower the P-level and give volume." },
      { q:"The purpose of the Impella purge system is to:",
        opts:["Oxygenate the blood","Keep blood out of the motor bearings to prevent thrombus","Measure cardiac output","Deliver vasopressors"], ans:1,
        expl:"A continuous dextrose (± heparin) purge flows outward through the motor — a moat that keeps blood out of the bearings. Never stop it." },
      { q:"Tea-colored urine with a rising plasma-free hemoglobin and LDH in an Impella patient suggests:",
        opts:["Normal function","Hemolysis (often from malposition or suction)","Adequate anticoagulation","A dead battery"], ans:1,
        expl:"The high-speed rotor can shear red cells, especially when malpositioned or suctioning — the blender effect. Tea-colored urine is a red flag for hemolysis." },
      { q:"For correct Impella function, the inlet should sit:",
        opts:["In the right atrium","In the left ventricle, roughly 3.5 cm below the aortic valve, with the outlet in the aorta","In the pulmonary artery","Above the aortic arch"], ans:1,
        expl:"Inlet in the LV (~3.5 cm below the valve), outlet in the ascending aorta. Migration causes reduced output (pulled up) or suction (pushed deep)." },
      { q:"DanGer Shock (2024) was notable because it:",
        opts:["Showed IABP was superior to Impella","Was the first MCS device RCT to show a mortality benefit in AMI cardiogenic shock","Proved Impella had no complications","Studied VV-ECMO in ARDS"], ans:1,
        expl:"Impella CP reduced 180-day mortality in selected STEMI shock (45.8% vs 58.5%, HR 0.74), the first positive MCS device RCT in AMI-CS, prompting a class 2a upgrade." },
      { q:"An important caveat to the DanGer Shock result is that it:",
        opts:["Had no complications and applies to all shock patients","Came with more bleeding/vascular/renal complications and excluded comatose arrest, mechanical complications, and RV failure","Only enrolled patients over 90","Used the Impella as a bridge to transplant only"], ans:1,
        expl:"The benefit was real but bounded: significantly higher complications, and strict exclusions (comatose arrest, mechanical complications, RV failure) limit generalizability." },
      { q:"After the LV is unloaded by an Impella, which problem may become the new bottleneck?",
        opts:["Left atrial hypertrophy","Right-ventricular failure","Aortic stenosis","Pulmonary embolism"], ans:1,
        expl:"With the LV unloaded, an inadequate RV that cannot deliver blood forward becomes the limiting factor — and a common cause of suction." },
      { q:"Impella position is confirmed at the console by the:",
        opts:["Purge pressure alone","Placement signal waveform and the motor current","Heart rate","Sweep gas setting"], ans:1,
        expl:"The placement signal should read aortic (not ventricular) and the motor current should be pulsatile when the device correctly spans the valve." }
    ]
  },

  {
    id: 7,
    available: true,
    title: "ECMO",
    desc: "VA versus VV physiology, the circuit, Harlequin / oxygenator failure, and the transport team's role.",
    objective: "Distinguish VA from VV ECMO and what each replaces, trace the circuit and its two gas controls, recognize differential hypoxia and oxygenator failure, and understand the transport team's role around the circuit.",
    content: [
      { h:"1", t:"Borrowed organs", html:
        "<p>ECMO — extracorporeal membrane oxygenation — does outside the body what a failing heart or lungs cannot do inside it. Blood is drained from the patient, driven by a pump through an artificial lung, and returned. Everything about a given ECMO setup follows from one question: <em>where does the oxygenated blood come back?</em></p>"
      },
      { h:"2", t:"VA versus VV: the core distinction", html:
        "<ul>"+
        "<li><strong>VA (veno-arterial)</strong> — drains from a vein, returns to an <em>artery</em>. Because it puts blood back into the arterial system under pressure, it replaces <strong>both the heart and the lungs</strong>: flow bypasses the failing cardiopulmonary system entirely. This is the configuration for cardiogenic shock and cardiac arrest.</li>"+
        "<li><strong>VV (veno-venous)</strong> — drains from a vein, returns to a <em>vein</em>. The freshly oxygenated blood still has to be pumped by the patient's own heart through the lungs and out to the body, so it replaces <strong>only the lungs</strong>. It requires an adequate native cardiac output. This is the configuration for severe respiratory failure such as ARDS.</li>"+
        "</ul>"+
        "<div class='keybox'><span class='kt'>Anchor</span> VA replaces the whole cardiopulmonary engine. VV is a bolt-on artificial lung that still relies on the patient's own pump. If the heart is failing, VV alone will not save it.</div>"
      },
      { h:"3", t:"The circuit and its two dials", html:
        "<p>Follow the blood: a <strong>drainage cannula</strong> pulls venous blood to a <strong>centrifugal pump</strong>, which pushes it through the <strong>oxygenator</strong> (the membrane lung), and a <strong>return cannula</strong> sends it back. The oxygenator is where gas exchange happens, and it has two independent controls that map to the two blood gases:</p>"+
        "<ul>"+
        "<li><strong>Sweep gas</strong> — the flow of fresh gas across the membrane. It governs <em>CO2 removal</em>: turn up the sweep to blow off more CO2. It is the exhaust fan.</li>"+
        "<li><strong>FdO2</strong> — the oxygen fraction of that gas. It governs <em>oxygenation</em>.</li>"+
        "</ul>"+
        "<p>Pump speed (RPM) sets the blood flow, which is the other major lever on oxygen delivery.</p>"
      },
      { h:"4", t:"Harlequin (North–South) syndrome", html:
        "<p>This is the signature hazard of <em>peripheral</em> VA-ECMO, and it is worth understanding well. When blood is returned up the femoral artery, it flows <em>backward</em> up the aorta to meet the blood the heart is still ejecting forward. If the heart recovers some function but the lungs are still bad, the heart pumps <em>poorly oxygenated</em> blood that reaches the upper body first — the coronaries, the brain, the right arm — while the ECMO's well-oxygenated blood perfuses the lower body.</p>"+
        "<p>Picture two rivers of different color meeting somewhere in the aorta: a watershed where blue upper-body blood and red ECMO blood collide. The dangerous part is that the heart and brain can be sitting in the blue river.</p>"+
        "<div class='keybox'><span class='kt'>Monitor the right arm</span> Because the right radial artery is fed closest to the heart, a right-radial ABG or SpO2 is the early-warning sensor for differential hypoxia. Right-arm desaturation is the tell.</div>"
      },
      { h:"5", t:"Oxygenator failure and other complications", html:
        "<p>The oxygenator is a consumable that clots and fails over time. Signs it is failing: a rising CO2, a falling post-oxygenator PaO2, and visible clot or condensation in the membrane. Other major complications:</p>"+
        "<ul>"+
        "<li><strong>Bleeding</strong> — the circuit demands systemic anticoagulation; bleeding is the most common serious complication.</li>"+
        "<li><strong>Thrombosis</strong> anywhere in the circuit.</li>"+
        "<li><strong>Limb ischemia</strong> — the arterial cannula can choke off the leg; a distal perfusion cannula is often placed to save it.</li>"+
        "<li>Air entrainment, hemolysis, infection, and neurologic injury.</li>"+
        "</ul>"
      },
      { h:"6", t:"What the evidence shows", html:
        "<div class='evidence'><span class='etag'>Evidence check — VA-ECMO in infarct shock</span>"+
        "<p>ECLS-SHOCK (2023), together with ECMO-CS and a meta-analysis, found that routine early VA-ECMO in acute-MI cardiogenic shock did <em>not</em> reduce 30-day mortality (about 48% vs 49%) and increased complications such as bleeding and limb ischemia, with no benefit in any subgroup. This has pushed the field away from reflexive VA-ECMO toward selective, individualized use.</p>"+
        "<div class='grade'>Quality: high (RCT plus meta-analysis).</div></div>"+
        "<div class='evidence'><span class='etag'>Evidence check — VV-ECMO in ARDS</span>"+
        "<p>For severe ARDS the picture is more favorable but less clean. EOLIA (2018) compared VV-ECMO to conventional management; the mortality difference (35% vs 46%) did not reach statistical significance, partly because many control patients crossed over to ECMO as a rescue, and a later Bayesian re-analysis suggested a probable benefit. The earlier CESAR trial supported referral to an ECMO center. The reasonable read: VV-ECMO is a rescue therapy for refractory severe ARDS in experienced centers, not a routine first step.</p>"+
        "<div class='grade'>Quality: moderate (one major RCT with high crossover; supportive but not definitive).</div></div>"
      },
      { h:"7", t:"The transport team's role", html:
        "<p>On an ECMO transport, a trained ECMO specialist or perfusionist manages the circuit itself. The transport team's job is to manage the patient and to guard against the catastrophes — because with ECMO, the circuit <em>is</em> the patient's life.</p>"+
        "<div class='keybox'><span class='kt'>Guard the circuit</span> The lethal events are cannula dislodgement (massive hemorrhage and loss of support in seconds), power loss, running out of oxygen or sweep gas, and a clotting circuit. Secure every cannula and connection obsessively, confirm redundant power and gas, and never let a line move.</div>"
      }
    ],
    quiz: [
      { q:"VA-ECMO provides support for:",
        opts:["The lungs only","Both the heart and the lungs","The kidneys","The brain only"], ans:1,
        expl:"VA returns blood to an artery under pressure, bypassing the cardiopulmonary system — so it supports both heart and lungs. It is used for cardiogenic shock/arrest." },
      { q:"VV-ECMO differs from VA in that it:",
        opts:["Returns blood to a vein and supports only the lungs, requiring adequate native cardiac output","Supports both heart and lungs","Requires an arterial cannula","Is used only in cardiac arrest"], ans:0,
        expl:"VV returns oxygenated blood to a vein; the patient's own heart must still pump it. It supports the lungs only and needs adequate native cardiac output." },
      { q:"On the ECMO oxygenator, the SWEEP GAS primarily controls:",
        opts:["Oxygenation","CO2 removal","Blood flow rate","Anticoagulation"], ans:1,
        expl:"Sweep gas is the fresh-gas flow across the membrane and governs CO2 clearance — the exhaust fan. FdO2 governs oxygenation." },
      { q:"Oxygenation on ECMO is primarily governed by the FdO2 and by:",
        opts:["The sweep gas flow","The pump speed / blood flow","The anticoagulation level","The patient's temperature"], ans:1,
        expl:"Oxygen delivery depends on FdO2 (oxygen fraction) and on blood flow set by pump RPM. Sweep gas is the CO2 lever." },
      { q:"Harlequin (North–South) syndrome occurs in peripheral VA-ECMO when:",
        opts:["The oxygenator clots","A recovering heart ejects poorly oxygenated blood to the upper body while ECMO perfuses the lower body","The pump stops","The sweep gas is too high"], ans:1,
        expl:"Two circulations meet in the aorta; if the lungs are still failing, the heart's deoxygenated output reaches the upper body (coronaries, brain, right arm) — differential hypoxia." },
      { q:"To detect differential hypoxia early in peripheral VA-ECMO, monitor the:",
        opts:["Left femoral artery","Right radial artery (upper body, closest to the heart)","Dorsalis pedis","Central venous line"], ans:1,
        expl:"The right radial is fed closest to the heart and coronaries, so right-arm desaturation is the earliest warning of Harlequin syndrome." },
      { q:"Signs of ECMO oxygenator failure include:",
        opts:["Falling CO2 and rising post-oxygenator PaO2","Rising CO2, falling post-oxygenator PaO2, and visible clot","A slower heart rate only","Improved oxygenation"], ans:1,
        expl:"A failing membrane lung clears less CO2 and adds less oxygen; rising CO2, a dropping post-oxygenator PaO2, and visible clot/condensation are the tells." },
      { q:"ECLS-SHOCK (2023) found that routine early VA-ECMO in acute-MI cardiogenic shock:",
        opts:["Halved mortality","Did not reduce 30-day mortality and increased complications","Was beneficial only in diabetics","Eliminated the need for revascularization"], ans:1,
        expl:"No mortality reduction (~48% vs 49%), more complications, and no beneficial subgroup — shifting practice toward selective rather than routine use." },
      { q:"For severe ARDS, the EOLIA trial of VV-ECMO showed:",
        opts:["A clear, statistically significant mortality benefit","A mortality difference that was not statistically significant (with high crossover); ECMO is a rescue therapy for refractory cases","That ECMO was harmful in all patients","No difference and no crossover"], ans:1,
        expl:"EOLIA's mortality difference (35% vs 46%) missed significance amid high control crossover; a later Bayesian analysis suggested probable benefit. VV-ECMO is reserved for refractory severe ARDS in experienced centers." },
      { q:"During ECMO transport, the most catastrophic event to guard against is:",
        opts:["A brief dip in SpO2","Cannula dislodgement causing massive hemorrhage and loss of support","A high sweep gas setting","A single missed lab draw"], ans:1,
        expl:"With ECMO the circuit is the patient's life. Cannula dislodgement causes rapid exsanguination and loss of support; secure every line and connection." }
    ]
  },

  {
    id: 8,
    available: true,
    title: "LVAD",
    desc: "Continuous-flow physiology, Doppler MAP, controller and alarms, assessing perfusion, and the resuscitation algorithm.",
    objective: "Adapt assessment to continuous, non-pulsatile flow; obtain a Doppler MAP; interpret controller alarms; recognize the common LVAD complications; and apply the current perfusion-based resuscitation algorithm.",
    content: [
      { h:"1", t:"Continuous flow changes the rules", html:
        "<p>Modern left-ventricular assist devices are continuous-flow impeller pumps — a smooth fan, not a drum. They move blood in a steady stream rather than in beats, and that single fact overturns almost every reflex you have about assessing a patient.</p>"+
        "<div class='keybox'><span class='kt'>Reframe</span> Many LVAD patients have <em>no palpable pulse</em> and <em>no obtainable cuff blood pressure</em> — and that is completely normal. Absence of a pulse in an LVAD patient is not, by itself, cardiac arrest. Unlearning the pulse check is the whole game here.</div>"
      },
      { h:"2", t:"Assess perfusion, not pulse", html:
        "<p>If you cannot rely on a pulse, you assess perfusion directly: mentation, skin color and warmth, capillary refill, and the sound of the device. Auscultate the chest — a working pump produces a continuous <em>hum</em>. To get a pressure, use Doppler:</p>"+
        "<div class='formula'>Doppler over the brachial/radial artery + slowly deflate a cuff.<br>The first sound heard ≈ the <span class='fk'>MAP</span> (flow is continuous, so there is no separate systolic/diastolic).</div>"+
        "<p>A typical LVAD MAP goal is roughly 70–90 mmHg, set by the VAD team and device. Pulse oximetry may not read reliably because of the low pulsatility. The pump is a smooth fan; do not expect to feel a beat.</p>"
      },
      { h:"3", t:"The controller and power", html:
        "<p>The controller is the device's brain. It displays flow (L/min), speed (RPM), power (watts), and a pulsatility index, and it drives the pump from batteries or wall power. There are always two power sources for a reason.</p>"+
        "<div class='keybox'><span class='kt'>Bring everything</span> The patient and caregiver know this device better than you do. Bring ALL of it to the hospital — the backup controller, spare batteries, and chargers — and get the VAD coordinator's number off the equipment early. Never let the controller lose power.</div>"
      },
      { h:"4", t:"Reading the alarms", html:
        "<ul>"+
        "<li><strong>Low-flow alarm</strong> — the broad one. Causes include hypovolemia, right-ventricular failure, tamponade, hypertension (high afterload chokes flow), a suction event, or cannula obstruction.</li>"+
        "<li><strong>Power / electrical alarms</strong> — a connection or battery problem; check every connection.</li>"+
        "<li><strong>High-power alarm</strong> — can indicate pump thrombosis, especially alongside signs of hemolysis (dark urine) and worsening heart failure.</li>"+
        "</ul>"+
        "<p>Call the VAD coordinator early — the number is on the device, and they can interpret the specific alarm and history faster than anyone at the scene.</p>"
      },
      { h:"5", t:"Why hypertension is dangerous for an LVAD", html:
        "<p>These pumps are afterload-sensitive: high systemic pressure directly opposes pump output, reducing flow, and it raises the risk of stroke and bleeding. This is why LVAD patients are kept to a controlled MAP — a direct callback to Module 4. A hypertensive LVAD patient is not a minor issue; it can be the cause of a low-flow alarm.</p>"
      },
      { h:"6", t:"The complications LVAD patients present with", html:
        "<ul>"+
        "<li><strong>GI bleeding</strong> — the most common. Continuous, non-pulsatile flow promotes arteriovenous malformations and an acquired von Willebrand deficiency, so these patients bleed from the gut frequently.</li>"+
        "<li><strong>Driveline infection</strong> — the percutaneous lead is a chronic portal for infection.</li>"+
        "<li><strong>Pump thrombosis</strong> — dark urine (hemolysis), rising power, and heart failure.</li>"+
        "<li><strong>Stroke</strong> — ischemic or hemorrhagic; a leading cause of death.</li>"+
        "<li><strong>Right-ventricular failure and arrhythmias</strong> — strikingly, an LVAD patient can be in ventricular tachycardia or fibrillation and still be awake and perfusing, because the pump keeps moving blood regardless of the native rhythm.</li>"+
        "</ul>"
      },
      { h:"7", t:"The resuscitation algorithm", html:

        "<div class='grade'>Quality: low–moderate (expert consensus and case series; no RCT).</div></div>"
      },

        "<div class='keybox'><span class='kt'>Transport</span> Bring the backup controller, batteries, and chargers; keep the driveline secured; document the specific device type; involve the VAD coordinator in the destination decision, because not every hospital can support this patient. Their equipment and their VAD center are part of the patient.</div>"
      }
    ],
    quiz: [
      { q:"Why do many stable LVAD patients have no palpable pulse?",
        opts:["Their heart has stopped","The device provides continuous, non-pulsatile flow","They are always in cardiac arrest","The pulse is blocked by the driveline"], ans:1,
        expl:"Continuous-flow LVADs move blood as a steady stream rather than in beats, so a palpable pulse is often absent — and that is normal." },
      { q:"How is a blood pressure best obtained in a continuous-flow LVAD patient?",

      { q:"Why is hypertension particularly dangerous in an LVAD patient?",
        opts:["It has no effect on the pump","High afterload reduces pump flow and raises stroke/bleeding risk","It speeds the pump dangerously","It only affects the right ventricle"], ans:1,
        expl:"These pumps are afterload-sensitive: high systemic pressure opposes output (a cause of low-flow alarms) and increases stroke and bleeding risk — hence a controlled MAP target." },

        expl:"Lead with perfusion assessment and device troubleshooting (often with the VAD coordinator). Restarting a stopped pump may be the most effective intervention; compressions are reserved for genuine pump failure with no perfusion." }
    ]
  }

];

/* ============================================================================
   STATE
   ==========================================================================*/
var LS_KEY = "hemo_academy_v1";
var state = loadState();

function blankState(){
  var m = {};
  MODULES.forEach(function(mod){ m[mod.id] = { read:false, passed:false, best:0 }; });
  return { learnerName:"", modules:m, finalPassed:false, completedAt:null };
}
function loadState(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(!raw) return blankState();
    var s = JSON.parse(raw);
    var base = blankState();
    base.learnerName = s.learnerName || "";
    base.finalPassed = !!s.finalPassed;
    base.completedAt = s.completedAt || null;
    MODULES.forEach(function(mod){
      if(s.modules && s.modules[mod.id]) base.modules[mod.id] = {
        read:!!s.modules[mod.id].read, passed:!!s.modules[mod.id].passed, best:s.modules[mod.id].best||0 };
    });
    return base;
  }catch(e){ return blankState(); }
}
function saveState(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }

/* progression helpers */
function isUnlocked(modId){
  if(modId === 1) return true;
  return !!(state.modules[modId-1] && state.modules[modId-1].passed);
}
function allModulesPassed(){
  return MODULES.every(function(m){ return state.modules[m.id] && state.modules[m.id].passed; });
}
function passedCount(){
  return MODULES.filter(function(m){ return state.modules[m.id] && state.modules[m.id].passed; }).length;
}
function getModule(id){ for(var i=0;i<MODULES.length;i++){ if(MODULES[i].id===id) return MODULES[i]; } return null; }

/* ============================================================================
   WAVEFORM (header signature) — tile arterial beats into an SVG path
   ==========================================================================*/
function buildWave(){
  var beatW = 150, n = 9, baseY = 46, path = "M 0 "+baseY;
  for(var i=0;i<n;i++){
    var x = i*beatW;
    // baseline drift into upstroke, sharp systolic peak, dicrotic notch, runoff
    path += " L "+(x+18)+" "+baseY;
    path += " C "+(x+24)+" "+baseY+" "+(x+30)+" 8 "+(x+40)+" 8";      // steep systolic upstroke to peak
    path += " C "+(x+50)+" 8 "+(x+56)+" 24 "+(x+64)+" 27";            // decline
    path += " L "+(x+72)+" 30";                                        // toward notch
    path += " C "+(x+76)+" 33 "+(x+78)+" 20 "+(x+86)+" 20";           // dicrotic notch + wave
    path += " C "+(x+96)+" 20 "+(x+104)+" 36 "+(x+118)+" "+(baseY-3); // diastolic runoff
    path += " L "+(x+beatW)+" "+baseY;
  }
  document.getElementById("wavePath").setAttribute("d", path);
}
function certWavePath(){
  var beatW=55, n=4, baseY=18, path="M 0 "+baseY;
  for(var i=0;i<n;i++){ var x=i*beatW;
    path+=" L "+(x+8)+" "+baseY+" C "+(x+11)+" "+baseY+" "+(x+13)+" 3 "+(x+18)+" 3";
    path+=" C "+(x+22)+" 3 "+(x+25)+" 11 "+(x+29)+" 12 L "+(x+33)+" 13";
    path+=" C "+(x+35)+" 15 "+(x+36)+" 9 "+(x+40)+" 9 C "+(x+45)+" 9 "+(x+49)+" 16 "+(x+beatW)+" "+baseY;
  }
  return path;
}

/* ============================================================================
   VIEWS
   ==========================================================================*/
var views = ["home","reader","quiz","cert"];
function show(v){
  views.forEach(function(name){
    document.getElementById("view-"+name).classList.toggle("hidden", name!==v);
  });
  window.scrollTo(0,0);
}

function updateHeader(){
  var pc = passedCount(), pct = Math.round((pc/ (MODULES.length+1))*100);
  if(state.finalPassed) pct = 100;
  document.getElementById("tkMods").textContent = pc + " / " + MODULES.length;
  document.getElementById("tkPct").textContent = pct + "%";
  document.getElementById("progFill").style.width = pct + "%";
  var fin = document.getElementById("tkFinal");
  if(state.finalPassed){ fin.textContent="Complete"; fin.className="val grn"; }
  else if(allModulesPassed()){ fin.textContent="Ready"; fin.className="val grn"; }
  else { fin.textContent="Locked"; fin.className="val red"; }
  document.getElementById("statusChip").textContent =
    state.learnerName ? ("SESSION · "+state.learnerName.toUpperCase().slice(0,22)) : "SESSION · READY";
}

function renderHome(){
  updateHeader();
  var list = document.getElementById("modList");
  list.innerHTML = "";
  MODULES.forEach(function(mod){
    var st = state.modules[mod.id];
    var unlocked = isUnlocked(mod.id);
    var openable = unlocked && mod.available;
    var li = document.createElement("li");
    li.className = "modcard " + (st.passed ? "passed " : "") + (openable ? "open " : "locked ");
    var pill, go="";
    if(st.passed){ pill = "<span class='pill passed'>✓ Passed · "+st.best+"%</span>"; go="<span class='go'>Review ›</span>"; }
    else if(openable){ pill = "<span class='pill ready'>Ready</span>"; go="<span class='go'>Start ›</span>"; }
    else if(unlocked && !mod.available){ pill = "<span class='pill soon'>Content in development</span>"; }
    else { pill = "<span class='pill locked'>"+lockSvg()+"Locked</span>"; }
    li.innerHTML =
      "<div class='num'>"+pad2(mod.id)+"</div>"+
      "<div class='body'>"+
        "<div class='mtitle'>"+mod.title+"</div>"+
        "<p class='mdesc'>"+mod.desc+"</p>"+
        "<div class='foot'>"+pill+go+"</div>"+
      "</div>";
    if(openable) li.addEventListener("click", function(){ openReader(mod.id); });
    list.appendChild(li);
  });

  // final exam slot
  var slot = document.getElementById("finalSlot");
  var ready = allModulesPassed();
  slot.innerHTML =
    "<div class='modcard finalcard "+(ready?"open ready":"locked")+"' id='finalCard'>"+
      "<div class='num'>⚑</div>"+
      "<div class='body'>"+
        "<div class='mtitle'>Final Examination</div>"+
        "<p class='mdesc'>Comprehensive exam across all modules. Pass at "+PASS_FINAL+"% to earn your certificate.</p>"+
        "<div class='foot'>"+
          (state.finalPassed
            ? "<span class='pill passed'>✓ Passed</span><span class='go'>View certificate ›</span>"
            : ready ? "<span class='pill ready'>Unlocked</span><span class='go'>Begin ›</span>"
                    : "<span class='pill locked'>"+lockSvg()+"Complete all modules</span>")+
        "</div>"+
      "</div>"+
    "</div>";
  var fc = document.getElementById("finalCard");
  if(state.finalPassed) fc.addEventListener("click", function(){ renderCertificate(); show("cert"); });
  else if(ready) fc.addEventListener("click", startFinal);

  show("home");
}

/* ---- Reader ---- */
var currentModId = null, scrolledEnough = false;
function openReader(id){
  var mod = getModule(id);
  if(!mod || !mod.available) return;
  currentModId = id;
  document.getElementById("rdNum").textContent = "MODULE "+pad2(id);
  document.getElementById("rdTitle").textContent = mod.title;
  document.getElementById("rdObj").innerHTML = "<strong>Objective.</strong> "+mod.objective;
  var c = document.getElementById("rdContent"), html="";
  mod.content.forEach(function(sec){
    html += "<h3><span class='h3n'>"+sec.h+"</span>"+sec.t+"</h3>"+sec.html;
  });
  c.innerHTML = html;

  // gate the quiz button until the reader is scrolled through (honest "must read")
  var btn = document.getElementById("toQuizBtn");
  var note = document.getElementById("readNote");
  var alreadyRead = state.modules[id].read || state.modules[id].passed;
  scrolledEnough = alreadyRead;
  btn.disabled = !alreadyRead;
  note.textContent = alreadyRead ? "" : "Scroll through the full module to unlock the quiz.";
  show("reader");
}
function onReaderScroll(){
  if(scrolledEnough) return;
  var sec = document.getElementById("view-reader");
  if(sec.classList.contains("hidden")) return;
  var doc = document.documentElement;
  var reachedBottom = (window.innerHeight + window.scrollY) >= (doc.scrollHeight - 120);
  if(reachedBottom){
    scrolledEnough = true;
    if(currentModId){ state.modules[currentModId].read = true; saveState(); }
    document.getElementById("toQuizBtn").disabled = false;
    document.getElementById("readNote").textContent = "Module read — quiz unlocked.";
  }
}

/* ---- Quiz (modules) ---- */
var activeQuiz = null;     // {questions, isFinal, modId, answers[], submitted}
function startModuleQuiz(id){
  var mod = getModule(id);
  activeQuiz = { questions:mod.quiz, isFinal:false, modId:id, answers:new Array(mod.quiz.length).fill(-1), submitted:false, title:mod.title, num:"MODULE "+pad2(id) };
  renderQuiz();
}
var FINAL_PER_MODULE = 4;   // questions sampled from each module's bank for the final exam
function shuffled(arr){
  var a = arr.slice();
  for(var i=a.length-1; i>0; i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function startFinal(){
  var pool = [];
  MODULES.forEach(function(m){
    if(!m.quiz) return;
    pool = pool.concat(shuffled(m.quiz).slice(0, FINAL_PER_MODULE));
  });
  pool = shuffled(pool);
  activeQuiz = { questions:pool, isFinal:true, modId:null, answers:new Array(pool.length).fill(-1), submitted:false, title:"Final Examination", num:"FINAL EXAM" };
  renderQuiz();
}
function renderQuiz(){
  var q = activeQuiz;
  document.getElementById("qzNum").textContent = q.num;
  document.getElementById("qzTitle").textContent = q.submitted ? q.title+" — Results" : q.title;
  var need = q.isFinal ? PASS_FINAL : PASS_MODULE;
  document.getElementById("qzMeta").textContent =
    q.questions.length+" questions · pass at "+need+"% · "+Math.ceil(q.questions.length*need/100)+" correct needed";

  var form = document.getElementById("quizForm"); form.innerHTML="";
  q.questions.forEach(function(item, qi){
    var box = document.createElement("div"); box.className="q"+(q.submitted?" locked-opts":"");
    var opts = "";
    item.opts.forEach(function(o, oi){
      var cls="opt";
      if(q.submitted){
        if(oi===item.ans) cls+=" correct";
        else if(q.answers[qi]===oi) cls+=" wrong";
      } else if(q.answers[qi]===oi){ cls+=" sel"; }
      opts += "<button class='"+cls+"' data-q='"+qi+"' data-o='"+oi+"'>"+
                "<span class='ol'>"+String.fromCharCode(65+oi)+"</span>"+o+"</button>";
    });
    var expl = q.submitted ? "<div class='expl'><b>Why:</b> "+item.expl+"</div>" : "";
    box.innerHTML = "<div class='qnum'>Q"+(qi+1)+" / "+q.questions.length+"</div>"+
                    "<div class='qtext'>"+item.q+"</div>"+opts+expl;
    form.appendChild(box);
  });
  if(!q.submitted){
    form.querySelectorAll(".opt").forEach(function(b){
      b.addEventListener("click", function(){
        var qi=+b.dataset.q, oi=+b.dataset.o;
        activeQuiz.answers[qi]=oi;
        renderQuiz();
      });
    });
  }

  var actions = document.getElementById("quizActions");
  document.getElementById("resultSlot").innerHTML = "";
  if(!q.submitted){
    var answered = q.answers.filter(function(a){return a>=0;}).length;
    actions.innerHTML = "<button class='cta primary' id='submitQuiz'"+(answered<q.questions.length?" disabled":"")+">Submit answers</button>"+
      "<p class='readnote'>"+answered+" of "+q.questions.length+" answered</p>";
    var sb=document.getElementById("submitQuiz");
    if(sb) sb.addEventListener("click", submitQuiz);
  } else {
    var correct = scoreQuiz();
    var pct = Math.round(correct/q.questions.length*100);
    var passed = pct >= need;
    document.getElementById("resultSlot").innerHTML =
      "<div class='result "+(passed?"pass":"fail")+"'>"+
        "<div class='big'>"+pct+"%</div>"+
        "<div class='rmsg'>"+correct+" of "+q.questions.length+" correct · "+
        (passed? "Passed — "+ (q.isFinal?"course complete":"next module unlocked") : "Need "+need+"% to pass")+"</div>"+
      "</div>";
    if(passed){
      if(q.isFinal){
        actions.innerHTML = "<button class='cta teal' id='toCert'>View your certificate ›</button>";
        document.getElementById("toCert").addEventListener("click", function(){ renderCertificate(); show("cert"); });
      } else {
        actions.innerHTML = "<button class='cta teal' id='backHome'>Back to modules ›</button>";
        document.getElementById("backHome").addEventListener("click", function(){ renderHome(); });
      }
    } else {
      actions.innerHTML = "<button class='cta primary' id='retry'>Retake quiz</button>"+
                          "<button class='cta ghost' id='reread' style='margin-top:10px'>Re-read the module</button>";
      document.getElementById("retry").addEventListener("click", function(){
        if(q.isFinal) startFinal(); else startModuleQuiz(q.modId);
      });
      document.getElementById("reread").addEventListener("click", function(){
        if(q.isFinal){ renderHome(); } else { openReader(q.modId); }
      });
    }
  }
  show("quiz");
}
function scoreQuiz(){
  var c=0; activeQuiz.questions.forEach(function(item,i){ if(activeQuiz.answers[i]===item.ans) c++; }); return c;
}
function submitQuiz(){
  activeQuiz.submitted = true;
  var correct = scoreQuiz();
  var pct = Math.round(correct/activeQuiz.questions.length*100);
  var need = activeQuiz.isFinal ? PASS_FINAL : PASS_MODULE;
  var passed = pct >= need;
  if(activeQuiz.isFinal){
    if(passed){ state.finalPassed=true; state.completedAt = new Date().toISOString(); }
  } else {
    var m = state.modules[activeQuiz.modId];
    if(pct > m.best) m.best = pct;
    if(passed) m.passed = true;
  }
  saveState();
  updateHeader();
  renderQuiz();
}

/* ---- Certificate ---- */
function renderCertificate(){
  var name = (state.learnerName||"").trim() || "—";
  var dt = state.completedAt ? new Date(state.completedAt) : new Date();
  var dstr = dt.toLocaleDateString(undefined, { year:"numeric", month:"long", day:"numeric" });
  // final score
  var finalPct = "—";
  // (recompute best-effort: not stored separately; show Passed)
  document.getElementById("certCard").innerHTML =
    "<div class='c-brand'>AMR Kansas City <b>◆</b> Clinical Education</div>"+
    "<div class='c-wave'><svg viewBox='0 0 220 26' preserveAspectRatio='none'><path d='"+certWavePath()+"' fill='none' stroke='#1B63C4' stroke-width='1.6'/></svg></div>"+
    "<div class='c-kicker'>Certificate of Completion</div>"+
    "<div class='c-of'>This certifies that</div>"+
    "<div class='c-name'>"+escapeHtml(name)+"</div>"+
    "<div class='c-of'>has successfully completed</div>"+
    "<div class='c-course'>Hemodynamic Monitoring for Critical Care &amp; Interfacility Transport</div>"+
    "<div class='c-body'>An eight-module program covering hemodynamic physiology, arterial-line monitoring, vasoactive pharmacology, and mechanical circulatory support (IABP, Impella, ECMO, and LVAD), with a comprehensive final examination passed at "+PASS_FINAL+"% or above.</div>"+
    "<div class='c-meta'>"+
      "<div class='c-cell'><div class='cl'>Date completed</div><div class='cv'>"+dstr+"</div></div>"+
      "<div class='c-cell'><div class='cl'>Medical Director</div><div class='cv'>A. Deshmukh, MD</div></div>"+
      "<div class='c-cell'><div class='cl'>Clinical Education</div><div class='cv'>AMR KC</div></div>"+
    "</div>";
}

/* ============================================================================
   UTIL
   ==========================================================================*/
function pad2(n){ return (n<10?"0":"")+n; }
function lockSvg(){ return "<svg class='lockglyph' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.2'><rect x='4.5' y='10.5' width='15' height='10' rx='2'/><path d='M8 10.5V7a4 4 0 0 1 8 0v3.5'/></svg>"; }
function escapeHtml(s){ return s.replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }

/* ============================================================================
   WIRING
   ==========================================================================*/
document.getElementById("readerBack").addEventListener("click", renderHome);
document.getElementById("quizBack").addEventListener("click", function(){
  if(activeQuiz && !activeQuiz.isFinal && activeQuiz.modId) openReader(activeQuiz.modId);
  else renderHome();
});
document.getElementById("certBack").addEventListener("click", renderHome);
document.getElementById("toQuizBtn").addEventListener("click", function(){
  if(currentModId) startModuleQuiz(currentModId);
});
document.getElementById("printBtn").addEventListener("click", function(){ window.print(); });

var nameInput = document.getElementById("nameInput");
nameInput.value = state.learnerName || "";
nameInput.addEventListener("input", function(){
  state.learnerName = nameInput.value; saveState(); updateHeader();
});

document.getElementById("resetBtn").addEventListener("click", function(){
  if(confirm("Reset all progress and your name? This clears every module and the final exam on this device.")){
    state = blankState(); saveState(); nameInput.value=""; renderHome();
  }
});

window.addEventListener("scroll", onReaderScroll, { passive:true });

/* init */
buildWave();
renderHome();
</script>
