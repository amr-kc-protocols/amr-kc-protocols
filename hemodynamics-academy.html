<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AMR KC Academy">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-193.png">
<title>Hemodynamic Monitoring Academy &#x2014; AMR KC</title>
<!--
  Hemodynamic Monitoring for Critical Care Transport — AMR Kansas City
  ====================================================================
  Self-contained training academy. Plain HTML/CSS/JS, no external deps,
  works offline. Progress persists in localStorage.

  ARCHITECTURE
  - MODULES[] is the single source of truth. To add a module later, append
    an object with { available:true, content, quiz }. The lock/progression
    logic and UI pick it up automatically.
  - Progression: Module N unlocks when Module N-1's quiz is passed (>=80%).
    A module you can reach but whose content isn't built yet has
    available:false and shows a "content in development" state.
  - Final exam unlocks when every module quiz is passed. Pass = >=85%.
  - Certificate captures the learner name and prints clean via print CSS.

  STATE (localStorage key: hemo_academy_v1)
    { learnerName, modules:{ id:{read,passed,best} }, finalPassed, completedAt }
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap');
:root{
  --navy:#173A68;        /* brand dark — primary buttons, headings accent */
  --ink:#152238;          /* headings / body text */
  --ink-2:#66707C;        /* subtext */
  --blue:#1B63C4;         /* accent — links, labels, pills */
  --blue-dk:#154C8C;       /* deeper blue for inline emphasis */
  --blue-soft:#EAF1FD;    /* tinted surface */
  --blue-line:#BFD6F5;    /* tinted border */
  --paper:#FFFFFF;
  --card:#F4F6F9;          /* light tile */
  --card-2:#F1F4F8;
  --rule:#E2E6EC;
  --rule-2:#D3DAE3;
  --green:#15803D;         /* passed / correct */
  --green-soft:#EAFBF1;
  --green-line:#BFE3D0;
  --red:#DC2626;           /* wrong / fail (functional only) */
  --red-soft:#FDECEC;
  --red-line:#F3C6C6;
  --amber:#A1590B;
  --amber-soft:#FEF3E2;
  --amber-line:#E7C48A;
  --lock:#9AA5B1;
  --mono:'IBM Plex Sans', sans-serif;
  --sans:'IBM Plex Sans', -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --maxw: 760px;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wrap{ max-width:var(--maxw); margin:0 auto; padding:0 20px; }

/* ── Back to Field Guide ─────────────────────────────────────────── */
.backlink{
  display:inline-flex; align-items:center; gap:5px;
  font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--blue); text-decoration:none; opacity:.85; margin:14px 0 0;
}
.backlink:active{ opacity:.6; }

/* ── Header (field-guide light chrome) ──────────────────────────── */
header.mon{
  background:var(--paper);
  border-bottom:1px solid var(--rule);
  position:relative; overflow:hidden;
}
.mon-inner{ max-width:var(--maxw); margin:0 auto; padding:0 20px 2px; position:relative; z-index:2; }
.brandrow{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:14px; }
.brand{
  font-family:var(--sans); font-weight:800; letter-spacing:.11em;
  font-size:11px; color:var(--navy); text-transform:uppercase;
}
.brand b{ color:var(--blue); }
.status-chip{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.04em;
  color:var(--ink-2); border:1px solid var(--rule); background:var(--card-2);
  border-radius:999px; padding:4px 10px; white-space:nowrap;
}
h1.course{
  font-family:var(--sans); font-weight:800; letter-spacing:-.02em;
  font-size:27px; line-height:1.1; margin:12px 0 2px; color:var(--ink);
}
.course-sub{ font-family:var(--sans); font-size:13.5px; color:var(--ink-2); margin:0 0 12px; font-weight:500; }
.wave-strip{ height:56px; position:relative; margin:0 -20px; }
svg.wave{ display:block; width:100%; height:56px; }
.wave path.trace{
  fill:none; stroke:var(--blue); stroke-width:2.2;
  stroke-linejoin:round; stroke-linecap:round;
  filter:drop-shadow(0 0 3px rgba(27,99,196,.30));
}
@keyframes sweep{ to{ stroke-dashoffset:0; } }
.wave path.anim{ stroke-dasharray:2600; stroke-dashoffset:2600; animation:sweep 7s linear infinite; }
.ticker{
  display:flex; gap:22px; padding:6px 20px 12px; margin:0 -20px;
  font-family:var(--sans);
}
.tk{ display:flex; flex-direction:column; }
.tk .lab{ font-size:9.5px; letter-spacing:.12em; color:var(--lock); text-transform:uppercase; font-weight:700; }
.tk .val{ font-size:15px; color:var(--ink); font-weight:700; font-family:var(--mono); }
.tk .val.red{ color:var(--lock); }
.tk .val.grn{ color:var(--green); }
.progbar{ height:6px; background:var(--rule); overflow:hidden; margin:0 -20px 0; }
.progbar > i{ display:block; height:100%; width:0%; background:var(--blue); transition:width .5s ease; }

/* ── Home: module list ─────────────────────────────────────────── */
main{ padding:24px 0 60px; }
.eyebrow{
  font-family:var(--sans); font-weight:800; letter-spacing:.13em;
  font-size:11px; text-transform:uppercase; color:var(--blue); margin:0 0 14px;
}
.modlist{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px; }
.modcard{
  display:flex; gap:14px; align-items:stretch;
  background:var(--card); border:1px solid transparent; border-radius:16px;
  padding:15px 16px 15px 0; overflow:hidden; position:relative;
  transition:background .18s, box-shadow .18s, transform .06s;
}
.modcard .num{
  font-family:var(--mono); font-weight:700; font-size:14px;
  width:54px; min-width:54px; display:flex; align-items:center; justify-content:center;
  color:var(--lock); border-right:1px solid var(--rule-2);
}
.modcard .body{ flex:1; min-width:0; }
.modcard .mtitle{ font-family:var(--sans); font-weight:700; font-size:16.5px; letter-spacing:-.01em; color:var(--ink); margin:1px 0 3px; }
.modcard .mdesc{ font-family:var(--sans); font-size:13px; color:var(--ink-2); line-height:1.45; margin:0; }
.modcard .foot{ display:flex; align-items:center; gap:10px; margin-top:10px; }
.pill{ font-family:var(--sans); font-weight:600; font-size:11px; letter-spacing:.02em; padding:3px 9px; border-radius:999px; border:1px solid; }
.pill.locked{ color:var(--lock); border-color:var(--rule-2); background:var(--paper); }
.pill.ready{ color:var(--blue); border-color:var(--blue-line); background:var(--blue-soft); }
.pill.passed{ color:var(--green); border-color:var(--green-line); background:var(--green-soft); }
.pill.soon{ color:var(--amber); border-color:var(--amber-line); background:var(--amber-soft); }
.go{ margin-left:auto; font-family:var(--sans); font-weight:700; font-size:13.5px; color:var(--blue); }

.modcard.open{ cursor:pointer; background:var(--card); }
.modcard.open:hover{ box-shadow:0 6px 20px rgba(23,58,104,.08); }
.modcard.open:active{ transform:translateY(1px); }
.modcard.open .num{ color:var(--blue); }
.modcard.passed .num{ color:var(--green); }
.modcard.locked{ opacity:.78; }
.lockglyph{ width:13px; height:13px; vertical-align:-2px; margin-right:2px; }

.finalcard{ margin-top:20px; border:1.5px dashed var(--rule-2); background:var(--card-2); }
.finalcard.ready{ border:1.5px solid var(--blue); background:var(--blue-soft); }
.finalcard .num{ color:var(--blue); border-right-color:var(--rule-2); }

/* ── Reader view ───────────────────────────────────────────────── */
.back{ display:inline-flex; align-items:center; gap:6px; background:none; border:none;
  font-family:var(--sans); font-weight:600; font-size:14px; color:var(--blue); cursor:pointer; padding:6px 0; margin-bottom:6px; }
.rd-num{ font-family:var(--mono); font-size:12px; letter-spacing:.08em; color:var(--blue); font-weight:700; }
h2.rd-title{ font-family:var(--sans); font-weight:800; letter-spacing:-.02em; font-size:25px; line-height:1.14; margin:4px 0 4px; color:var(--ink); }
.rd-obj{ font-family:var(--sans); font-size:13.5px; color:var(--ink-2); border-left:3px solid var(--blue); padding:8px 0 8px 13px; margin:14px 0 22px; background:linear-gradient(90deg,var(--blue-soft),transparent); border-radius:0 8px 8px 0; }
.content h3{ font-family:var(--sans); font-weight:800; font-size:17px; letter-spacing:-.01em; color:var(--ink); margin:30px 0 8px; }
.content h3 .h3n{ font-family:var(--mono); color:var(--blue); font-weight:700; font-size:13px; margin-right:9px; }
.content p{ margin:12px 0; font-size:15px; }
.content ul{ margin:12px 0; padding-left:22px; }
.content li{ margin:6px 0; font-size:15px; }
.content strong{ color:var(--ink); font-weight:700; }
.content em{ color:var(--blue-dk); font-style:normal; font-weight:600; }
.formula{
  font-family:var(--mono); font-size:14px; line-height:1.7; color:var(--navy);
  background:var(--blue-soft); border:1px solid var(--blue-line); border-left:4px solid var(--blue);
  border-radius:10px; padding:12px 14px; margin:16px 0; overflow-x:auto;
}
.formula .fk{ color:var(--blue-dk); font-weight:700; }
.evidence{
  border:1px solid var(--rule); border-left:4px solid var(--blue);
  background:var(--card-2); border-radius:10px; padding:13px 15px; margin:18px 0;
}
.evidence .etag{ font-family:var(--sans); font-weight:800; font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:#fff; background:var(--blue); display:inline-block; padding:3px 9px; border-radius:999px; margin-bottom:8px; }
.evidence p{ margin:6px 0 0; font-size:14.5px; }
.evidence .grade{ font-family:var(--mono); font-size:11px; color:var(--ink-2); margin-top:9px; padding-top:8px; border-top:1px solid var(--rule); }
.keybox{ background:var(--green-soft); border:1px solid var(--green-line); border-radius:10px; padding:13px 15px; margin:18px 0; }
.keybox .kt{ font-family:var(--sans); font-weight:800; font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--green); display:block; margin-bottom:5px; }

.cta{ display:block; width:100%; text-align:center; border:none; border-radius:13px; cursor:pointer;
  font-family:var(--sans); font-weight:700; font-size:15.5px; letter-spacing:0; padding:15px; }
.cta.primary{ background:var(--navy); color:#fff; box-shadow:0 4px 14px rgba(23,58,104,.26); }
.cta.primary:active{ background:var(--ink); }
.cta.teal{ background:var(--blue); color:#fff; box-shadow:0 4px 14px rgba(27,99,196,.22); }
.cta.teal:active{ background:#144A93; }
.cta.ghost{ background:var(--paper); color:var(--ink); border:1.5px solid var(--rule-2); box-shadow:none; }
.cta[disabled]{ opacity:.45; cursor:not-allowed; box-shadow:none; }
.cta-wrap{ margin:28px 0 4px; }
.readnote{ font-family:var(--sans); font-size:12.5px; color:var(--ink-2); text-align:center; margin:9px 0 0; }

/* ── Quiz view ─────────────────────────────────────────────────── */
.qmeta{ font-family:var(--mono); font-size:11.5px; letter-spacing:.03em; color:var(--ink-2); margin:2px 0 18px; }
.q{ background:var(--card); border:1px solid transparent; border-radius:16px; padding:16px 17px; margin:0 0 14px; }
.q .qnum{ font-family:var(--mono); font-size:11px; color:var(--blue); font-weight:700; letter-spacing:.05em; }
.q .qtext{ font-family:var(--sans); font-weight:600; font-size:15.5px; line-height:1.42; margin:6px 0 12px; color:var(--ink); }
.opt{ display:block; width:100%; text-align:left; font-family:var(--sans); font-size:14.5px; line-height:1.4;
  background:var(--paper); border:1.5px solid var(--rule); border-radius:11px; padding:12px 14px; margin:8px 0; cursor:pointer; color:var(--ink); transition:border-color .12s, background .12s; }
.opt:hover{ border-color:var(--rule-2); }
.opt .ol{ font-family:var(--mono); font-weight:700; color:var(--blue); margin-right:9px; }
.opt.sel{ border-color:var(--blue); background:var(--blue-soft); }
.opt.correct{ border-color:var(--green); background:var(--green-soft); }
.opt.wrong{ border-color:var(--red); background:var(--red-soft); }
.opt.correct .ol{ color:var(--green); }
.opt.wrong .ol{ color:var(--red); }
.expl{ font-family:var(--sans); font-size:13.5px; line-height:1.5; color:var(--ink-2); margin:11px 2px 0; padding-left:12px; border-left:2px solid var(--rule-2); }
.expl b{ color:var(--ink); }
.locked-opts .opt{ cursor:default; }

.result{ border-radius:16px; padding:20px; margin:4px 0 18px; text-align:center; font-family:var(--sans); }
.result.pass{ background:var(--green-soft); border:1.5px solid var(--green-line); }
.result.fail{ background:var(--red-soft); border:1.5px solid var(--red-line); }
.result .big{ font-size:32px; font-weight:800; letter-spacing:-.02em; }
.result.pass .big{ color:var(--green); }
.result.fail .big{ color:var(--red); }
.result .rmsg{ font-size:14px; color:var(--ink-2); margin-top:4px; }

/* ── Name capture ──────────────────────────────────────────────── */
.namebox{ background:var(--card); border:1px solid transparent; border-radius:16px; padding:16px 17px; margin:0 0 20px; }
.namebox label{ font-family:var(--sans); font-weight:700; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); display:block; margin-bottom:8px; }
.namebox input{ width:100%; font-family:var(--sans); font-size:16px; padding:12px 13px; border:1.5px solid var(--rule-2); border-radius:11px; background:var(--paper); color:var(--ink); }
.namebox input:focus{ outline:none; border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-soft); }

/* ── Certificate ───────────────────────────────────────────────── */
.cert{
  background:#fff; border:1px solid var(--rule); border-radius:14px;
  padding:34px 30px; margin:6px 0 18px; text-align:center; position:relative; overflow:hidden;
  box-shadow:0 10px 34px rgba(23,58,104,.10);
}
.cert::before{ content:""; position:absolute; inset:10px; border:2px solid var(--blue); border-radius:8px; pointer-events:none; opacity:.35; }
.cert::after{ content:""; position:absolute; inset:15px; border:1px solid var(--navy); border-radius:6px; pointer-events:none; opacity:.22; }
.cert .c-brand{ font-family:var(--sans); font-weight:800; letter-spacing:.14em; font-size:12px; text-transform:uppercase; color:var(--navy); }
.cert .c-brand b{ color:var(--blue); }
.cert .c-kicker{ font-family:var(--sans); font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-2); font-weight:700; margin:20px 0 6px; }
.cert .c-course{ font-family:var(--sans); font-size:22px; font-weight:800; letter-spacing:-.01em; color:var(--ink); line-height:1.2; margin:0 auto; max-width:440px; }
.cert .c-of{ font-family:var(--sans); font-size:12.5px; color:var(--ink-2); margin:22px 0 6px; }
.cert .c-name{ font-family:var(--sans); font-size:30px; font-weight:800; letter-spacing:-.01em; color:var(--navy); border-bottom:2px solid var(--blue); display:inline-block; padding:0 26px 6px; margin:0 0 4px; }
.cert .c-body{ font-family:var(--sans); font-size:13.5px; color:var(--ink-2); max-width:440px; margin:16px auto 22px; line-height:1.55; }
.cert .c-wave{ height:24px; margin:6px auto 20px; opacity:.85; }
.cert .c-wave svg{ height:24px; width:220px; }
.cert .c-meta{ display:flex; justify-content:space-around; gap:14px; margin-top:14px; flex-wrap:wrap; }
.cert .c-cell{ text-align:center; }
.cert .c-cell .cl{ font-family:var(--sans); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--lock); font-weight:700; }
.cert .c-cell .cv{ font-family:var(--mono); font-size:13px; color:var(--ink); font-weight:600; border-top:1px solid var(--rule); padding-top:5px; margin-top:5px; min-width:120px; }

footer.adm{ border-top:1px solid var(--rule); margin-top:36px; padding:16px 0 0; text-align:center; }
.reset{ background:none; border:none; font-family:var(--mono); font-size:11px; color:var(--lock); cursor:pointer; text-decoration:underline; }

.hidden{ display:none !important; }

@media (max-width:480px){
  body{ font-size:15.5px; }
  h1.course{ font-size:23px; }
  .cert{ padding:26px 18px; }
  .cert .c-name{ font-size:25px; padding:0 14px 6px; }
  .cert .c-course{ font-size:19px; }
}
@media (prefers-reduced-motion: reduce){
  .wave path.anim{ animation:none; stroke-dashoffset:0; }
  .progbar > i{ transition:none; }
}

@media print{
  body{ background:#fff; }
  header.mon, main > *:not(#view-cert), .back, .cta-wrap, footer.adm, .print-hide{ display:none !important; }
  #view-cert{ display:block !important; }
  main{ padding:0; }
  .wrap{ max-width:none; padding:0; }
  .cert{ box-shadow:none; border:none; margin:0; }
  @page{ size:landscape; margin:14mm; }
}
</style>
</head>
<body>

<header class="mon">
  <div class="mon-inner">
    <a class="backlink print-hide" href="index.html">&#x2190; Field Guide</a>
    <div class="brandrow">
      <div class="brand">AMR Kansas City &middot; Clinical Education <b>&#x25c6;</b></div>
      <div class="status-chip" id="statusChip">SESSION &middot; READY</div>
    </div>
    <h1 class="course">Hemodynamic Monitoring</h1>
    <p class="course-sub">for Critical Care &amp; Interfacility Transport</p>
  </div>
  <div class="wave-strip">
    <svg class="wave" id="waveSvg" viewBox="0 0 1200 64" preserveAspectRatio="none" aria-hidden="true">
      <path class="trace anim" id="wavePath" d=""></path>
    </svg>
  </div>
  <div class="ticker">
    <div class="tk"><span class="lab">Modules</span><span class="val" id="tkMods">0 / 8</span></div>
    <div class="tk"><span class="lab">Progress</span><span class="val grn" id="tkPct">0%</span></div>
    <div class="tk"><span class="lab">Final Exam</span><span class="val red" id="tkFinal">Locked</span></div>
  </div>
  <div class="progbar"><i id="progFill"></i></div>
</header>

<main>
  <div class="wrap">

    <!-- ===== HOME ===== -->
    <section id="view-home">
      <div class="namebox print-hide">
        <label for="nameInput">Learner name (appears on your certificate)</label>
        <input id="nameInput" type="text" placeholder="First and last name" autocomplete="name" />
      </div>
      <p class="eyebrow">Course Modules &middot; Sequential</p>
      <ul class="modlist" id="modList"></ul>
      <div id="finalSlot"></div>
      <footer class="adm">
        <button class="reset" id="resetBtn">Reset my progress</button>
      </footer>
    </section>

    <!-- ===== READER ===== -->
    <section id="view-reader" class="hidden">
      <button class="back" id="readerBack">&#x2039; All modules</button>
      <div class="rd-num" id="rdNum"></div>
      <h2 class="rd-title" id="rdTitle"></h2>
      <div class="rd-obj" id="rdObj"></div>
      <div class="content" id="rdContent"></div>
      <div class="cta-wrap">
        <button class="cta primary" id="toQuizBtn">Start the quiz &#x203a;</button>
        <p class="readnote" id="readNote"></p>
      </div>
    </section>

    <!-- ===== QUIZ ===== -->
    <section id="view-quiz" class="hidden">
      <button class="back" id="quizBack">&#x2039; Back to module</button>
      <div class="rd-num" id="qzNum"></div>
      <h2 class="rd-title" id="qzTitle"></h2>
      <div class="qmeta" id="qzMeta"></div>
      <div id="resultSlot"></div>
      <div id="quizForm"></div>
      <div class="cta-wrap" id="quizActions"></div>
    </section>

    <!-- ===== CERTIFICATE ===== -->
    <section id="view-cert" class="hidden">
      <button class="back print-hide" id="certBack">&#x2039; All modules</button>
      <div class="cert" id="certCard"></div>
      <div class="cta-wrap print-hide">
        <button class="cta teal" id="printBtn">Print / save certificate</button>
      </div>
    </section>

  </div>
</main>

<script>
"use strict";
/* ============================================================================
   DATA — content model
   ==========================================================================*/
var PASS_MODULE = 80;   // %
var PASS_FINAL  = 85;   // %

var MODULES = [
  {
    id: 1,
    available: true,
    title: "Hemodynamic Physiology Foundations",
    desc: "The pressure–flow relationship, the four determinants of cardiac output, oxygen delivery, and what a MAP target actually buys you.",
    objective: "Explain how blood pressure, flow, and resistance relate; identify the determinants of stroke volume and oxygen delivery; and state a defensible MAP target with its evidence.",
    content: [
      { h:"1", t:"Pressure, flow, and resistance", html:
        "<p>Every hemodynamic decision you make in transport traces back to one relationship. Blood pressure is not a thing the body regulates for its own sake — it is the <em>driving pressure</em> that pushes flow through the circulation. The relationship mirrors Ohm's law:</p>"+
        "<div class='formula'><span class='fk'>MAP</span> ≈ <span class='fk'>CO</span> × <span class='fk'>SVR</span><br>&nbsp;&nbsp;(pressure = flow × resistance)</div>"+
        "<p>Mean arterial pressure (MAP) is the number that matters for perfusion, not systolic. Organs are perfused throughout the cardiac cycle, and diastole occupies about two-thirds of it, so MAP is weighted toward diastolic pressure:</p>"+
        "<div class='formula'><span class='fk'>MAP</span> = DBP + ⅓ (SBP − DBP)<br>&nbsp;&nbsp;= DBP + ⅓ × pulse pressure</div>"+
        "<p>A pressure of 120/60 gives a MAP of 60 + ⅓(60) = <strong>80 mmHg</strong>. Normal MAP runs roughly 70–100 mmHg. As a working floor, most organs autoregulate flow down to a MAP near <strong>65 mmHg</strong>; below that, flow starts to track pressure directly and perfusion falls.</p>"+
        "<p>Because MAP is the product of flow and resistance, a normal blood pressure can hide a failing patient: a low cardiac output can be masked by intense vasoconstriction (high SVR), and a high output can look hypotensive when the pipes are wide open (low SVR, as in distributive shock). Pressure alone never tells you which lever is moving.</p>"
      },
      { h:"2", t:"Cardiac output and the four determinants", html:
        "<p>Flow through the circuit is cardiac output:</p>"+
        "<div class='formula'><span class='fk'>CO</span> = <span class='fk'>HR</span> × <span class='fk'>SV</span><br>&nbsp;&nbsp;normal CO ≈ 4–8 L/min &middot; SV ≈ 60–100 mL</div>"+
        "<p>Heart rate is one lever. The other three all act on <strong>stroke volume</strong>:</p>"+
        "<ul>"+
        "<li><strong>Preload</strong> — the volume stretching the ventricle at end-diastole. More stretch, more force, up to a limit.</li>"+
        "<li><strong>Afterload</strong> — the resistance the ventricle ejects against.</li>"+
        "<li><strong>Contractility</strong> — the intrinsic strength of the squeeze, independent of load.</li>"+
        "</ul>"+
        "<p>Heart rate cuts both ways. Too slow drops output directly; too fast shortens diastole, which is when the ventricle fills and the coronaries perfuse, so extreme tachycardia can <em>reduce</em> stroke volume and output at the same time.</p>"
      },
      { h:"3", t:"Preload and the Frank–Starling relationship", html:
        "<p>The Frank–Starling mechanism describes how stretching cardiac muscle before contraction increases the force it generates. Plot preload against stroke volume and you get a curve that rises, then flattens: on the steep part, giving volume increases output; on the flat part, more volume just raises filling pressures and backs fluid into the lungs without buying you flow.</p>"+
        "<p>The clinical question — <em>will this patient's output rise if I give fluid?</em> — is the question of fluid responsiveness. And this is where a common bedside habit fails.</p>"+
        "<div class='evidence'><span class='etag'>Evidence check — CVP</span>"+
        "<p>Central venous pressure (CVP) is a poor predictor of fluid responsiveness. Systematic reviews across dozens of studies found essentially no reliable relationship between a static CVP value and whether cardiac output will rise with a fluid bolus (Marik and colleagues, 2008 and 2013).</p>"+
        "<p>Dynamic measures perform far better: pulse-pressure or stroke-volume variation in a passively ventilated patient, or the change in output after a passive leg raise. Use trends and dynamic responses, not a single filling pressure.</p>"+
        "<div class='grade'>Quality: moderate–high (consistent across multiple systematic reviews of mostly observational and physiologic data).</div></div>"
      },
      { h:"4", t:"Afterload", html:
        "<p>Afterload is the load the ventricle works against to eject. For the left ventricle it is dominated by systemic vascular resistance and aortic impedance, but wall stress is the truer physiologic picture. Laplace's law captures it:</p>"+
        "<div class='formula'>wall tension ∝ (<span class='fk'>Pressure</span> × <span class='fk'>radius</span>) / wall thickness</div>"+
        "<p>Two consequences matter in transport. First, a dilated ventricle (large radius) faces higher wall stress at any given pressure, which is part of why the failing, dilated heart is exquisitely <strong>afterload-sensitive</strong> — lowering afterload can raise its stroke volume. Second, this is the lever that vasodilators and vasoconstrictors pull. A pressor that clamps down SVR raises MAP but can drop the output of a weak ventricle; a vasodilator can unload that same ventricle and improve flow while lowering pressure.</p>"
      },
      { h:"5", t:"Contractility", html:
        "<p>Contractility (inotropy) is the strength of contraction at a fixed preload and afterload — the property inotropes change and ischemia degrades. You cannot measure it directly at the bedside, but ejection fraction is a rough surrogate, and the pressure response to an inotrope is a functional one.</p>"+
        "<p>The practical point: preload, afterload, and contractility are independent levers. A patient can be adequately filled, with normal resistance, and still fail to generate output because the pump is weak. Recognizing <em>which</em> lever is broken is what separates a reflexive fluid bolus from the right intervention.</p>"
      },
      { h:"6", t:"From pressure to perfusion: oxygen delivery", html:
        "<p>Blood pressure is a means, not the end. The end is oxygen delivered to tissue:</p>"+
        "<div class='formula'><span class='fk'>DO₂</span> = <span class='fk'>CO</span> × <span class='fk'>CaO₂</span> × 10<br>CaO₂ = (1.34 × Hgb × SaO₂) + (0.003 × PaO₂)</div>"+
        "<p>Read the second equation carefully. Oxygen <em>content</em> is carried almost entirely by hemoglobin bound to O₂; the dissolved fraction (0.003 × PaO₂) is trivial. That is why a patient with a good saturation and a low hemoglobin, or a good pressure and a low output, can still be starving tissue of oxygen. Delivery is the product of flow and content — optimizing one while ignoring the other is a common error.</p>"+
        "<p>Because you cannot see DO₂ on the monitor, you infer perfusion adequacy from downstream markers: lactate (rising with anaerobic metabolism), and central or mixed venous oxygen saturation (ScvO₂ / SvO₂), which falls as tissues extract more oxygen from a falling supply.</p>"+
        "<div class='keybox'><span class='kt'>Anchor</span> A normal blood pressure does not guarantee perfusion. MAP is a surrogate for organ perfusion <em>pressure</em>; DO₂, lactate, and venous saturation are closer to the thing you actually care about.</div>"
      },
      { h:"7", t:"What MAP target should you actually chase?", html:
        "<p>MAP ≥ 65 mmHg is the conventional resuscitation floor, but the evidence tells a more nuanced story than a single universal number.</p>"+
        "<div class='evidence'><span class='etag'>Evidence check — MAP targets</span>"+
        "<p><b>SEPSISPAM</b> (Asfar et al., NEJM 2014) randomized septic-shock patients to a high MAP target (80–85) versus 65–70. There was no overall mortality difference, and the higher target caused more atrial fibrillation. But a pre-specified subgroup with <em>chronic hypertension</em> had less renal injury and less need for dialysis at the higher target.</p>"+
        "<p><b>The 65 Trial</b> (Lamontagne et al., JAMA 2020) tested permissive hypotension (target 60–65) in vasodilatory shock in patients 65 and older. It reduced vasopressor exposure with no clear increase in mortality — supporting a lower target in older patients.</p>"+
        "<p><b>Bottom line:</b> MAP 65 is a reasonable default. Individualize upward for chronic hypertensives (their autoregulation is reset higher) and consider tolerating the low-to-mid 60s in older vasodilatory-shock patients rather than chasing pressure with escalating vasopressors.</p>"+
        "<div class='grade'>Quality: high for the default (multiple RCTs); the individualized adjustments rest partly on subgroup and trial-specific findings — apply with judgment.</div></div>"
      },
      { h:"8", t:"The shock lens", html:
        "<p>Everything in this course fits into one diagnostic frame. When perfusion fails, the problem is almost always one (or a mix) of:</p>"+
        "<ul>"+
        "<li><strong>The pump</strong> — cardiogenic. Output fails despite adequate volume. This is where inotropes, the balloon pump, Impella, and ECMO live.</li>"+
        "<li><strong>The tank</strong> — hypovolemic or distributive. Not enough volume, or a tank that has become too large (vasodilation). Volume and vasopressors.</li>"+
        "<li><strong>The pipes / obstruction</strong> — resistance too low (distributive) or flow mechanically blocked (tamponade, tension pneumothorax, PE).</li>"+
        "</ul>"+
        "<p>Hold this frame as you move through arterial-line monitoring, the pharmacology of raising and lowering pressure, and the mechanical support devices. Each one is a tool for a specific broken lever — and using the right tool depends on correctly reading which lever failed.</p>"
      }
    ],
    quiz: [
      { q:"A patient's blood pressure is 120/60 mmHg. What is the approximate MAP?",
        opts:["70 mmHg","80 mmHg","90 mmHg","100 mmHg"], ans:1,
        expl:"MAP = DBP + ⅓(SBP−DBP) = 60 + ⅓(60) = 80 mmHg. MAP is weighted toward diastolic because diastole occupies most of the cardiac cycle." },
      { q:"Which relationship correctly expresses mean arterial pressure?",
        opts:["MAP = HR × SV","MAP ≈ CO × SVR","MAP = SV ÷ SVR","MAP = CaO₂ × Hgb"], ans:1,
        expl:"MAP ≈ CO × SVR is the circulatory analog of Ohm's law (pressure = flow × resistance). CO = HR × SV is a separate relationship describing flow itself." },
      { q:"Cardiac output is the product of which two variables?",
        opts:["MAP and SVR","Preload and afterload","Heart rate and stroke volume","Hemoglobin and SaO₂"], ans:2,
        expl:"CO = HR × SV. Heart rate and stroke volume are the two direct determinants; preload, afterload, and contractility act on stroke volume." },
      { q:"Which of the following is NOT one of the three determinants of stroke volume?",
        opts:["Preload","Afterload","Contractility","Hemoglobin concentration"], ans:3,
        expl:"Stroke volume is set by preload, afterload, and contractility. Hemoglobin affects oxygen content and delivery, not stroke volume." },
      { q:"According to current evidence, a single central venous pressure (CVP) value is best described as:",
        opts:["An accurate predictor of fluid responsiveness","A poor predictor of fluid responsiveness","The gold standard for preload assessment","Directly proportional to stroke volume"], ans:1,
        expl:"Systematic reviews (Marik et al.) found essentially no reliable relationship between a static CVP and whether output will rise with fluid. Dynamic measures and passive leg raise perform far better." },
      { q:"In the oxygen delivery equation, oxygen content (CaO₂) is carried almost entirely by:",
        opts:["Dissolved oxygen (0.003 × PaO₂)","Hemoglobin bound to oxygen (1.34 × Hgb × SaO₂)","Plasma bicarbonate","Cardiac output"], ans:1,
        expl:"The hemoglobin-bound term dominates; the dissolved fraction is trivial. This is why a low hemoglobin impairs delivery even with a normal PaO₂ and saturation." },
      { q:"Why is the dilated, failing left ventricle described as 'afterload-sensitive'?",
        opts:["A larger radius raises wall stress at any given pressure, so lowering afterload can improve stroke volume","Dilation eliminates the need for preload","Afterload has no effect on a failing ventricle","Higher afterload always improves output in heart failure"], ans:0,
        expl:"By Laplace's law, wall tension rises with radius. The dilated ventricle faces high wall stress, so unloading it (lowering afterload) can raise stroke volume even as pressure falls." },
      { q:"A patient has MAP 70, but lactate is rising and ScvO₂ is falling. The best interpretation is:",
        opts:["Perfusion is adequate because MAP is above 65","An adequate pressure does not guarantee adequate oxygen delivery","The lactate is certainly a lab error","Afterload must be too low"], ans:1,
        expl:"MAP is a surrogate for perfusion pressure, not delivery. Rising lactate and falling venous saturation suggest oxygen delivery is failing to meet demand despite an acceptable pressure." },
      { q:"What did SEPSISPAM (2014) find about targeting a higher MAP (80–85) vs 65–70 in septic shock?",
        opts:["Higher target reduced mortality in all patients","No overall mortality difference, but chronic-hypertension patients had less renal injury at the higher target","Higher target caused fewer arrhythmias","Lower target was uniformly harmful"], ans:1,
        expl:"SEPSISPAM showed no overall mortality benefit and more atrial fibrillation at the higher target, but a chronic-hypertension subgroup had less renal injury / less dialysis at 80–85." },
      { q:"Using the shock lens, cardiogenic shock is fundamentally a problem with:",
        opts:["The tank (volume)","The pipes (resistance)","The pump (output despite adequate volume)","Oxygen content only"], ans:2,
        expl:"Cardiogenic shock is a pump problem — output fails despite adequate filling. It is the domain of inotropes and mechanical support (IABP, Impella, ECMO)." }
    ]
  },

  { id:2, available:false, title:"Arterial Line Monitoring",
    desc:"Leveling and zeroing to the phlebostatic axis, waveform components, the square-wave (damping) test, and troubleshooting a bad tracing." },
  { id:3, available:false, title:"Pharmacology I — Managing the Hypotensive Patient",

/* ============================================================================
   STATE
   ==========================================================================*/
var LS_KEY = "hemo_academy_v1";
var state = loadState();

function blankState(){
  var m = {};
  MODULES.forEach(function(mod){ m[mod.id] = { read:false, passed:false, best:0 }; });
  return { learnerName:"", modules:m, finalPassed:false, completedAt:null };
}
function loadState(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(!raw) return blankState();
    var s = JSON.parse(raw);
    var base = blankState();
    base.learnerName = s.learnerName || "";
    base.finalPassed = !!s.finalPassed;
    base.completedAt = s.completedAt || null;
    MODULES.forEach(function(mod){
      if(s.modules && s.modules[mod.id]) base.modules[mod.id] = {
        read:!!s.modules[mod.id].read, passed:!!s.modules[mod.id].passed, best:s.modules[mod.id].best||0 };
    });
    return base;
  }catch(e){ return blankState(); }
}
function saveState(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }

/* progression helpers */
function isUnlocked(modId){
  if(modId === 1) return true;
  return !!(state.modules[modId-1] && state.modules[modId-1].passed);
}
function allModulesPassed(){
  return MODULES.every(function(m){ return state.modules[m.id] && state.modules[m.id].passed; });
}
function passedCount(){
  return MODULES.filter(function(m){ return state.modules[m.id] && state.modules[m.id].passed; }).length;
}
function getModule(id){ for(var i=0;i<MODULES.length;i++){ if(MODULES[i].id===id) return MODULES[i]; } return null; }

/* ============================================================================
   WAVEFORM (header signature) — tile arterial beats into an SVG path
   ==========================================================================*/
function buildWave(){
  var beatW = 150, n = 9, baseY = 46, path = "M 0 "+baseY;
  for(var i=0;i<n;i++){
    var x = i*beatW;
    // baseline drift into upstroke, sharp systolic peak, dicrotic notch, runoff
    path += " L "+(x+18)+" "+baseY;
    path += " C "+(x+24)+" "+baseY+" "+(x+30)+" 8 "+(x+40)+" 8";      // steep systolic upstroke to peak
    path += " C "+(x+50)+" 8 "+(x+56)+" 24 "+(x+64)+" 27";            // decline
    path += " L "+(x+72)+" 30";                                        // toward notch
    path += " C "+(x+76)+" 33 "+(x+78)+" 20 "+(x+86)+" 20";           // dicrotic notch + wave
    path += " C "+(x+96)+" 20 "+(x+104)+" 36 "+(x+118)+" "+(baseY-3); // diastolic runoff
    path += " L "+(x+beatW)+" "+baseY;
  }
  document.getElementById("wavePath").setAttribute("d", path);
}
function certWavePath(){
  var beatW=55, n=4, baseY=18, path="M 0 "+baseY;
  for(var i=0;i<n;i++){ var x=i*beatW;
    path+=" L "+(x+8)+" "+baseY+" C "+(x+11)+" "+baseY+" "+(x+13)+" 3 "+(x+18)+" 3";
    path+=" C "+(x+22)+" 3 "+(x+25)+" 11 "+(x+29)+" 12 L "+(x+33)+" 13";
    path+=" C "+(x+35)+" 15 "+(x+36)+" 9 "+(x+40)+" 9 C "+(x+45)+" 9 "+(x+49)+" 16 "+(x+beatW)+" "+baseY;
  }
  return path;
}

/* ============================================================================
   VIEWS
   ==========================================================================*/
var views = ["home","reader","quiz","cert"];
function show(v){
  views.forEach(function(name){
    document.getElementById("view-"+name).classList.toggle("hidden", name!==v);
  });
  window.scrollTo(0,0);
}

function updateHeader(){
  var pc = passedCount(), pct = Math.round((pc/ (MODULES.length+1))*100);
  if(state.finalPassed) pct = 100;
  document.getElementById("tkMods").textContent = pc + " / " + MODULES.length;
  document.getElementById("tkPct").textContent = pct + "%";
  document.getElementById("progFill").style.width = pct + "%";
  var fin = document.getElementById("tkFinal");
  if(state.finalPassed){ fin.textContent="Complete"; fin.className="val grn"; }
  else if(allModulesPassed()){ fin.textContent="Ready"; fin.className="val grn"; }
  else { fin.textContent="Locked"; fin.className="val red"; }
  document.getElementById("statusChip").textContent =
    state.learnerName ? ("SESSION · "+state.learnerName.toUpperCase().slice(0,22)) : "SESSION · READY";
}

function renderHome(){
  updateHeader();
  var list = document.getElementById("modList");
  list.innerHTML = "";
  MODULES.forEach(function(mod){
    var st = state.modules[mod.id];
    var unlocked = isUnlocked(mod.id);
    var openable = unlocked && mod.available;
    var li = document.createElement("li");
    li.className = "modcard " + (st.passed ? "passed " : "") + (openable ? "open " : "locked ");
    var pill, go="";
    if(st.passed){ pill = "<span class='pill passed'>✓ Passed · "+st.best+"%</span>"; go="<span class='go'>Review ›</span>"; }
    else if(openable){ pill = "<span class='pill ready'>Ready</span>"; go="<span class='go'>Start ›</span>"; }
    else if(unlocked && !mod.available){ pill = "<span class='pill soon'>Content in development</span>"; }
    else { pill = "<span class='pill locked'>"+lockSvg()+"Locked</span>"; }
    li.innerHTML =
      "<div class='num'>"+pad2(mod.id)+"</div>"+
      "<div class='body'>"+
        "<div class='mtitle'>"+mod.title+"</div>"+
        "<p class='mdesc'>"+mod.desc+"</p>"+
        "<div class='foot'>"+pill+go+"</div>"+
      "</div>";
    if(openable) li.addEventListener("click", function(){ openReader(mod.id); });
    list.appendChild(li);
  });

  // final exam slot
  var slot = document.getElementById("finalSlot");
  var ready = allModulesPassed();
  slot.innerHTML =
    "<div class='modcard finalcard "+(ready?"open ready":"locked")+"' id='finalCard'>"+
      "<div class='num'>⚑</div>"+
      "<div class='body'>"+
        "<div class='mtitle'>Final Examination</div>"+
        "<p class='mdesc'>Comprehensive exam across all modules. Pass at "+PASS_FINAL+"% to earn your certificate.</p>"+
        "<div class='foot'>"+
          (state.finalPassed
            ? "<span class='pill passed'>✓ Passed</span><span class='go'>View certificate ›</span>"
            : ready ? "<span class='pill ready'>Unlocked</span><span class='go'>Begin ›</span>"
                    : "<span class='pill locked'>"+lockSvg()+"Complete all modules</span>")+
        "</div>"+
      "</div>"+
    "</div>";
  var fc = document.getElementById("finalCard");
  if(state.finalPassed) fc.addEventListener("click", function(){ renderCertificate(); show("cert"); });
  else if(ready) fc.addEventListener("click", startFinal);

  show("home");
}

/* ---- Reader ---- */
var currentModId = null, scrolledEnough = false;
function openReader(id){
  var mod = getModule(id);
  if(!mod || !mod.available) return;
  currentModId = id;
  document.getElementById("rdNum").textContent = "MODULE "+pad2(id);
  document.getElementById("rdTitle").textContent = mod.title;
  document.getElementById("rdObj").innerHTML = "<strong>Objective.</strong> "+mod.objective;
  var c = document.getElementById("rdContent"), html="";
  mod.content.forEach(function(sec){
    html += "<h3><span class='h3n'>"+sec.h+"</span>"+sec.t+"</h3>"+sec.html;
  });
  c.innerHTML = html;

  // gate the quiz button until the reader is scrolled through (honest "must read")
  var btn = document.getElementById("toQuizBtn");
  var note = document.getElementById("readNote");
  var alreadyRead = state.modules[id].read || state.modules[id].passed;
  scrolledEnough = alreadyRead;
  btn.disabled = !alreadyRead;
  note.textContent = alreadyRead ? "" : "Scroll through the full module to unlock the quiz.";
  show("reader");
}
function onReaderScroll(){
  if(scrolledEnough) return;
  var sec = document.getElementById("view-reader");
  if(sec.classList.contains("hidden")) return;
  var doc = document.documentElement;
  var reachedBottom = (window.innerHeight + window.scrollY) >= (doc.scrollHeight - 120);
  if(reachedBottom){
    scrolledEnough = true;
    if(currentModId){ state.modules[currentModId].read = true; saveState(); }
    document.getElementById("toQuizBtn").disabled = false;
    document.getElementById("readNote").textContent = "Module read — quiz unlocked.";
  }
}

/* ---- Quiz (modules) ---- */
var activeQuiz = null;     // {questions, isFinal, modId, answers[], submitted}
function startModuleQuiz(id){
  var mod = getModule(id);
  activeQuiz = { questions:mod.quiz, isFinal:false, modId:id, answers:new Array(mod.quiz.length).fill(-1), submitted:false, title:mod.title, num:"MODULE "+pad2(id) };
  renderQuiz();
}
function startFinal(){
  var pool = [];
  MODULES.forEach(function(m){ if(m.quiz){ m.quiz.forEach(function(q){ pool.push(q); }); } });
  activeQuiz = { questions:pool, isFinal:true, modId:null, answers:new Array(pool.length).fill(-1), submitted:false, title:"Final Examination", num:"FINAL EXAM" };
  renderQuiz();
}
function renderQuiz(){
  var q = activeQuiz;
  document.getElementById("qzNum").textContent = q.num;
  document.getElementById("qzTitle").textContent = q.submitted ? q.title+" — Results" : q.title;
  var need = q.isFinal ? PASS_FINAL : PASS_MODULE;
  document.getElementById("qzMeta").textContent =
    q.questions.length+" questions · pass at "+need+"% · "+Math.ceil(q.questions.length*need/100)+" correct needed";

  var form = document.getElementById("quizForm"); form.innerHTML="";
  q.questions.forEach(function(item, qi){
    var box = document.createElement("div"); box.className="q"+(q.submitted?" locked-opts":"");
    var opts = "";
    item.opts.forEach(function(o, oi){
      var cls="opt";
      if(q.submitted){
        if(oi===item.ans) cls+=" correct";
        else if(q.answers[qi]===oi) cls+=" wrong";
      } else if(q.answers[qi]===oi){ cls+=" sel"; }
      opts += "<button class='"+cls+"' data-q='"+qi+"' data-o='"+oi+"'>"+
                "<span class='ol'>"+String.fromCharCode(65+oi)+"</span>"+o+"</button>";
    });
    var expl = q.submitted ? "<div class='expl'><b>Why:</b> "+item.expl+"</div>" : "";
    box.innerHTML = "<div class='qnum'>Q"+(qi+1)+" / "+q.questions.length+"</div>"+
                    "<div class='qtext'>"+item.q+"</div>"+opts+expl;
    form.appendChild(box);
  });
  if(!q.submitted){
    form.querySelectorAll(".opt").forEach(function(b){
      b.addEventListener("click", function(){
        var qi=+b.dataset.q, oi=+b.dataset.o;
        activeQuiz.answers[qi]=oi;
        renderQuiz();
      });
    });
  }

  var actions = document.getElementById("quizActions");
  document.getElementById("resultSlot").innerHTML = "";
  if(!q.submitted){
    var answered = q.answers.filter(function(a){return a>=0;}).length;
    actions.innerHTML = "<button class='cta primary' id='submitQuiz'"+(answered<q.questions.length?" disabled":"")+">Submit answers</button>"+
      "<p class='readnote'>"+answered+" of "+q.questions.length+" answered</p>";
    var sb=document.getElementById("submitQuiz");
    if(sb) sb.addEventListener("click", submitQuiz);
  } else {
    var correct = scoreQuiz();
    var pct = Math.round(correct/q.questions.length*100);
    var passed = pct >= need;
    document.getElementById("resultSlot").innerHTML =
      "<div class='result "+(passed?"pass":"fail")+"'>"+
        "<div class='big'>"+pct+"%</div>"+
        "<div class='rmsg'>"+correct+" of "+q.questions.length+" correct · "+
        (passed? "Passed — "+ (q.isFinal?"course complete":"next module unlocked") : "Need "+need+"% to pass")+"</div>"+
      "</div>";
    if(passed){
      if(q.isFinal){
        actions.innerHTML = "<button class='cta teal' id='toCert'>View your certificate ›</button>";
        document.getElementById("toCert").addEventListener("click", function(){ renderCertificate(); show("cert"); });
      } else {
        actions.innerHTML = "<button class='cta teal' id='backHome'>Back to modules ›</button>";
        document.getElementById("backHome").addEventListener("click", function(){ renderHome(); });
      }
    } else {
      actions.innerHTML = "<button class='cta primary' id='retry'>Retake quiz</button>"+
                          "<button class='cta ghost' id='reread' style='margin-top:10px'>Re-read the module</button>";
      document.getElementById("retry").addEventListener("click", function(){
        if(q.isFinal) startFinal(); else startModuleQuiz(q.modId);
      });
      document.getElementById("reread").addEventListener("click", function(){
        if(q.isFinal){ renderHome(); } else { openReader(q.modId); }
      });
    }
  }
  show("quiz");
}
function scoreQuiz(){
  var c=0; activeQuiz.questions.forEach(function(item,i){ if(activeQuiz.answers[i]===item.ans) c++; }); return c;
}
function submitQuiz(){
  activeQuiz.submitted = true;
  var correct = scoreQuiz();
  var pct = Math.round(correct/activeQuiz.questions.length*100);
  var need = activeQuiz.isFinal ? PASS_FINAL : PASS_MODULE;
  var passed = pct >= need;
  if(activeQuiz.isFinal){
    if(passed){ state.finalPassed=true; state.completedAt = new Date().toISOString(); }
  } else {
    var m = state.modules[activeQuiz.modId];
    if(pct > m.best) m.best = pct;
    if(passed) m.passed = true;
  }
  saveState();
  updateHeader();
  renderQuiz();
}
